# HiveOS sources this file from the installed package directory.
pepew_manifest_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
CUSTOM_NAME="$(basename "${pepew_manifest_dir}")"
CUSTOM_VERSION="$(cat "${pepew_manifest_dir}/VERSION")"
CUSTOM_CONFIG_FILENAME="${pepew_manifest_dir}/config.txt"
CUSTOM_LOG_BASENAME="/var/log/miner/custom/${CUSTOM_NAME}/pepew"
MINER_NAME=$CUSTOM_NAME
MINER_VERSION=$CUSTOM_VERSION
MINER_CONFIG_FILENAME=$CUSTOM_CONFIG_FILENAME
MINER_LOG_BASENAME=$CUSTOM_LOG_BASENAME
unset pepew_manifest_dir
