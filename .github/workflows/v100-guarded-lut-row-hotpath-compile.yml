name: V100 Guarded LUT Row Hotpath Compile Gate

on:
  push:
    branches:
      - agent/v21-v100-guarded-duallut-rowcp
    paths:
      - 'native/src/cuda/guarded_lut_primitives.cuh'
      - 'native/tests/guarded_lut_row_hotpath_compile_probe.cu'
      - '.github/workflows/v100-guarded-lut-row-hotpath-compile.yml'
  workflow_dispatch:

jobs:
  compile-sm70:
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile production-helper guarded row hotpath for sm_70
        shell: bash
        run: |
          set -euo pipefail
          nvcc -std=c++20 -arch=sm_70 --fmad=false -Xptxas=-v \
            -I native/include -I native/src/cuda \
            -c native/tests/guarded_lut_row_hotpath_compile_probe.cu \
            -o /tmp/guarded_lut_row_hotpath_compile_probe.o \
            2>&1 | tee /tmp/ptxas.log
          echo '=== guarded hotpath ptxas summary ==='
          grep -E 'guarded_lut_row_hotpath_compile_probe|Used [0-9]+ registers|spill|stack frame|barrier' /tmp/ptxas.log || true
          if grep -Eq '[1-9][0-9]* bytes spill stores|[1-9][0-9]* bytes spill loads' /tmp/ptxas.log; then
            echo 'ERROR: guarded row hotpath spills on sm_70'
            exit 1
          fi
