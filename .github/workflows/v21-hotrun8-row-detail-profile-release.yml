name: v2.1 HotRun8 Row Detail Profile Release

on:
  push:
    branches: [agent/v21-v100-hotrun8-residual-profile]
    paths:
      - '.github/workflows/v21-hotrun8-row-detail-profile-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ninja-build g++ git gh ca-certificates curl python3 xz-utils
          command -v gh
          gh --version
          CMAKE_VER=3.31.8
          curl -fL --retry 3 --retry-delay 2 "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz" -o /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          ln -sf /opt/cmake/bin/cmake /usr/local/bin/cmake

      - name: Instrument exact row detail profile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/instrument_hotrun8_row_detail_profile.py
          grep -q 'g_row_detail_warm_prepare_cycles' native/src/cuda/v1/header80_hotrun8.inc
          grep -q 'PEPEW_ROW_DETAIL_PROFILE' native/src/cuda/v1/header80_backend_part07.inc

      - name: Build, correctness and resource gate
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B /tmp/rowdetail -G Ninja \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=ON \
            -DPEPEPOW_CUDA_ARCHITECTURES=70-real \
            -DPEPEPOW_CUDA_THREADS=704 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            -DPEPEPOW_CUDA_SCALED_MATRIX=OFF \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON \
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON \
            -DPEPEPOW_CUDA_SW_STATE_MODE=3 \
            -DPEPEPOW_CUDA_BYTE_UNROLL=1 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=ON \
            -DPEPEPOW_CUDA_HOTRUN8=ON \
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            '-DCMAKE_CUDA_FLAGS=-DPEPEPOW_CUDA_HOTRUN8_FUSION_MODE=0 -DPEPEPOW_CUDA_ROW_DETAIL_PROFILE=1'
          cmake --build /tmp/rowdetail --target pepepow_header80_benchmark pepepow_core_tests -j2 2>&1 | tee /tmp/rowdetail-build.log
          /tmp/rowdetail/pepepow_core_tests | tee /tmp/rowdetail-core-tests.log
          if grep -Eq '[1-9][0-9]* bytes spill stores|[1-9][0-9]* bytes spill loads' /tmp/rowdetail-build.log; then
            echo 'ERROR: row detail profiler contains CUDA spills on sm_70' >&2
            exit 1
          fi
          grep -A2 -F 'hoohash_mix_hotrun8_split_kernel' /tmp/rowdetail-build.log | tail -3 | tee /tmp/rowdetail-resource.txt

      - name: Package immutable diagnostic
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          TAG="v2.1-hotrun8-row-detail-profile-${SHORT}-v100"
          mkdir -p /tmp/rowdetailpkg
          cp /tmp/rowdetail/pepepow_header80_benchmark /tmp/rowdetailpkg/pepepow_header80_benchmark_hotrun8_row_detail_profile
          cp /tmp/rowdetail-build.log /tmp/rowdetailpkg/row-detail-profile-build.log
          cp /tmp/rowdetail-core-tests.log /tmp/rowdetailpkg/core-tests.log
          cp /tmp/rowdetail-resource.txt /tmp/rowdetailpkg/resource.txt
          cat > /tmp/rowdetailpkg/build-info.txt <<EOF
          source_branch=agent/v21-v100-hotrun8-residual-profile
          source_commit=${GITHUB_SHA}
          cuda_toolkit=12.8.1
          cuda_arch=sm_70
          architecture=hotrun8-row-detail-profile
          sample_predicate=first_pass0_low12_zero
          sample_rate_nominal=1/4096
          timing=row-total-warm-prepare-warm-commit-scalar-cold-scalar-warm
          exact_path=true
          candidate_spills=0
          pool_submission=false
          EOF
          tar -C /tmp/rowdetailpkg -czf /tmp/PepeW-v2.1-HotRun8-RowDetailProfile-V100.tar.gz .
          sha256sum /tmp/PepeW-v2.1-HotRun8-RowDetailProfile-V100.tar.gz | tee /tmp/PepeW-v2.1-HotRun8-RowDetailProfile-V100.tar.gz.sha256
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease diagnostic asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          set -euo pipefail
          command -v gh
          gh release create "$TAG" \
            /tmp/PepeW-v2.1-HotRun8-RowDetailProfile-V100.tar.gz \
            /tmp/PepeW-v2.1-HotRun8-RowDetailProfile-V100.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "PepeW-Miner-v2.1 BETA HotRun8 Row Detail Profile" \
            --notes "Exact diagnostic-only V100 matrix-row detail profile. No pool submission. Protected baseline is not modified."
