name: V2 Hot-Run8 Split Middle SM70 Gate

on:
  push:
    branches:
      - agent/v21-v100-hotrun8-split
    paths:
      - native/src/cuda/v1/header80_hotrun8.inc
      - native/src/cuda/header80_backend.cu
      - .github/workflows/v21-hotrun8-split-sm70.yml
  workflow_dispatch:

jobs:
  split-middle-resource:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile split hotrun8 middle stage for Volta
        shell: bash
        run: |
          set -euo pipefail
          /usr/local/cuda/bin/nvcc -std=c++20 -O3 -arch=sm_70 -lineinfo \
            -I native/include \
            -DPEPEPOW_CUDA_THREADS=704 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=1 \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=1 \
            -DPEPEPOW_CUDA_ASSUME_FINITE=1 \
            -DPEPEPOW_CUDA_HOTRUN8=1 \
            -Xptxas=-v \
            -c native/src/cuda/header80_backend.cu \
            -o /tmp/header80-hotrun8-split.o 2>&1 | tee /tmp/ptxas-hotrun8-split.log
          test -s /tmp/header80-hotrun8-split.o
          grep -q 'hoohash_mix_hotrun8_split_kernel' /tmp/ptxas-hotrun8-split.log

          resource_line="$(awk '
            /hoohash_mix_hotrun8_split_kernel/ { seen=1 }
            seen && /bytes stack frame, [0-9]+ bytes spill stores, [0-9]+ bytes spill loads/ { print; exit }
          ' /tmp/ptxas-hotrun8-split.log)"
          test -n "$resource_line"
          stack="$(printf '%s\n' "$resource_line" | sed -n 's/.*[^0-9]\([0-9][0-9]*\) bytes stack frame.*/\1/p')"
          stores="$(printf '%s\n' "$resource_line" | sed -n 's/.*stack frame, \([0-9][0-9]*\) bytes spill stores.*/\1/p')"
          loads="$(printf '%s\n' "$resource_line" | sed -n 's/.*spill stores, \([0-9][0-9]*\) bytes spill loads.*/\1/p')"
          test -n "$stack" && test -n "$stores" && test -n "$loads"
          echo "split_stack_bytes=$stack"
          echo "split_spill_store_bytes=$stores"
          echo "split_spill_load_bytes=$loads"
          test "$stores" -eq 0
          test "$loads" -eq 0
      - name: Upload resource log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotrun8-split-sm70-${{ github.sha }}
          path: /tmp/ptxas-hotrun8-split.log
          if-no-files-found: warn
          retention-days: 30
