name: V2.1 Fusion2 SharedFP128 Hosted Gate

on:
  push:
    branches:
      - agent/v21-v100-fusion2-sharedfp128
    paths:
      - '.github/workflows/v21-fusion2-sharedfp128-package.yml'
      - 'native/src/cuda/v1/header80_backend_part00.inc'
      - 'native/src/cuda/v1/header80_backend_part07.inc'
      - 'native/src/cuda/v1/header80_hotrun8_fusion.inc'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - name: Install hosted build tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ninja-build g++ git ca-certificates curl python3 xz-utils
          CMAKE_VER=3.31.8
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz" \
            -o /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          ln -sf /opt/cmake/bin/cmake /usr/local/bin/cmake

      - uses: actions/checkout@v4

      - name: Build verified fusion2 baseline and bounded shared-state candidate
        shell: bash
        run: |
          set -euo pipefail
          common=(
            -G Ninja
            -DPEPEPOW_ENABLE_CUDA=ON
            -DPEPEPOW_BUILD_TESTS=ON
            -DPEPEPOW_CUDA_ARCHITECTURES=70-real
            -DPEPEPOW_CUDA_SCALED_MATRIX=OFF
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON
            -DPEPEPOW_CUDA_SW_STATE_MODE=3
            -DPEPEPOW_CUDA_BYTE_UNROLL=1
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=ON
            -DPEPEPOW_CUDA_HOTRUN8=ON
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc
          )

          cmake -S native -B /tmp/baseline "${common[@]}" \
            -DPEPEPOW_CUDA_THREADS=704 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            '-DCMAKE_CUDA_FLAGS=-DPEPEPOW_CUDA_HOTRUN8_FUSION_MODE=2'
          cmake --build /tmp/baseline \
            --target pepepow_header80_benchmark -j2 \
            2>&1 | tee /tmp/baseline-build.log

          cmake -S native -B /tmp/candidate "${common[@]}" \
            -DPEPEPOW_CUDA_THREADS=128 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=8 \
            '-DCMAKE_CUDA_FLAGS=-DPEPEPOW_CUDA_HOTRUN8_FUSION_MODE=2 -DPEPEPOW_CUDA_HOTRUN8_SHARED_FIRSTPASS=1'
          cmake --build /tmp/candidate \
            --target pepepow_header80_benchmark pepepow_header80_differential pepepow_core_tests -j2 \
            2>&1 | tee /tmp/candidate-build.log
          /tmp/candidate/pepepow_core_tests | tee /tmp/core-tests.log

          if grep -Eq '[1-9][0-9]* bytes spill stores|[1-9][0-9]* bytes spill loads' /tmp/candidate-build.log; then
            echo 'ERROR: sharedfp128 candidate contains CUDA spills on sm_70'
            exit 1
          fi
          grep -q 'hoohash_final_hotrun8_fused_kernel' /tmp/candidate-build.log
          grep -A3 -F 'hoohash_final_hotrun8_fused_kernel' /tmp/candidate-build.log | tail -4 | tee /tmp/candidate-resource.txt
          grep -Eq 'Used ([0-5]?[0-9]|6[0-4]) registers' /tmp/candidate-resource.txt || {
            echo 'ERROR: candidate did not reach the <=64-register occupancy gate'
            cat /tmp/candidate-resource.txt
            exit 1
          }

          mkdir -p /tmp/pkg
          cp /tmp/baseline/pepepow_header80_benchmark /tmp/pkg/pepepow_header80_benchmark_baseline_fusion2
          cp /tmp/candidate/pepepow_header80_benchmark /tmp/pkg/pepepow_header80_benchmark_candidate_sharedfp128
          cp /tmp/candidate/pepepow_header80_differential /tmp/pkg/pepepow_header80_differential_candidate
          cp /tmp/baseline-build.log /tmp/pkg/baseline-build.log
          cp /tmp/candidate-build.log /tmp/pkg/candidate-build.log
          cp /tmp/core-tests.log /tmp/pkg/core-tests.log
          cp /tmp/candidate-resource.txt /tmp/pkg/candidate-resource.txt
          cat > /tmp/pkg/build-info.txt <<EOF
          source_branch=agent/v21-v100-fusion2-sharedfp128
          source_commit=${GITHUB_SHA}
          cuda_toolkit=12.8.1
          cuda_arch=sm_70
          baseline=hotrun8-fusion2-sw-cvt-threads704
          baseline_offline_reference_mhs=8.818928
          candidate=hotrun8-fusion2-shared-firstpass-threads128-minblocks8
          candidate_dynamic_shared_bytes_per_thread=32
          candidate_register_gate=64
          candidate_spills=0
          architecture_evidence=foztor-runtime-47regs-36B-per-thread-shared-block32-or64
          predicted_occupancy_uplift_pct=45.45
          real_pool_allowed=false
          EOF
          tar -C /tmp/pkg -czf /tmp/PepeW-v2.1-Fusion2-SharedFP128-V100-Offline-Bench.tar.gz .
          sha256sum /tmp/PepeW-v2.1-Fusion2-SharedFP128-V100-Offline-Bench.tar.gz \
            | tee /tmp/PepeW-v2.1-Fusion2-SharedFP128-V100-Offline-Bench.tar.gz.sha256

      - name: Publish immutable offline package and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: PepeW-v2.1-Fusion2-SharedFP128-V100-Offline-Bench.tar.gz
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          tag="v2.1-fusion2-sharedfp128-${short}-v100"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28')
          payload="$(python3 - "$tag" "$GITHUB_SHA" <<'PY'
          import json,sys
          print(json.dumps({
              "tag_name":sys.argv[1],
              "target_commitish":sys.argv[2],
              "name":"PepeW v2.1 Fusion2 SharedFP128 V100 Offline",
              "prerelease":True
          }))
          PY
          )"
          release_json="$(curl -fsSL -X POST "${auth[@]}" -H 'Content-Type: application/json' "${api}/releases" -d "$payload")"
          rid="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$release_json")"
          for file in "$ASSET" "$ASSET.sha256"; do
            mime=application/octet-stream
            [[ "$file" == *.sha256 ]] && mime=text/plain
            curl -fsSL -X POST "${auth[@]}" -H "Content-Type: ${mime}" \
              --data-binary "@/tmp/${file}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${rid}/assets?name=${file}" >/dev/null
          done
          asset_sha="$(sha256sum "/tmp/${ASSET}" | awk '{print $1}')"
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p results
          python3 - "$tag" "$asset_sha" "$GITHUB_SHA" "$ASSET" <<'PY'
          import json,sys
          from pathlib import Path
          tag,asset_sha,source_sha,asset=sys.argv[1:5]
          data={
            "status":"HOSTED_STATIC_PASS",
            "label":"fusion2-sharedfp128",
            "tag":tag,
            "asset_url":f"https://github.com/iPepew/PepePow_Miner/releases/download/{tag}/{asset}",
            "asset_sha256":asset_sha,
            "source_commit":source_sha,
            "cuda_arch":"sm_70",
            "core_correctness":True,
            "zero_spills":True,
            "register_gate_max":64,
            "offline_baseline_mhs":8.818928,
            "predicted_total_gain_pct":45.45,
            "pool_submission":False
          }
          Path("results/sharedfp128-latest.json").write_text(json.dumps(data,indent=2)+"\n")
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add results/sharedfp128-latest.json
          git commit -m "results: publish sharedfp128 hosted manifest"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload hosted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion2-sharedfp128-build-${{ github.sha }}
          path: |
            /tmp/baseline-build.log
            /tmp/candidate-build.log
            /tmp/core-tests.log
            /tmp/candidate-resource.txt
            /tmp/PepeW-v2.1-Fusion2-SharedFP128-V100-Offline-Bench.tar.gz
            /tmp/PepeW-v2.1-Fusion2-SharedFP128-V100-Offline-Bench.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 30
