name: v1.0.9 Volta dual-engine autotune

on:
  workflow_dispatch:
  push:
    branches: [release/v1.0.9]
    paths:
      - "VERSION"
      - "native/**"
      - "hiveos/**"
      - "tools/prepare-v109-volta-geometry.py"
      - "tools/patch-v109-fasttrig.py"
      - "tools/check-v109-reducer.py"
      - "tools/stage-v109-hiveos.py"
      - ".github/workflows/v109-volta-geometry.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-v100-v109:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates git ninja-build python3 python3-pip tar gzip binutils
          python3 -m pip install --no-cache-dir 'cmake==3.31.6'
          /usr/local/cuda/bin/nvcc --version
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70

      - name: Validate restricted trig design
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '1.0.9'
          python3 tools/check-v109-reducer.py | tee reducer-contract.txt
          grep -F 'V109_RESTRICTED_TRIG_CONTRACT=PASS' reducer-contract.txt

      - name: Prepare exact geometry source
        run: |
          set -Eeuo pipefail
          python3 tools/prepare-v109-volta-geometry.py
          python3 -m py_compile \
            tools/prepare-v109-volta-geometry.py \
            tools/patch-v109-fasttrig.py \
            tools/check-v109-reducer.py \
            tools/stage-v109-hiveos.py \
            hiveos/stratum-replay-proxy.py
          bash -n hiveos/v100-autotune.sh

      - name: Build exact V100 engine
        run: |
          set -Eeuo pipefail
          export CUDACXX=/usr/local/cuda/bin/nvcc
          cmake -S native -B build-v109-exact -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=ON \
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON \
            -DPEPEPOW_CUDA_ARCHITECTURES='70-real' \
            -DPEPEPOW_CUDA_THREADS=768 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=OFF \
            -DPEPEPOW_CUDA_SCALED_MATRIX=ON \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON \
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON \
            -DPEPEPOW_CUDA_SW_STATE_MODE=3
          cmake --build build-v109-exact --parallel 4 --target \
            pepepowminer pepepow_core_tests pepepow_cuda_tests \
            pepepow_cuda_header80_validation pepepow_v100_autotune
          ./build-v109-exact/pepepowminer --version | tee exact-version.txt
          grep -F '1.0.9' exact-version.txt
          ./build-v109-exact/pepepow_v100_autotune --help | tee autotune-help.txt
          grep -F -- '--threads' autotune-help.txt
          ctest --test-dir build-v109-exact --output-on-failure -R '^pepepow_core_tests$'

      - name: Patch and build fasttrig V100 engine
        run: |
          set -Eeuo pipefail
          python3 tools/patch-v109-fasttrig.py
          export CUDACXX=/usr/local/cuda/bin/nvcc
          cmake -S native -B build-v109-fast -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=ON \
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON \
            -DPEPEPOW_CUDA_ARCHITECTURES='70-real' \
            -DPEPEPOW_CUDA_THREADS=768 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=OFF \
            -DPEPEPOW_CUDA_SCALED_MATRIX=ON \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON \
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON \
            -DPEPEPOW_CUDA_SW_STATE_MODE=3
          cmake --build build-v109-fast --parallel 4 --target \
            pepepowminer pepepow_cuda_header80_validation pepepow_v100_autotune
          ./build-v109-fast/pepepowminer --version | tee fasttrig-version.txt
          grep -F '1.0.9' fasttrig-version.txt

      - name: Verify both Volta executables
        run: |
          set -Eeuo pipefail
          for mode in exact fast; do
            FINAL="build-v109-${mode}/pepepowminer"
            TUNER="build-v109-${mode}/pepepow_v100_autotune"
            CUDA_OBJ="build-v109-${mode}/CMakeFiles/pepepow_cuda.dir/src/cuda/header80_backend.cu.o"
            test -s "$FINAL"
            test -s "$TUNER"
            test -s "$CUDA_OBJ"
            /usr/local/cuda/bin/cuobjdump --list-elf "$FINAL" | tee "${mode}-fatbin.txt"
            grep -F sm_70 "${mode}-fatbin.txt"
            /usr/local/cuda/bin/cuobjdump --list-elf "$TUNER" | tee "${mode}-autotune-fatbin.txt"
            grep -F sm_70 "${mode}-autotune-fatbin.txt"
            /usr/local/cuda/bin/cuobjdump --dump-resource-usage "$FINAL" | tee "${mode}-resource-usage.txt"
            grep -F 'header80_pow_kernel' "${mode}-resource-usage.txt"
            /usr/local/cuda/bin/cuobjdump --list-elf "$CUDA_OBJ" | tee "${mode}-object-fatbin.txt"
            grep -F sm_70 "${mode}-object-fatbin.txt"
            readelf -S "$FINAL" | tee "${mode}-binary-sections.txt"
            grep -E '\.nv_fatbin|\.nvFatBinSegment' "${mode}-binary-sections.txt"
          done

      - name: Package HiveOS candidate
        run: |
          set -Eeuo pipefail
          PEPEW_BUILD_EXACT=build-v109-exact PEPEW_BUILD_FAST=build-v109-fast \
            python3 tools/stage-v109-hiveos.py | tee package-info.txt
          ROOT='dist-stage/PepeW-Miner-v1.0.9'
          test -d "$ROOT"
          for script in h-config.sh h-run.sh h-stats.sh console-monitor.sh v100-autotune.sh; do
            bash -n "$ROOT/$script"
          done
          grep -Fqx 'CUSTOM_NAME=PepeW-Miner-v1.0.9' "$ROOT/h-manifest.conf"
          grep -Fqx 'CUSTOM_VERSION=1.0.9' "$ROOT/h-manifest.conf"
          grep -Fqx 'kernel_mode=volta-dual-auto' "$ROOT/BUILD_PROFILE"
          grep -Fqx 'engines=exact,fasttrig' "$ROOT/BUILD_PROFILE"
          grep -Fqx 'dynamic_shared_scratch=true' "$ROOT/BUILD_PROFILE"
          grep -Fqx 'autotune_validation=32_cpu_gpu_nonces_per_profile' "$ROOT/BUILD_PROFILE"
          grep -Fqx 'autotune_failure_policy=fail_closed' "$ROOT/BUILD_PROFILE"
          grep -Fqx 'cpu_candidate_validation=consensus-exact' "$ROOT/BUILD_PROFILE"
          grep -F 'PepeW - твоя монета. Твои правила.' "$ROOT/h-run.sh"
          test -x "$ROOT/pepepowminer"
          test -x "$ROOT/pepepowminer-fasttrig"
          test -x "$ROOT/pepepow-v100-autotune"
          test -x "$ROOT/pepepow-v100-autotune-fasttrig"
          (cd "$ROOT" && sha256sum -c pepepowminer.sha256)
          ! find "$ROOT" -type d -name '__pycache__' | grep -q .

          mkdir -p dist
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C dist-stage -cf - PepeW-Miner-v1.0.9 | gzip -n > dist/PepeW-Miner-v1.0.9-HiveOS.tar.gz
          (cd dist && sha256sum PepeW-Miner-v1.0.9-HiveOS.tar.gz > PepeW-Miner-v1.0.9-HiveOS.tar.gz.sha256)
          tar -tzf dist/PepeW-Miner-v1.0.9-HiveOS.tar.gz > dist/archive-list.txt
          for item in pepepowminer pepepowminer-fasttrig pepepow-v100-autotune pepepow-v100-autotune-fasttrig v100-autotune.sh h-manifest.conf; do
            grep -Fqx "PepeW-Miner-v1.0.9/${item}" dist/archive-list.txt
          done
          ! grep -Fq '__pycache__' dist/archive-list.txt
          ! grep -Fq '^PepeW-Miner-v1.0.9-HiveOS/' dist/archive-list.txt
          echo "ARCHIVE_SHA256=$(sha256sum dist/PepeW-Miner-v1.0.9-HiveOS.tar.gz | awk '{print $1}')"

      - name: Upload v1.0.9 candidate
        uses: actions/upload-artifact@v4
        with:
          name: PepeW-Miner-v1.0.9-HiveOS-v100-dual-auto
          path: |
            dist/PepeW-Miner-v1.0.9-HiveOS.tar.gz
            dist/PepeW-Miner-v1.0.9-HiveOS.tar.gz.sha256
            dist/archive-list.txt
            exact-version.txt
            fasttrig-version.txt
            autotune-help.txt
            exact-fatbin.txt
            fast-fatbin.txt
            exact-autotune-fatbin.txt
            fast-autotune-fatbin.txt
            exact-resource-usage.txt
            fast-resource-usage.txt
            exact-object-fatbin.txt
            fast-object-fatbin.txt
            exact-binary-sections.txt
            fast-binary-sections.txt
            reducer-contract.txt
            package-info.txt
          if-no-files-found: error
          retention-days: 14
