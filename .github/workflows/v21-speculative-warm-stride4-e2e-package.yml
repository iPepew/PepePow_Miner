name: PepeW-Miner-v2.1 BETA Warm Stride4 E2E Package

on:
  push:
    branches:
      - agent/v21-v100-speculative-warm-stride4
    paths:
      - '.github/workflows/v21-speculative-warm-stride4-e2e-package.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates git ninja-build python3 python3-pip binutils
          python3 -m pip install --no-cache-dir 'cmake==3.31.6'
          rm -rf /var/lib/apt/lists/*
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70

      - name: Apply Q20 coefficient plus warm-state stride4 candidate
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('native/src/benchmark/hoohash_speculative_q20_cuda.cu')
          s=p.read_text(encoding='utf-8')
          reps=[
            ('constexpr std::int64_t kQScale = std::int64_t{1} << kQBits;', 'constexpr std::uint64_t kQScale = std::uint64_t{1} << kQBits;'),
            ('constexpr std::int64_t kQPeriod = kQScale * 1024;', 'constexpr std::uint64_t kQPeriod = kQScale * 1024ULL;\nconstexpr std::uint64_t kQPeriodMask = kQPeriod - 1ULL;\nstatic_assert((kQPeriod & (kQPeriod - 1ULL)) == 0ULL);'),
            ('constexpr std::int64_t kQColdThreshold = (kQPeriod * 2) / 100;', 'constexpr std::uint64_t kQColdThreshold = (kQPeriod * 2ULL) / 100ULL;'),
            ('const int row=pair*2+rr; std::int64_t qsum=0;', 'const int row=pair*2+rr; std::uint64_t qsum=0;'),
            ('qsum+=static_cast<std::int64_t>(floor(c*static_cast<double>(kQScale)+0.5));', 'qsum+=static_cast<std::uint64_t>(floor(c*static_cast<double>(kQScale)+0.5));'),
            ('const std::int64_t rem=qsum%kQPeriod;', 'const std::uint64_t rem=qsum & kQPeriodMask;'),
            ('floors[rr]=static_cast<std::uint64_t>(qsum/kQScale);', 'floors[rr]=qsum >> kQBits;'),
            ('std::vector<double> flat(4096); std::vector<std::int32_t> qtable(4096*16);', 'std::vector<double> flat(4096); std::vector<std::int32_t> qtable(4096);'),
            ('for(int r=0;r<64;++r)for(int c=0;c<64;++c){flat[r*64+c]=matrix[r][c];for(int n=0;n<16;++n){const double x=matrix[r][c]*0.0001*static_cast<double>(n)*static_cast<double>(kQScale);qtable[(r*64+c)*16+n]=static_cast<std::int32_t>(std::llround(x));}}', 'for(int r=0;r<64;++r)for(int c=0;c<64;++c){flat[r*64+c]=matrix[r][c];const double x=matrix[r][c]*0.0001*static_cast<double>(kQScale);qtable[r*64+c]=static_cast<std::int32_t>(std::llround(x));}'),
          ]
          for old,new in reps:
              if old in s: s=s.replace(old,new,1)
              elif new not in s: raise SystemExit(f'marker missing: {old}')
          warm_re=re.compile(r'qsum\s*\+=\s*static_cast<std::(?:u?int64_t)>\(table\[\(row\*64\+col\)\*16\+static_cast<int>\(nib\)\]\);')
          warm_new='qsum+=static_cast<std::uint64_t>(static_cast<std::int64_t>(table[row*64+col])*static_cast<std::int64_t>(nib));'
          if warm_new not in s:
              s,n=warm_re.subn(warm_new,s,count=1)
              if n!=1: raise SystemExit('coefficient warm marker missing')
          old='''                if (cold) {\n                    if (nib!=0U) {\n                        const double val=static_cast<double>(nib);\n                        const double x=matrix[row*64+col]*static_cast<double>(hash_mod)*val+nonce_mod;\n                        const double c=safe_nonlinear(x)*val*1234.0;\n                        qsum+=static_cast<std::uint64_t>(floor(c*static_cast<double>(kQScale)+0.5));\n                    }\n                } else {\n                    qsum+=static_cast<std::uint64_t>(static_cast<std::int64_t>(table[row*64+col])*static_cast<std::int64_t>(nib));\n                }\n                const std::uint64_t rem=qsum & kQPeriodMask;\n                cold=rem<=kQColdThreshold;'''
          new='''                if (cold) {\n                    if (nib!=0U) {\n                        const double val=static_cast<double>(nib);\n                        const double x=matrix[row*64+col]*static_cast<double>(hash_mod)*val+nonce_mod;\n                        const double c=safe_nonlinear(x)*val*1234.0;\n                        qsum+=static_cast<std::uint64_t>(floor(c*static_cast<double>(kQScale)+0.5));\n                    }\n                    const std::uint64_t rem=qsum & kQPeriodMask;\n                    cold=rem<=kQColdThreshold;\n                } else {\n                    qsum+=static_cast<std::uint64_t>(static_cast<std::int64_t>(table[row*64+col])*static_cast<std::int64_t>(nib));\n                    if ((col & 3) == 3) {\n                        const std::uint64_t rem=qsum & kQPeriodMask;\n                        cold=rem<=kQColdThreshold;\n                    }\n                }'''
          qpos=s.find('__device__ __forceinline__ void q20_mix(')
          if qpos<0: raise SystemExit('q20_mix marker missing')
          prefix=s[:qpos]; body=s[qpos:]
          if old not in body: raise SystemExit('stride4 body marker missing')
          p.write_text(prefix+body.replace(old,new,1),encoding='utf-8')
          PY
          grep -F 'if ((col & 3) == 3)' native/src/benchmark/hoohash_speculative_q20_cuda.cu
          ! grep -F 'qsum%kQPeriod' native/src/benchmark/hoohash_speculative_q20_cuda.cu

      - name: Add isolated benchmark target
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/CMakeLists.txt')
          s=p.read_text(encoding='utf-8')
          marker='    add_executable(pepepow_cuda_benchmark src/benchmark/cuda_benchmark.cpp)\n'
          insert='''    add_executable(pepepow_hoohash_speculative_q20_cuda src/benchmark/hoohash_speculative_q20_cuda.cu)\n    target_link_libraries(pepepow_hoohash_speculative_q20_cuda PRIVATE pepepow_core)\n    set_target_properties(pepepow_hoohash_speculative_q20_cuda PROPERTIES CUDA_STANDARD 20 CUDA_STANDARD_REQUIRED ON CUDA_ARCHITECTURES "${PEPEPOW_CUDA_ARCHITECTURES}" CUDA_SEPARABLE_COMPILATION OFF)\n    target_compile_options(pepepow_hoohash_speculative_q20_cuda PRIVATE $<$<COMPILE_LANGUAGE:CUDA>:--fmad=false> $<$<COMPILE_LANGUAGE:CUDA>:-Xptxas=-v> $<$<COMPILE_LANGUAGE:CUDA>:-lineinfo>)\n'''
          if s.count(marker)!=1: raise SystemExit('benchmark insertion marker not unique')
          p.write_text(s.replace(marker,insert+marker,1),encoding='utf-8')
          PY

      - name: Configure, build and enforce sm70 gate
        run: |
          set -Eeuo pipefail
          export CUDACXX=/usr/local/cuda/bin/nvcc
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc -DPEPEPOW_ENABLE_CUDA=ON -DPEPEPOW_BUILD_TESTS=OFF -DPEPEPOW_CUDA_ARCHITECTURES='70-real' -DPEPEPOW_CUDA_THREADS=704 -DPEPEPOW_CUDA_MIN_BLOCKS=1 -DPEPEPOW_CUDA_SPLIT_PIPELINE=ON -DPEPEPOW_CUDA_HOTRUN8=ON -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON -DPEPEPOW_CUDA_ASSUME_FINITE=ON -DPEPEPOW_CUDA_SW_STATE_MODE=3 '-DCMAKE_CUDA_FLAGS=-DPEPEPOW_CUDA_HOTRUN8_FUSION_MODE=2'
          cmake --build build --parallel 4 --target pepepow_hoohash_speculative_q20_cuda 2>&1 | tee warm-stride4-build.log
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' warm-stride4-build.log
          /usr/local/cuda/bin/cuobjdump --dump-resource-usage build/pepepow_hoohash_speculative_q20_cuda | tee warm-stride4-resources.txt
          /usr/local/cuda/bin/cuobjdump --dump-sass build/pepepow_hoohash_speculative_q20_cuda > warm-stride4.sass
          ! grep -Eqi '(div\.u64|rem\.u64|__udiv|__umod|__div|__mod)' warm-stride4.sass
          python3 - <<'PY'
          import re
          t=open('warm-stride4-resources.txt').read()
          regs=[int(x) for x in re.findall(r'REG:(\d+)',t)]
          stacks=[int(x) for x in re.findall(r'STACK:(\d+)',t)]
          shared=[int(x) for x in re.findall(r'SHARED:(\d+)',t)]
          local=[int(x) for x in re.findall(r'LOCAL:(\d+)',t)]
          if not regs: raise SystemExit('resource parser: no REG fields')
          if max(regs)>127: raise SystemExit(f'register reject: {max(regs)} > 127')
          if stacks and max(stacks)>176: raise SystemExit(f'stack reject: {max(stacks)} > 176')
          if shared and max(shared)>0: raise SystemExit(f'shared reject: {max(shared)}')
          if local and max(local)>0: raise SystemExit(f'local reject: {max(local)}')
          PY
          barriers=$(grep -Ec '\bBAR\.' warm-stride4.sass || true)
          inst=$(grep -Ec '^\s*/\*[0-9a-fA-F]+\*/' warm-stride4.sass || true)
          test "$barriers" -eq 0
          test "$inst" -le 8008
          echo "sass_instruction_lines=$inst"

      - name: Assemble immutable package
        run: |
          set -Eeuo pipefail
          mkdir -p package
          install -m 0755 build/pepepow_hoohash_speculative_q20_cuda package/
          cp warm-stride4-build.log package/
          cp warm-stride4-resources.txt package/
          cp warm-stride4.sass package/
          cat > package/BUILD_INFO.txt <<EOF
          product=PepeW-Miner-v2.1 BETA
          candidate_class=speculative_filtered_hoohash
          architecture=q20_coefficient_warm_state_reevaluation_stride4
          source_branch=${GITHUB_REF_NAME}
          source_commit=${GITHUB_SHA}
          cuda_arch=sm_70
          recall_gate=0.995
          throughput_gate_pct=25
          invalid_submissions_max=0
          strict_validation_required=true
          real_pool_allowed=false
          v100_exclusive_required=true
          EOF
          tar -C package -czf warm-stride4-e2e-sm70.tar.gz .
          sha256sum warm-stride4-e2e-sm70.tar.gz > warm-stride4-e2e-sm70.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: warm-stride4-e2e-sm70-${{ github.sha }}
          path: |
            warm-stride4-e2e-sm70.tar.gz
            warm-stride4-e2e-sm70.tar.gz.sha256
          retention-days: 14

      - name: Publish immutable technical asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1-warm-stride4-e2e-sm70-offline-${{ github.sha }}
          name: PepeW-Miner-v2.1 BETA Warm Stride4 E2E Offline ${{ github.sha }}
          prerelease: true
          files: |
            warm-stride4-e2e-sm70.tar.gz
            warm-stride4-e2e-sm70.tar.gz.sha256
