name: PepeW-Miner-v2.1 BETA Q20 Guarded Pair sm70 Gate

on:
  push:
    branches:
      - agent/v21-v100-speculative-q20-guarded-pair
    paths:
      - '.github/workflows/v21-speculative-q20-guarded-pair-sm70.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  static-profile:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates git ninja-build python3 python3-pip binutils
          python3 -m pip install --no-cache-dir 'cmake==3.31.6'
          rm -rf /var/lib/apt/lists/*
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70

      - name: Apply coefficient baseline and guarded warm pair
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('native/src/benchmark/hoohash_speculative_q20_cuda.cu')
          s=p.read_text(encoding='utf-8')
          repl=[
            ('constexpr std::int64_t kQScale = std::int64_t{1} << kQBits;', 'constexpr std::uint64_t kQScale = std::uint64_t{1} << kQBits;'),
            ('constexpr std::int64_t kQPeriod = kQScale * 1024;', 'constexpr std::uint64_t kQPeriod = kQScale * 1024ULL;\nconstexpr std::uint64_t kQPeriodMask = kQPeriod - 1ULL;\nstatic_assert((kQPeriod & (kQPeriod - 1ULL)) == 0ULL);'),
            ('constexpr std::int64_t kQColdThreshold = (kQPeriod * 2) / 100;', 'constexpr std::uint64_t kQColdThreshold = (kQPeriod * 2ULL) / 100ULL;'),
            ('const int row=pair*2+rr; std::int64_t qsum=0;', 'const int row=pair*2+rr; std::uint64_t qsum=0;'),
            ('qsum+=static_cast<std::int64_t>(floor(c*static_cast<double>(kQScale)+0.5));', 'qsum+=static_cast<std::uint64_t>(floor(c*static_cast<double>(kQScale)+0.5));'),
            ('const std::int64_t rem=qsum%kQPeriod;', 'const std::uint64_t rem=qsum & kQPeriodMask;'),
            ('floors[rr]=static_cast<std::uint64_t>(qsum/kQScale);', 'floors[rr]=qsum >> kQBits;'),
            ('std::vector<double> flat(4096); std::vector<std::int32_t> qtable(4096*16);', 'std::vector<double> flat(4096); std::vector<std::int32_t> qtable(4096);'),
            ('for(int r=0;r<64;++r)for(int c=0;c<64;++c){flat[r*64+c]=matrix[r][c];for(int n=0;n<16;++n){const double x=matrix[r][c]*0.0001*static_cast<double>(n)*static_cast<double>(kQScale);qtable[(r*64+c)*16+n]=static_cast<std::int32_t>(std::llround(x));}}', 'for(int r=0;r<64;++r)for(int c=0;c<64;++c){flat[r*64+c]=matrix[r][c];const double x=matrix[r][c]*0.0001*static_cast<double>(kQScale);qtable[r*64+c]=static_cast<std::int32_t>(std::llround(x));}'),
          ]
          for old,new in repl:
              if old in s: s=s.replace(old,new,1)
              elif new not in s: raise SystemExit(f'missing coefficient marker: {old}')
          warm_re=re.compile(r'qsum\s*\+=\s*static_cast<std::(?:u?int64_t)>\(table\[\(row\*64\+col\)\*16\+static_cast<int>\(nib\)\]\);')
          warm_new='qsum+=static_cast<std::uint64_t>(static_cast<std::int64_t>(table[row*64+col])*static_cast<std::int64_t>(nib));'
          if warm_new not in s:
              s,n=warm_re.subn(warm_new,s,count=1)
              if n!=1: raise SystemExit('warm coefficient marker missing')

          start=s.index('__device__ __forceinline__ void q20_mix(')
          loop=s.index('            #pragma unroll 1\n            for (int col=0;col<64;++col) {', start)
          end_marker='            floors[rr]=qsum >> kQBits;'
          end=s.index(end_marker, loop)
          old=s[loop:end]
          new='''            #pragma unroll 1
            for (int col=0;col<64;) {
                const std::uint8_t b=byte_at(first,col>>1);
                const std::uint32_t nib=(col&1)?(b&0x0fU):(b>>4U);
                if (!cold && col+1<64) {
                    const std::uint64_t d0=static_cast<std::uint64_t>(static_cast<std::int64_t>(table[row*64+col])*static_cast<std::int64_t>(nib));
                    const int col1=col+1;
                    const std::uint8_t b1=byte_at(first,col1>>1);
                    const std::uint32_t nib1=(col1&1)?(b1&0x0fU):(b1>>4U);
                    const std::uint64_t d1=static_cast<std::uint64_t>(static_cast<std::int64_t>(table[row*64+col1])*static_cast<std::int64_t>(nib1));
                    const std::uint64_t rem0=qsum & kQPeriodMask;
                    const std::uint64_t room=kQPeriodMask-rem0;
                    const std::uint64_t dsum=d0+d1;
                    if (dsum<=room) {
                        qsum+=dsum;
                        col+=2;
                        continue;
                    }
                }
                if (cold) {
                    if (nib!=0U) {
                        const double val=static_cast<double>(nib);
                        const double x=matrix[row*64+col]*static_cast<double>(hash_mod)*val+nonce_mod;
                        const double c=safe_nonlinear(x)*val*1234.0;
                        qsum+=static_cast<std::uint64_t>(floor(c*static_cast<double>(kQScale)+0.5));
                    }
                } else {
                    qsum+=static_cast<std::uint64_t>(static_cast<std::int64_t>(table[row*64+col])*static_cast<std::int64_t>(nib));
                }
                const std::uint64_t rem=qsum & kQPeriodMask;
                cold=rem<=kQColdThreshold;
                ++col;
            }
'''
          s=s[:loop]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          grep -F 'const std::uint64_t room=kQPeriodMask-rem0;' native/src/benchmark/hoohash_speculative_q20_cuda.cu
          grep -F 'if (dsum<=room)' native/src/benchmark/hoohash_speculative_q20_cuda.cu
          ! grep -F 'qsum%kQPeriod' native/src/benchmark/hoohash_speculative_q20_cuda.cu

      - name: Add isolated target
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/CMakeLists.txt'); s=p.read_text()
          marker='    add_executable(pepepow_cuda_benchmark src/benchmark/cuda_benchmark.cpp)\n'
          ins='''    add_executable(pepepow_hoohash_speculative_q20_cuda src/benchmark/hoohash_speculative_q20_cuda.cu)\n    target_link_libraries(pepepow_hoohash_speculative_q20_cuda PRIVATE pepepow_core)\n    set_target_properties(pepepow_hoohash_speculative_q20_cuda PROPERTIES CUDA_STANDARD 20 CUDA_STANDARD_REQUIRED ON CUDA_ARCHITECTURES "${PEPEPOW_CUDA_ARCHITECTURES}" CUDA_SEPARABLE_COMPILATION OFF)\n    target_compile_options(pepepow_hoohash_speculative_q20_cuda PRIVATE $<$<COMPILE_LANGUAGE:CUDA>:--fmad=false> $<$<COMPILE_LANGUAGE:CUDA>:-Xptxas=-v> $<$<COMPILE_LANGUAGE:CUDA>:-lineinfo>)\n'''
          if s.count(marker)!=1: raise SystemExit('target marker not unique')
          p.write_text(s.replace(marker,ins+marker,1))
          PY

      - name: Build sm70
        run: |
          set -Eeuo pipefail
          export CUDACXX=/usr/local/cuda/bin/nvcc
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc -DPEPEPOW_ENABLE_CUDA=ON -DPEPEPOW_BUILD_TESTS=OFF -DPEPEPOW_CUDA_ARCHITECTURES='70-real' -DPEPEPOW_CUDA_THREADS=704 -DPEPEPOW_CUDA_MIN_BLOCKS=1 -DPEPEPOW_CUDA_SPLIT_PIPELINE=ON -DPEPEPOW_CUDA_HOTRUN8=ON -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON -DPEPEPOW_CUDA_ASSUME_FINITE=ON -DPEPEPOW_CUDA_SW_STATE_MODE=3 '-DCMAKE_CUDA_FLAGS=-DPEPEPOW_CUDA_HOTRUN8_FUSION_MODE=2'
          cmake --build build --parallel 4 --target pepepow_hoohash_speculative_q20_cuda 2>&1 | tee guarded-pair-build.log

      - name: Enforce static gate
        run: |
          set -Eeuo pipefail
          test -x build/pepepow_hoohash_speculative_q20_cuda
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' guarded-pair-build.log
          /usr/local/cuda/bin/cuobjdump --dump-resource-usage build/pepepow_hoohash_speculative_q20_cuda | tee guarded-pair-resources.txt
          /usr/local/cuda/bin/cuobjdump --dump-sass build/pepepow_hoohash_speculative_q20_cuda > guarded-pair.sass
          if grep -Eqi '(div\.u64|rem\.u64|__udiv|__umod|__div|__mod)' guarded-pair.sass; then echo 'STATIC_REJECT=integer_divrem_present'; exit 1; fi
          inst=$(grep -Ec '^\s*/\*[0-9a-fA-F]+\*/' guarded-pair.sass || true)
          echo "sass_instruction_lines=$inst"
          test "$inst" -le 8008
          echo 'STATIC_PASS=q20_guarded_pair'
          echo 'V100_ALLOWED=false'

      - uses: actions/upload-artifact@v4
        with:
          name: q20-guarded-pair-sm70-${{ github.sha }}
          path: |
            guarded-pair-build.log
            guarded-pair-resources.txt
            guarded-pair.sass
          if-no-files-found: error
          retention-days: 14
