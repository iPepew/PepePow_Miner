name: PepeW-Miner-v2.1 BETA V100 threads704 minblocks2

on:
  push:
    branches:
      - agent/v21-v100-t704-minblocks2
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    env:
      RELEASE_TAG: v2.1-beta.1-v100-t704-mb2-test
      ROOT: PepeW-Miner
      ASSET: PepeW-Miner-HiveOS.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates git ninja-build python3 python3-pip tar gzip file binutils gh
          python3 -m pip install --no-cache-dir "cmake==3.31.6"
          rm -rf /var/lib/apt/lists/*
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70
      - name: Apply and verify professional UI
        run: |
          set -Eeuo pipefail
          python3 scripts/professional_console_ui_v21.py
          python3 - <<'PY'
          from pathlib import Path
          text = Path('native/src/app/main.cpp').read_text(encoding='utf-8')
          forbidden = ['🐸','🟣','🔵','✅','🟡','🔄','💰','❌','🔨','⏱','🔴','⚪']
          if any(x in text for x in forbidden): raise SystemExit('emoji present')
          for marker in ['[HOOHASH]','[POOL]','[READY]','[ACCEPTED]','[REJECTED]','[MINING]']:
              if marker not in text: raise SystemExit(f'missing {marker}')
          PY
          test "$(tr -d '\r\n' < VERSION)" = "2.1-beta.1"
          grep -F 'CUSTOM_VERSION="v2.1 BETA"' hiveos/h-manifest.conf
          bash -n hiveos/h-config.sh
          bash -n hiveos/h-run.sh
          bash -n hiveos/h-stats.sh
      - name: Configure V100 threads704 minblocks2
        run: |
          set -Eeuo pipefail
          export CUDACXX=/usr/local/cuda/bin/nvcc
          cmake -S native -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=ON \
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON \
            -DPEPEPOW_CUDA_ARCHITECTURES="70-real" \
            -DPEPEPOW_CUDA_THREADS=704 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=2 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=OFF \
            -DPEPEPOW_CUDA_SCALED_MATRIX=ON \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON \
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON \
            -DPEPEPOW_CUDA_SW_STATE_MODE=3
      - name: Build and verify
        run: |
          set -Eeuo pipefail
          cmake --build build --parallel 4 --target pepepowminer pepepow_core_tests pepepow_cuda_tests pepepow_cuda_header80_validation pepepow_header80_benchmark 2>&1 | tee /tmp/build.log
          ./build/pepepowminer --version | tee /tmp/version.txt
          grep -F '2.1-beta.1' /tmp/version.txt
          /usr/local/cuda/bin/cuobjdump --list-elf build/pepepowminer | tee /tmp/elf.txt
          grep -F sm_70 /tmp/elf.txt
          ! grep -Eq 'sm_(61|75|86|89|120)' /tmp/elf.txt
          strings -a build/pepepowminer | grep -F 'POOL_REFERENCE hoohash=V110 matrix_seed=BLAKE3_MASKED_HEADER header_nonce=BE32 mix_nonce=LE32 submit_nonce=LE_HEX share_target=NBITS_DIV_DIFFICULTY'
          ctest --test-dir build --output-on-failure -R '^pepepow_core_tests$'
      - name: Assemble HiveOS beta package
        run: |
          set -Eeuo pipefail
          rm -rf stage dist
          mkdir -p "stage/${ROOT}" dist
          install -m 0755 build/pepepowminer "stage/${ROOT}/pepepowminer"
          install -m 0755 hiveos/h-config.sh "stage/${ROOT}/h-config.sh"
          install -m 0755 hiveos/h-run.sh "stage/${ROOT}/h-run.sh"
          install -m 0755 hiveos/h-stats.sh "stage/${ROOT}/h-stats.sh"
          install -m 0755 hiveos/stratum-replay-proxy.py "stage/${ROOT}/stratum-replay-proxy.py"
          install -m 0644 hiveos/h-manifest.conf "stage/${ROOT}/h-manifest.conf"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('stage/PepeW-Miner/h-stats.sh'); s=p.read_text(); s=s.replace('"ver":"1.0.6"','"ver":"v2.1 BETA"').replace('"ver":"v2.0 BETA"','"ver":"v2.1 BETA"'); p.write_text(s)
          PY
          grep -F '"ar":[%s,%s]' "stage/${ROOT}/h-stats.sh"
          grep -F '"ver":"v2.1 BETA"' "stage/${ROOT}/h-stats.sh"
          cat > "stage/${ROOT}/BUILD_INFO.txt" <<EOF
          product=PepeW-Miner-v2.1 BETA
          version=2.1-beta.1
          source_branch=${GITHUB_REF_NAME}
          source_commit=${GITHUB_SHA}
          source_behavior=v2.1-beta.1-service704-share-producing
          optimization=min-blocks-only
          cuda_toolkit=12.8.1
          cuda_native=sm_70
          gpu_target=Tesla V100 / Volta
          cuda_profile=service704-mb2-test
          threads=704
          min_blocks=2
          algorithm=HooHash V110
          hive_ar=accepted,rejected
          console_ui=professional-no-emoji
          build_profile_fallback=embedded
          previous_verified_avg_mhs=4.101
          previous_verified_accepted=68
          previous_verified_rejected=0
          release_channel=BETA_TEST
          EOF
          sha256sum "stage/${ROOT}/pepepowminer" > "stage/${ROOT}/pepepowminer.sha256"
          tar --sort=name --owner=0 --group=0 --numeric-owner -C stage -cf - "${ROOT}" | gzip -n > "dist/${ASSET}"
          sha256sum "dist/${ASSET}" > "dist/${ASSET}.sha256"
      - name: Publish isolated minblocks2 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          notes="v2.1 BETA isolated Tesla V100 occupancy experiment. Only PEPEPOW_CUDA_MIN_BLOCKS changes 1 -> 2 at verified threads704. HooHash, Stratum, UI, telemetry and other CUDA settings remain unchanged."
          gh release delete "$RELEASE_TAG" --repo "$GH_REPO" --yes >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" "dist/${ASSET}" "dist/${ASSET}.sha256" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "PepeW-Miner-v2.1 BETA V100 threads704 minblocks2 test" --notes "$notes" --prerelease
