name: Bootstrap v0.1.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-release:
    if: github.event.head_commit.message != 'Import native miner v0.1.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Import current native miner
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/source
          git clone --depth 1 --branch agent/pepepowminer-foundation \
            https://github.com/iPepew/PEPEPOW_Miner_Windows.git /tmp/source

          rm -rf native
          cp -a /tmp/source/native ./native

          cat > README.md <<'EOF'
          # PepePow Miner

          Open-source native C++20/CUDA miner foundation for PepePow and the HooHash V110 proof-of-work pipeline.

          ## v0.1.0 Foundation Release

          This release contains a correctness-first native implementation with:

          - CPU reference pipeline
          - fused NVIDIA CUDA pipeline
          - bit-for-bit CPU/GPU validation tests
          - CUDA benchmark utility
          - PTXAS register, stack and spill profiling
          - warp-divergence and nonlinear-path diagnostic tools
          - Linux, HiveOS and Windows build support through CMake

          The current CUDA implementation preserves strict FP64 behavior with `--fmad=false`. Fast math is not enabled because changing floating-point results changes the proof-of-work hash.

          ## Verified hardware

          RTX 3080 (`sm_86`) has been tested with CUDA 12.4. The development benchmark reached approximately 0.99 MH/s median with peaks above 1.03 MH/s using 128 threads per block. Results depend on clocks, power limit, temperature and driver state.

          Tesla V100 (`sm_70`) is supported by the build system but requires further performance validation and tuning.

          ## Build without CUDA

          ```bash
          cmake -S native -B build/native -DPEPEPOW_ENABLE_CUDA=OFF -DPEPEPOW_BUILD_TESTS=ON
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native -C Release --output-on-failure
          ```

          ## Build with CUDA

          ```bash
          cmake -S native -B build/native-cuda -DPEPEPOW_ENABLE_CUDA=ON -DPEPEPOW_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-cuda --config Release --parallel
          ctest --test-dir build/native-cuda -C Release --output-on-failure
          ```

          ## HiveOS / Linux profiling

          RTX 3080:

          ```bash
          cd native
          chmod +x scripts/profile_cuda.sh
          ./scripts/profile_cuda.sh 86
          ctest --test-dir build-cuda-sm86 --output-on-failure
          ./build-cuda-sm86/pepepow_cuda_benchmark 1048576 0 128
          ```

          Tesla V100:

          ```bash
          cd native
          chmod +x scripts/profile_cuda.sh
          ./scripts/profile_cuda.sh 70
          ctest --test-dir build-cuda-sm70 --output-on-failure
          ./build-cuda-sm70/pepepow_cuda_benchmark 1048576 0 128
          ```

          ## Included executables

          - `pepepowminer` — native application foundation
          - `pepepow_cuda_benchmark` — CUDA throughput measurement
          - `pepepow_cuda_warp_probe` — warp-divergence and nonlinear branch diagnostic tool

          ## Current limitations

          v0.1.0 is a foundation release. It is not yet a complete pool-connected production miner and does not claim SRBMiner-level performance. Stratum networking, production share submission, long-running device management and additional GPU-specific tuning remain under development.

          ## Safety

          Run mining software only on hardware you own or are explicitly authorized to use. Monitor temperature, power consumption and system stability.

          ## License

          MIT License. See `LICENSE`.
          EOF

          cat > CHANGELOG.md <<'EOF'
          # Changelog

          ## v0.1.0 — Foundation Release

          - Added C++20 CPU reference implementation for the PepePow/HooHash pipeline.
          - Added fused CUDA implementation for BLAKE3, FP64 matrix mixing and final BLAKE3.
          - Added CPU/GPU bit-for-bit correctness tests.
          - Added configurable CUDA benchmark utility.
          - Added PTXAS profiling scripts for Linux/HiveOS and Windows PowerShell.
          - Added register, stack-frame and spill diagnostics.
          - Added constant-memory matrix broadcast in the production CUDA path.
          - Replaced separate `sin` and `cos` calls with CUDA `sincos` in the nonlinear branch.
          - Added warp-divergence and nonlinear-path profiling utilities.
          - Verified CUDA tests on RTX 3080 with CUDA 12.4.

          ### Known limitations

          - No production Stratum client or share-submission loop yet.
          - Tesla V100 performance tuning remains in progress.
          - Current CUDA kernel is correctness-first and not yet competitive with mature closed-source miners.
          EOF

          cat > LICENSE <<'EOF'
          MIT License

          Copyright (c) 2026 iPepew

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          EOF

          cat > .gitignore <<'EOF'
          build/
          native/build*/
          native/ptxas*.log
          *.o
          *.obj
          *.exe
          *.dll
          *.so
          *.a
          *.lib
          .vs/
          .vscode/
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import native miner v0.1.0"
          git push origin main

      - name: Create v0.1.0 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if ! git rev-parse v0.1.0 >/dev/null 2>&1; then
            git tag -a v0.1.0 -m "PepePow Miner v0.1.0 Foundation Release"
            git push origin v0.1.0
          fi
          if ! gh release view v0.1.0 >/dev/null 2>&1; then
            gh release create v0.1.0 \
              --title "PepePow Miner v0.1.0 — Foundation Release" \
              --notes-file CHANGELOG.md
          fi
