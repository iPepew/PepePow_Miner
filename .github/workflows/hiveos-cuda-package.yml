name: HiveOS V100 SM70 R128 Package

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/v100-sm70-r128"
    paths:
      - "native/**"
      - "hiveos/**"
      - ".github/workflows/hiveos-cuda-package.yml"
  pull_request:
    paths:
      - "native/**"
      - "hiveos/**"
      - ".github/workflows/hiveos-cuda-package.yml"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-hiveos-package:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:11.8.0-devel-ubuntu22.04
    env:
      CUDA_TOOLKIT: "11.8"
      CUDA_ARCHS: "70;75;86"
      CUDA_REG_CAP: "128"
      CUSTOM_MINER_NAME: PepeW-Miner
      ASSET_NAME: PepeW-Miner-HiveOS.tar.gz
      SHA_NAME: PepeW-Miner-HiveOS.tar.gz.sha256
      RELEASE_TAG: hiveos-v100-r128-test

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential ca-certificates file python3-pip gh
          python3 -m pip install --no-cache-dir cmake==3.30.5
          cmake --version
          nvcc --version
          gh --version
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate DEV version
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          build_version="v100-r128-${short_sha}"
          echo "BUILD_VERSION=${build_version}" >> "${GITHUB_ENV}"
          echo "PepeW V100 sm70 R128 candidate: ${build_version}"

      - name: Configure CUDA release
        run: |
          cmake -S native -B build/hiveos-cuda \
            -DCMAKE_BUILD_TYPE=Release \
            -DPEPEW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=OFF \
            -DPEPEPOW_CUDA_ARCHITECTURES="${CUDA_ARCHS}" \
            -DPEPEPOW_CUDA_MAX_REGISTERS="${CUDA_REG_CAP}" \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static

      - name: Build miner
        run: cmake --build build/hiveos-cuda --target pepepowminer --parallel

      - name: Smoke test binary
        run: |
          set -euo pipefail
          file build/hiveos-cuda/pepepowminer
          test -x build/hiveos-cuda/pepepowminer
          ldd build/hiveos-cuda/pepepowminer || true
          build/hiveos-cuda/pepepowminer --help | grep -F 'PepePowMiner'

      - name: Validate HiveOS callbacks
        run: |
          set -euo pipefail
          bash -n hiveos/h-config.sh hiveos/h-run.sh hiveos/h-stats.sh

          test_log=/tmp/pepew-stats-test
          printf '%s\n' '[MINING] 12.345 MH/s | A 7 | R 1 | UP 00:01:23 | REC 2 | STATE online' > "${test_log}.log"
          stats_result=$(
            CUSTOM_LOG_BASENAME="${test_log}" \
            CUSTOM_VERSION="v100-r128-test" \
            bash -c 'source hiveos/h-stats.sh; printf "khs=%s\nstats=%s\n" "$khs" "$stats"'
          )
          grep -F 'khs=12345' <<< "${stats_result}"
          grep -F '"uptime":83' <<< "${stats_result}"
          grep -F '"ar":[7,1,0,"0"]' <<< "${stats_result}"
          grep -F '"ver":"v100-r128-test"' <<< "${stats_result}"
          grep -F '"algo":"hoohash"' <<< "${stats_result}"

          fakebin=/tmp/pepew-fakebin
          mkdir -p "${fakebin}"
          cat > "${fakebin}/nvidia-smi" <<'EOF'
          #!/usr/bin/env bash
          if [[ "$*" == *"--query-gpu=index,pci.bus_id,temperature.gpu,fan.speed"* ]]; then
            printf '%s\n' '0, 00000000:02:00.0, 54, N/A'
            printf '%s\n' '1, 00000000:85:00.0, 67, 72'
            exit 0
          fi
          exit 1
          EOF
          chmod +x "${fakebin}/nvidia-smi"

          printf '%s\n' \
            '[GPU0] 8.542 MH/s | A 3 | R 0 | UP 00:02:05 | REC 0 | STATE online' \
            '[GPU1] 8.101 MH/s | A 3 | R 0 | UP 00:02:05 | REC 0 | STATE online' \
            '[MINING] 16.643 MH/s | A 3 | R 0 | UP 00:02:05 | REC 0 | STATE online' \
            > "${test_log}.log"
          multi_stats=$(
            PATH="${fakebin}:$PATH" \
            CUSTOM_LOG_BASENAME="${test_log}" \
            CUSTOM_VERSION="v100-r128-test" \
            bash -c 'source hiveos/h-stats.sh; printf "%s\n" "$stats"'
          )
          grep -F '"hs":[8542,8101]' <<< "${multi_stats}"
          grep -F '"temp":[54,67]' <<< "${multi_stats}"
          grep -F '"fan":[0,72]' <<< "${multi_stats}"
          grep -F '"ar":[3,0,0,"0;0"]' <<< "${multi_stats}"
          grep -F '"bus_numbers":[2,133]' <<< "${multi_stats}"

      - name: Test HiveOS config callback
        run: |
          set -euo pipefail
          test_config=/tmp/pepew-hiveos-config.txt
          rm -f "${test_config}"
          CUSTOM_CONFIG_FILENAME="${test_config}" \
          CUSTOM_URL="stratum+tcp://example.invalid:13232" \
          CUSTOM_TEMPLATE="wallet.worker" \
          CUSTOM_PASS="x" \
          bash -c 'source hiveos/h-config.sh'
          test -s "${test_config}"
          grep -F -- '-o stratum+tcp://example.invalid:13232' "${test_config}"
          grep -F -- '-u wallet.worker' "${test_config}"
          grep -F -- '--pepepow' "${test_config}"

      - name: Assemble HiveOS V100 R128 archive
        run: |
          set -euo pipefail
          package_dir="dist/${CUSTOM_MINER_NAME}"
          rm -rf dist
          mkdir -p "${package_dir}"

          install -m 0755 build/hiveos-cuda/pepepowminer "${package_dir}/pepepowminer"
          install -m 0755 hiveos/h-run.sh "${package_dir}/h-run.sh"
          install -m 0755 hiveos/h-config.sh "${package_dir}/h-config.sh"
          install -m 0755 hiveos/h-stats.sh "${package_dir}/h-stats.sh"
          install -m 0644 hiveos/h-manifest.conf "${package_dir}/h-manifest.conf"
          sed -i "s/^CUSTOM_VERSION=.*/CUSTOM_VERSION=${BUILD_VERSION}/" "${package_dir}/h-manifest.conf"

          cat > "${package_dir}/BUILD_INFO.txt" <<EOF
          version=${BUILD_VERSION}
          commit=${GITHUB_SHA}
          ref=${GITHUB_REF_NAME}
          channel=${RELEASE_TAG}
          cuda_toolkit=${CUDA_TOOLKIT}
          cuda_archs=${CUDA_ARCHS}
          cuda_max_registers=${CUDA_REG_CAP}
          custom_miner=${CUSTOM_MINER_NAME}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          strip "${package_dir}/pepepowminer" || true
          tar -C dist -czf "dist/${ASSET_NAME}" "${CUSTOM_MINER_NAME}"
          sha256sum "dist/${ASSET_NAME}" | sed "s#dist/##" > "dist/${SHA_NAME}"
          tar -tzf "dist/${ASSET_NAME}"
          cat "dist/${SHA_NAME}"

      - name: Validate archive layout
        run: |
          set -euo pipefail
          archive_list=/tmp/pepew-hiveos-archive-list.txt
          tar -tzf "dist/${ASSET_NAME}" > "${archive_list}"
          test "$(sed -n '1p' "${archive_list}")" = "${CUSTOM_MINER_NAME}/"
          grep -Fx "${CUSTOM_MINER_NAME}/h-manifest.conf" "${archive_list}"
          grep -Fx "${CUSTOM_MINER_NAME}/h-config.sh" "${archive_list}"
          grep -Fx "${CUSTOM_MINER_NAME}/h-run.sh" "${archive_list}"
          grep -Fx "${CUSTOM_MINER_NAME}/h-stats.sh" "${archive_list}"
          grep -Fx "${CUSTOM_MINER_NAME}/pepepowminer" "${archive_list}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pepew-v100-r128-${{ github.sha }}
          path: |
            dist/${{ env.ASSET_NAME }}
            dist/${{ env.SHA_NAME }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish isolated V100 R128 rolling asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          notes=$(cat <<EOF
          Automated PepeW Tesla V100 SM70 register-pressure experiment.

          Build: ${BUILD_VERSION}
          Commit: ${GITHUB_SHA}
          Ref: ${GITHUB_REF_NAME}
          CUDA toolkit: ${CUDA_TOOLKIT}
          CUDA architectures: ${CUDA_ARCHS}
          Max registers/thread: ${CUDA_REG_CAP}

          Exact mining core from the 8.542 MH/s baseline; only the CUDA register cap is changed for a clean A/B test.
          EOF
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "dist/${ASSET_NAME}" "dist/${SHA_NAME}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "dist/${ASSET_NAME}" \
              "dist/${SHA_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "PepeW Miner Tesla V100 R128 DEV" \
              --notes "${notes}" \
              --prerelease
          fi

          echo "V100 R128 DEV asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
