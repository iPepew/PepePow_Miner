name: HiveOS CUDA Package

on:
  push:
    branches:
      - "release/**"
      - main
    paths:
      - "native/**"
      - "hiveos/**"
      - ".github/workflows/hiveos-cuda-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hiveos-package:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu22.04
    env:
      VERSION: 0.1.3
      CUDA_ARCHS: "70;86"
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git cmake build-essential ca-certificates file
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CUDA release
        run: |
          cmake -S native -B build/hiveos-cuda \
            -DCMAKE_BUILD_TYPE=Release \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=OFF \
            -DPEPEPOW_CUDA_ARCHITECTURES="${CUDA_ARCHS}" \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static

      - name: Build miner
        run: cmake --build build/hiveos-cuda --target pepepowminer --parallel

      - name: Assemble HiveOS archive
        run: |
          set -euo pipefail
          package_name="pepepowminer-v${VERSION}"
          package_dir="dist/${package_name}"
          archive="dist/${package_name}-hiveos-sm70-sm86.tar.gz"

          rm -rf dist
          mkdir -p "${package_dir}"
          install -m 0755 build/hiveos-cuda/pepepowminer "${package_dir}/pepepowminer"
          install -m 0755 hiveos/h-run.sh "${package_dir}/h-run.sh"
          install -m 0755 hiveos/h-config.sh "${package_dir}/h-config.sh"
          install -m 0755 hiveos/h-stats.sh "${package_dir}/h-stats.sh"
          install -m 0644 hiveos/h-manifest.conf "${package_dir}/h-manifest.conf"
          sed -i "s/^CUSTOM_VERSION=.*/CUSTOM_VERSION=${VERSION}/" "${package_dir}/h-manifest.conf"
          strip "${package_dir}/pepepowminer" || true

          file "${package_dir}/pepepowminer"
          tar -C dist -czf "${archive}" "${package_name}"
          sha256sum "${archive}" | tee "${archive}.sha256"
          tar -tzf "${archive}"

      - name: Upload HiveOS package
        uses: actions/upload-artifact@v4
        with:
          name: pepepowminer-v0.1.3-hiveos-sm70-sm86
          path: |
            dist/pepepowminer-v0.1.3-hiveos-sm70-sm86.tar.gz
            dist/pepepowminer-v0.1.3-hiveos-sm70-sm86.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
