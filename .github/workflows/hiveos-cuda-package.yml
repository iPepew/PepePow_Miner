name: HiveOS V100 KV3-A Hotloop Package

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/v100-kv3-hotloop"
    paths:
      - "native/**"
      - "hiveos/**"
      - ".github/workflows/hiveos-cuda-package.yml"
  pull_request:
    paths:
      - "native/**"
      - "hiveos/**"
      - ".github/workflows/hiveos-cuda-package.yml"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-hiveos-package:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:11.8.0-devel-ubuntu22.04
    env:
      CUDA_TOOLKIT: "11.8"
      CUDA_ARCHS: "70;75;86"
      CUDA_REG_CAP: "128"
      CUDA_THREADS: "256"
      CUSTOM_MINER_NAME: PepeW-Miner
      ASSET_NAME: PepeW-Miner-HiveOS.tar.gz
      SHA_NAME: PepeW-Miner-HiveOS.tar.gz.sha256
      RELEASE_TAG: hiveos-v100-kv3-test
      BASELINE_BUILD: v100-kv2b-t256-c49bf75

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential ca-certificates file python3-pip gh
          python3 -m pip install --no-cache-dir cmake==3.30.5
          cmake --version
          nvcc --version
          gh --version
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate DEV version
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          build_version="v100-kv3a-precheap-t${CUDA_THREADS}-${short_sha}"
          echo "BUILD_VERSION=${build_version}" >> "${GITHUB_ENV}"
          echo "PepeW V100 KV3-A strict hot-loop candidate: ${build_version}"
          echo "Baseline: ${BASELINE_BUILD}"
          echo "Geometry: ${CUDA_THREADS} threads/block; R${CUDA_REG_CAP}"
          echo "Optimization: precompute matrix*0.0001 once per job"

      - name: Configure CUDA release
        run: |
          set -euo pipefail
          cmake -S native -B build/hiveos-cuda \
            -DCMAKE_BUILD_TYPE=Release \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=OFF \
            -DPEPEPOW_CUDA_ARCHITECTURES="${CUDA_ARCHS}" \
            -DPEPEPOW_CUDA_MAX_REGISTERS="${CUDA_REG_CAP}" \
            -DPEPEPOW_CUDA_THREADS="${CUDA_THREADS}" \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static

          generated="build/hiveos-cuda/header80_backend_cuda118_kv3a_t${CUDA_THREADS}.cu"
          test -s "${generated}"
          grep -F '__device__ double d_matrix_cheap[64][64];' "${generated}"
          grep -F 'd_matrix_cheap[i][j]=cell*0.0001;' "${generated}"
          grep -F 'product+=d_matrix_cheap[row][j]*v;' "${generated}"
          if grep -F 'product+=d_matrix[row][j]*0.0001*v;' "${generated}"; then
            echo "ERROR: baseline cheap-path multiply survived KV3-A transform"
            exit 1
          fi
          grep -F "constexpr unsigned threads=${CUDA_THREADS};" "${generated}"
          echo "[SOURCE] KV3-A transform verified"

      - name: Build miner
        run: |
          set -o pipefail
          cmake --build build/hiveos-cuda --target pepepowminer --parallel 2>&1 | tee /tmp/pepew-build.log
          echo "--- PTXAS RESOURCE SUMMARY ---"
          grep -E 'ptxas info.*(Used|Function properties)|bytes stack frame|bytes spill' /tmp/pepew-build.log || true

      - name: Smoke test binary
        run: |
          set -euo pipefail
          file build/hiveos-cuda/pepepowminer
          test -x build/hiveos-cuda/pepepowminer
          ldd build/hiveos-cuda/pepepowminer || true
          build/hiveos-cuda/pepepowminer --help | grep -F 'PepePowMiner'

      - name: Validate HiveOS callbacks
        run: |
          set -euo pipefail
          bash -n hiveos/h-config.sh hiveos/h-run.sh hiveos/h-stats.sh

          test_log=/tmp/pepew-stats-test
          printf '%s\n' '[MINING] 12.345 MH/s | A 7 | R 1 | UP 00:01:23 | REC 2 | STATE online' > "${test_log}.log"
          stats_result=$(
            CUSTOM_LOG_BASENAME="${test_log}" \
            CUSTOM_VERSION="v100-kv3-test" \
            bash -c 'source hiveos/h-stats.sh; printf "khs=%s\nstats=%s\n" "$khs" "$stats"'
          )
          grep -F 'khs=12345' <<< "${stats_result}"
          grep -F '"uptime":83' <<< "${stats_result}"
          grep -F '"ar":[7,1,0,"0"]' <<< "${stats_result}"
          grep -F '"ver":"v100-kv3-test"' <<< "${stats_result}"
          grep -F '"algo":"hoohash"' <<< "${stats_result}"

          fakebin=/tmp/pepew-fakebin
          mkdir -p "${fakebin}"
          cat > "${fakebin}/nvidia-smi" <<'EOF'
          #!/usr/bin/env bash
          if [[ "$*" == *"--query-gpu=index,pci.bus_id,temperature.gpu,fan.speed"* ]]; then
            printf '%s\n' '0, 00000000:02:00.0, 54, N/A'
            printf '%s\n' '1, 00000000:85:00.0, 67, 72'
            exit 0
          fi
          exit 1
          EOF
          chmod +x "${fakebin}/nvidia-smi"

          printf '%s\n' \
            '[GPU0] 8.542 MH/s | A 3 | R 0 | UP 00:02:05 | REC 0 | STATE online' \
            '[GPU1] 8.101 MH/s | A 3 | R 0 | UP 00:02:05 | REC 0 | STATE online' \
            '[MINING] 16.643 MH/s | A 3 | R 0 | UP 00:02:05 | REC 0 | STATE online' \
            > "${test_log}.log"
          multi_stats=$(
            PATH="${fakebin}:$PATH" \
            CUSTOM_LOG_BASENAME="${test_log}" \
            CUSTOM_VERSION="v100-kv3-test" \
            bash -c 'source hiveos/h-stats.sh; printf "%s\n" "$stats"'
          )
          grep -F '"hs":[8542,8101]' <<< "${multi_stats}"
          grep -F '"temp":[54,67]' <<< "${multi_stats}"
          grep -F '"fan":[0,72]' <<< "${multi_stats}"
          grep -F '"ar":[3,0,0,"0;0"]' <<< "${multi_stats}"
          grep -F '"bus_numbers":[2,133]' <<< "${multi_stats}"

      - name: Test HiveOS config callback
        run: |
          set -euo pipefail
          test_config=/tmp/pepew-hiveos-config.txt
          rm -f "${test_config}"
          CUSTOM_CONFIG_FILENAME="${test_config}" \
          CUSTOM_URL="stratum+tcp://example.invalid:13232" \
          CUSTOM_TEMPLATE="wallet.worker" \
          CUSTOM_PASS="x" \
          bash -c 'source hiveos/h-config.sh'
          test -s "${test_config}"
          grep -F -- '-o stratum+tcp://example.invalid:13232' "${test_config}"
          grep -F -- '-u wallet.worker' "${test_config}"
          grep -F -- '--pepepow' "${test_config}"

      - name: Assemble HiveOS V100 KV3-A archive
        run: |
          set -euo pipefail
          package_dir="dist/${CUSTOM_MINER_NAME}"
          rm -rf dist
          mkdir -p "${package_dir}"

          install -m 0755 build/hiveos-cuda/pepepowminer "${package_dir}/pepepowminer"
          install -m 0755 hiveos/h-run.sh "${package_dir}/h-run.sh"
          install -m 0755 hiveos/h-config.sh "${package_dir}/h-config.sh"
          install -m 0755 hiveos/h-stats.sh "${package_dir}/h-stats.sh"
          install -m 0644 hiveos/h-manifest.conf "${package_dir}/h-manifest.conf"
          sed -i "s/^CUSTOM_VERSION=.*/CUSTOM_VERSION=${BUILD_VERSION}/" "${package_dir}/h-manifest.conf"

          cat > "${package_dir}/BUILD_INFO.txt" <<EOF
          version=${BUILD_VERSION}
          commit=${GITHUB_SHA}
          ref=${GITHUB_REF_NAME}
          channel=${RELEASE_TAG}
          baseline=${BASELINE_BUILD}
          cuda_toolkit=${CUDA_TOOLKIT}
          cuda_archs=${CUDA_ARCHS}
          cuda_max_registers=${CUDA_REG_CAP}
          cuda_threads=${CUDA_THREADS}
          launch=dynamic-grid
          kernel=kv3a-strict-cheap-precompute-t${CUDA_THREADS}
          optimization=precompute-matrix-times-0.0001
          consensus=strict-fp64
          custom_miner=${CUSTOM_MINER_NAME}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          strip "${package_dir}/pepepowminer" || true
          tar -C dist -czf "dist/${ASSET_NAME}" "${CUSTOM_MINER_NAME}"
          sha256sum "dist/${ASSET_NAME}" | sed "s#dist/##" > "dist/${SHA_NAME}"
          tar -tzf "dist/${ASSET_NAME}"
          cat "dist/${SHA_NAME}"

      - name: Validate archive layout and identity
        run: |
          set -euo pipefail
          archive_list=/tmp/pepew-hiveos-archive-list.txt
          unpack=/tmp/pepew-kv3a-identity
          rm -rf "${unpack}"
          mkdir -p "${unpack}"
          tar -tzf "dist/${ASSET_NAME}" > "${archive_list}"
          test "$(sed -n '1p' "${archive_list}")" = "${CUSTOM_MINER_NAME}/"
          grep -Fx "${CUSTOM_MINER_NAME}/h-manifest.conf" "${archive_list}"
          grep -Fx "${CUSTOM_MINER_NAME}/h-config.sh" "${archive_list}"
          grep -Fx "${CUSTOM_MINER_NAME}/h-run.sh" "${archive_list}"
          grep -Fx "${CUSTOM_MINER_NAME}/h-stats.sh" "${archive_list}"
          grep -Fx "${CUSTOM_MINER_NAME}/pepepowminer" "${archive_list}"
          tar -xzf "dist/${ASSET_NAME}" -C "${unpack}"
          grep -Fx "CUSTOM_VERSION=${BUILD_VERSION}" "${unpack}/${CUSTOM_MINER_NAME}/h-manifest.conf"
          grep -Fx "version=${BUILD_VERSION}" "${unpack}/${CUSTOM_MINER_NAME}/BUILD_INFO.txt"
          grep -Fx "baseline=${BASELINE_BUILD}" "${unpack}/${CUSTOM_MINER_NAME}/BUILD_INFO.txt"
          grep -Fx "cuda_threads=${CUDA_THREADS}" "${unpack}/${CUSTOM_MINER_NAME}/BUILD_INFO.txt"
          grep -Fx 'launch=dynamic-grid' "${unpack}/${CUSTOM_MINER_NAME}/BUILD_INFO.txt"
          grep -Fx "kernel=kv3a-strict-cheap-precompute-t${CUDA_THREADS}" "${unpack}/${CUSTOM_MINER_NAME}/BUILD_INFO.txt"
          grep -Fx 'optimization=precompute-matrix-times-0.0001' "${unpack}/${CUSTOM_MINER_NAME}/BUILD_INFO.txt"
          grep -Fx 'consensus=strict-fp64' "${unpack}/${CUSTOM_MINER_NAME}/BUILD_INFO.txt"
          if grep -Fx 'CUSTOM_VERSION=dev' "${unpack}/${CUSTOM_MINER_NAME}/h-manifest.conf"; then
            echo "ERROR: archive contains dev manifest"
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pepew-v100-kv3a-${{ github.sha }}
          path: |
            dist/${{ env.ASSET_NAME }}
            dist/${{ env.SHA_NAME }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish isolated V100 KV3 rolling asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          notes=$(cat <<EOF
          Automated PepeW Tesla V100 KV3-A strict hot-loop experiment.

          Build: ${BUILD_VERSION}
          Commit: ${GITHUB_SHA}
          Ref: ${GITHUB_REF_NAME}
          Baseline: ${BASELINE_BUILD}
          CUDA toolkit: ${CUDA_TOOLKIT}
          CUDA architectures: ${CUDA_ARCHS}
          Max registers/thread: ${CUDA_REG_CAP}
          Threads/block: ${CUDA_THREADS}
          Launch: dynamic grid (same geometry as KV2-B)
          Optimization: precompute matrix*0.0001 once per job
          Consensus mode: strict FP64; fmad disabled; precise div/sqrt; FTZ disabled

          KV3-A changes only the dominant cheap HooHash path. The job-constant first FP64 multiplication (matrix cell * 0.0001) is performed once during job preparation and cached. Per-nonce arithmetic order after that intermediate is unchanged. GPU KAT remains mandatory before performance acceptance on the V100 rig.
          EOF
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "dist/${ASSET_NAME}" "dist/${SHA_NAME}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "dist/${ASSET_NAME}" \
              "dist/${SHA_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "PepeW Miner Tesla V100 KV3 DEV" \
              --notes "${notes}" \
              --prerelease
          fi

          echo "V100 KV3 DEV asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
