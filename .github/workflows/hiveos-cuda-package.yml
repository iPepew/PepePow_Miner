name: HiveOS V100 KV3-B Strict Scalar Package

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/v100-kv3b-scalar"
    paths:
      - "native/**"
      - "hiveos/**"
      - ".github/workflows/hiveos-cuda-package.yml"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-hiveos-package:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:11.8.0-devel-ubuntu22.04
    env:
      CUDA_TOOLKIT: "11.8"
      CUDA_ARCHS: "70;75;86"
      CUDA_REG_CAP: "128"
      CUDA_THREADS: "256"
      CUSTOM_MINER_NAME: PepeW-Miner
      ASSET_NAME: PepeW-Miner-HiveOS.tar.gz
      SHA_NAME: PepeW-Miner-HiveOS.tar.gz.sha256
      RELEASE_TAG: hiveos-v100-kv3b-test
      BASELINE_BUILD: v100-kv2b-t256-c49bf75

    steps:
      - name: Install build tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git build-essential ca-certificates file python3-pip gh
          python3 -m pip install --no-cache-dir cmake==3.30.5
          cmake --version
          nvcc --version
          gh --version
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate candidate version
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          build_version="v100-kv3b-scalar-t${CUDA_THREADS}-${short_sha}"
          echo "BUILD_VERSION=${build_version}" >> "${GITHUB_ENV}"
          echo "Candidate: ${build_version}"
          echo "Baseline: ${BASELINE_BUILD}"
          echo "Geometry: ${CUDA_THREADS} threads/block; R${CUDA_REG_CAP}"
          echo "Optimization: strict nonlinear scalar cleanup"

      - name: Configure CUDA release and verify generated source
        run: |
          set -euo pipefail
          cmake -S native -B build/hiveos-cuda \
            -DCMAKE_BUILD_TYPE=Release \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=OFF \
            -DPEPEPOW_CUDA_ARCHITECTURES="${CUDA_ARCHS}" \
            -DPEPEPOW_CUDA_MAX_REGISTERS="${CUDA_REG_CAP}" \
            -DPEPEPOW_CUDA_THREADS="${CUDA_THREADS}" \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static

          generated="build/hiveos-cuda/header80_backend_cuda118_kv3b_t${CUDA_THREADS}.cu"
          test -s "${generated}"
          grep -F 'const double scaled=x*kTM;' "${generated}"
          grep -F 'const double q=scaled*0.125;' "${generated}"
          grep -F 'if(two>=1.0)two-=1.0;' "${generated}"
          grep -F 'return complex_transform(input);' "${generated}"
          grep -F "constexpr unsigned threads=${CUDA_THREADS};" "${generated}"

          if grep -F 'while(isnan(value)||isinf(value))' "${generated}"; then
            echo "ERROR: unreachable safe_complex retry loop survived transform"
            exit 1
          fi
          if grep -F 'const double two=(x*kTM)/4.0-floor((x*kTM)/4.0);' "${generated}"; then
            echo "ERROR: redundant second floor survived transform"
            exit 1
          fi
          if grep -F 'd_matrix_cheap' "${generated}"; then
            echo "ERROR: rejected KV3-A second matrix leaked into KV3-B"
            exit 1
          fi
          echo "[SOURCE] KV3-B transform verified"

      - name: Build miner and capture PTXAS resources
        run: |
          set -o pipefail
          cmake --build build/hiveos-cuda --target pepepowminer --parallel 2>&1 | tee /tmp/pepew-build.log
          echo "--- PTXAS RESOURCE SUMMARY ---"
          grep -E 'ptxas info.*(Used|Function properties)|bytes stack frame|bytes spill' /tmp/pepew-build.log || true

      - name: Smoke test binary and HiveOS callbacks
        run: |
          set -euo pipefail
          file build/hiveos-cuda/pepepowminer
          test -x build/hiveos-cuda/pepepowminer
          build/hiveos-cuda/pepepowminer --help | grep -F 'PepePowMiner'
          bash -n hiveos/h-config.sh hiveos/h-run.sh hiveos/h-stats.sh

      - name: Assemble HiveOS KV3-B archive
        run: |
          set -euo pipefail
          package_dir="dist/${CUSTOM_MINER_NAME}"
          rm -rf dist
          mkdir -p "${package_dir}"

          install -m 0755 build/hiveos-cuda/pepepowminer "${package_dir}/pepepowminer"
          install -m 0755 hiveos/h-run.sh "${package_dir}/h-run.sh"
          install -m 0755 hiveos/h-config.sh "${package_dir}/h-config.sh"
          install -m 0755 hiveos/h-stats.sh "${package_dir}/h-stats.sh"
          install -m 0644 hiveos/h-manifest.conf "${package_dir}/h-manifest.conf"
          sed -i "s/^CUSTOM_VERSION=.*/CUSTOM_VERSION=${BUILD_VERSION}/" "${package_dir}/h-manifest.conf"

          cat > "${package_dir}/BUILD_INFO.txt" <<EOF
          version=${BUILD_VERSION}
          commit=${GITHUB_SHA}
          ref=${GITHUB_REF_NAME}
          channel=${RELEASE_TAG}
          baseline=${BASELINE_BUILD}
          cuda_toolkit=${CUDA_TOOLKIT}
          cuda_archs=${CUDA_ARCHS}
          cuda_max_registers=${CUDA_REG_CAP}
          cuda_threads=${CUDA_THREADS}
          launch=dynamic-grid
          kernel=kv3b-strict-nonlinear-scalar-t${CUDA_THREADS}
          optimization=one-floor-transform-factor+finite-domain-safe-complex
          consensus=strict-fp64
          custom_miner=${CUSTOM_MINER_NAME}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          strip "${package_dir}/pepepowminer" || true
          tar -C dist -czf "dist/${ASSET_NAME}" "${CUSTOM_MINER_NAME}"
          sha256sum "dist/${ASSET_NAME}" | sed "s#dist/##" > "dist/${SHA_NAME}"
          tar -tzf "dist/${ASSET_NAME}"
          cat "dist/${SHA_NAME}"

      - name: Validate package identity
        run: |
          set -euo pipefail
          unpack=/tmp/pepew-kv3b-identity
          rm -rf "${unpack}"
          mkdir -p "${unpack}"
          tar -xzf "dist/${ASSET_NAME}" -C "${unpack}"

          info="${unpack}/${CUSTOM_MINER_NAME}/BUILD_INFO.txt"
          manifest="${unpack}/${CUSTOM_MINER_NAME}/h-manifest.conf"
          grep -Fx "CUSTOM_VERSION=${BUILD_VERSION}" "${manifest}"
          grep -Fx "version=${BUILD_VERSION}" "${info}"
          grep -Fx "baseline=${BASELINE_BUILD}" "${info}"
          grep -Fx "cuda_threads=${CUDA_THREADS}" "${info}"
          grep -Fx 'launch=dynamic-grid' "${info}"
          grep -Fx "kernel=kv3b-strict-nonlinear-scalar-t${CUDA_THREADS}" "${info}"
          grep -Fx 'optimization=one-floor-transform-factor+finite-domain-safe-complex' "${info}"
          grep -Fx 'consensus=strict-fp64' "${info}"
          if grep -Fx 'CUSTOM_VERSION=dev' "${manifest}"; then
            echo "ERROR: archive contains dev manifest"
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pepew-v100-kv3b-${{ github.sha }}
          path: |
            dist/${{ env.ASSET_NAME }}
            dist/${{ env.SHA_NAME }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish isolated KV3-B rolling asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          notes=$(cat <<EOF
          PepeW Tesla V100 KV3-B strict scalar experiment.

          Build: ${BUILD_VERSION}
          Baseline: ${BASELINE_BUILD}
          Commit: ${GITHUB_SHA}
          CUDA: ${CUDA_TOOLKIT}
          Architectures: ${CUDA_ARCHS}
          Registers cap: ${CUDA_REG_CAP}
          Threads/block: ${CUDA_THREADS}

          KV3-A's second matrix is fully reverted. KV3-B keeps the KV2-B memory layout and attacks only the nonlinear scalar instruction path: one redundant floor is removed and the unreachable non-finite retry loop is collapsed. Strict FP64 compiler flags remain enabled.
          EOF
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "dist/${ASSET_NAME}" "dist/${SHA_NAME}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "dist/${ASSET_NAME}" \
              "dist/${SHA_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "PepeW Miner Tesla V100 KV3-B DEV" \
              --notes "${notes}" \
              --prerelease
          fi

          echo "KV3-B asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
