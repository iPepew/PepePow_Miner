name: PepeW-Miner-v2.1 V100 split direct HooHash

on:
  push:
    branches:
      - agent/v21-v100-split-direct
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    env:
      RELEASE_TAG: v2.1-beta.1-v100-split-direct-test
      ROOT: PepeW-Miner
      ASSET: PepeW-Miner-HiveOS.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates git ninja-build python3 python3-pip tar gzip file binutils gh
          python3 -m pip install --no-cache-dir "cmake==3.31.6"
          rm -rf /var/lib/apt/lists/*
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70

      - name: Apply professional console UI
        run: |
          set -Eeuo pipefail
          python3 scripts/professional_console_ui_v21.py

      - name: Configure V100 split direct candidate
        run: |
          set -Eeuo pipefail
          export CUDACXX=/usr/local/cuda/bin/nvcc
          cmake -S native -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=ON \
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON \
            -DPEPEPOW_CUDA_ARCHITECTURES="70-real" \
            -DPEPEPOW_CUDA_THREADS=704 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            -DPEPEPOW_CUDA_BYTE_UNROLL=1 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=ON \
            -DPEPEPOW_CUDA_SCALED_MATRIX=ON \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON \
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON \
            -DPEPEPOW_CUDA_SW_STATE_MODE=3 \
            -DPEPEPOW_CUDA_DERIVE_TWO=OFF

      - name: Build and verify
        run: |
          set -Eeuo pipefail
          cmake --build build --parallel 4 --target pepepowminer pepepow_core_tests pepepow_cuda_tests pepepow_cuda_header80_validation pepepow_header80_benchmark 2>&1 | tee /tmp/build.log
          ./build/pepepowminer --version | tee /tmp/version.txt
          grep -F '2.1-beta.1' /tmp/version.txt
          /usr/local/cuda/bin/cuobjdump --list-elf build/pepepowminer | tee /tmp/elf.txt
          grep -F sm_70 /tmp/elf.txt
          ! grep -Eq 'sm_(61|75|86|89|120)' /tmp/elf.txt
          strings -a build/pepepowminer | grep -F 'POOL_REFERENCE hoohash=V110 matrix_seed=BLAKE3_MASKED_HEADER header_nonce=BE32 mix_nonce=LE32 submit_nonce=LE_HEX share_target=NBITS_DIV_DIFFICULTY'
          strings -a build/pepepowminer | grep -F 'cuda-header80-split-pipeline'
          ctest --test-dir build --output-on-failure -R '^pepepow_core_tests$'
          grep -F 'hoohash_mix_kernel' /tmp/build.log
          if grep -Ei 'spill stores|spill loads' /tmp/build.log | grep -Ev '0 bytes spill stores, 0 bytes spill loads'; then
            echo 'Non-zero CUDA spills detected' >&2
            exit 1
          fi
          grep -E 'Function properties|Used [0-9]+ registers|bytes smem|used [0-9]+ barriers' /tmp/build.log || true

      - name: Assemble HiveOS package
        run: |
          set -Eeuo pipefail
          rm -rf stage dist
          mkdir -p "stage/${ROOT}" dist
          install -m 0755 build/pepepowminer "stage/${ROOT}/pepepowminer"
          install -m 0755 hiveos/h-config.sh "stage/${ROOT}/h-config.sh"
          install -m 0755 hiveos/h-run.sh "stage/${ROOT}/h-run.sh"
          install -m 0755 hiveos/h-stats.sh "stage/${ROOT}/h-stats.sh"
          install -m 0755 hiveos/stratum-replay-proxy.py "stage/${ROOT}/stratum-replay-proxy.py"
          install -m 0644 hiveos/h-manifest.conf "stage/${ROOT}/h-manifest.conf"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('stage/PepeW-Miner/h-stats.sh')
          s = p.read_text(encoding='utf-8').replace('"ver":"1.0.6"', '"ver":"v2.1 BETA"').replace('"ver":"v2.0 BETA"', '"ver":"v2.1 BETA"')
          p.write_text(s, encoding='utf-8')
          PY
          cat > "stage/${ROOT}/BUILD_INFO.txt" <<EOF
          product=PepeW-Miner-v2.1 BETA
          version=2.1-beta.1
          source_branch=${GITHUB_REF_NAME}
          source_commit=${GITHUB_SHA}
          source_behavior=v2.1-beta.1-service704-share-producing
          optimization=split-direct-hoohash-pipeline
          cuda_toolkit=12.8.1
          cuda_native=sm_70
          gpu_target=Tesla V100 / Volta
          cuda_profile=split-direct-t704-test
          threads=704
          min_blocks=1
          split_pipeline=ON
          byte_unroll=1
          algorithm=HooHash V110
          hive_ar=accepted,rejected
          release_channel=BETA_TEST
          previous_verified_avg_mhs=4.101
          previous_verified_accepted=68
          previous_verified_rejected=0
          EOF
          sha256sum "stage/${ROOT}/pepepowminer" > "stage/${ROOT}/pepepowminer.sha256"
          tar --sort=name --owner=0 --group=0 --numeric-owner -C stage -cf - "${ROOT}" | gzip -n > "dist/${ASSET}"
          sha256sum "dist/${ASSET}" > "dist/${ASSET}.sha256"

      - name: Publish isolated split direct prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          notes="Isolated Tesla V100 architecture test from verified v2.1 service704 base. Enables the existing three-stage Header80 split pipeline so HooHash runs in the independent hoohash_mix_kernel without the monolithic per-cell cold-service barrier queue. HooHash/Stratum semantics, threads=704, min_blocks=1, SW_STATE_MODE=3 and byte_unroll=1 remain unchanged. Promotion requires real accepted shares."
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/${ASSET}" "dist/${ASSET}.sha256" --repo "$GH_REPO" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --title "PepeW-Miner-v2.1 V100 split direct HooHash test" --notes "$notes" --prerelease
          else
            gh release create "$RELEASE_TAG" "dist/${ASSET}" "dist/${ASSET}.sha256" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "PepeW-Miner-v2.1 V100 split direct HooHash test" --notes "$notes" --prerelease
          fi

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pepew-v21-split-direct-${{ github.sha }}
          path: |
            dist/PepeW-Miner-HiveOS.tar.gz
            dist/PepeW-Miner-HiveOS.tar.gz.sha256
            /tmp/build.log
            /tmp/version.txt
            /tmp/elf.txt
          retention-days: 30
