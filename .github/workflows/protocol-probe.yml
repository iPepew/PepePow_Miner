name: Protocol Probe

on:
  push:
    paths:
      - '.github/workflows/protocol-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Inspect pool protocol
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pool-pepepow
          git clone --depth 1 https://github.com/edisontw/pool-pepepow.git /tmp/pool-pepepow
          mkdir -p docs
          REPORT=docs/pepepow-stratum-protocol.txt
          {
            echo '=== FILES ==='
            find /tmp/pool-pepepow/apps/pool-core -type f | sort
            echo '=== STRATUM METHODS ==='
            grep -RInE 'mining\.(subscribe|authorize|notify|submit|set_difficulty)|extranonce|difficulty|target' /tmp/pool-pepepow/apps/pool-core /tmp/pool-pepepow/tests | head -n 1000 || true
            echo '=== SOURCE SNIPPETS ==='
            grep -RIlE 'mining\.(subscribe|authorize|notify|submit|set_difficulty)' /tmp/pool-pepepow/apps/pool-core | while read -r f; do
              echo "--- $f ---"
              sed -n '1,420p' "$f"
            done
          } > "$REPORT"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT"
          git commit -m 'Document PEPEPOW Stratum wire protocol'
          git push origin main
