name: V100 Static Service704 Resource Gate

on:
  push:
    branches:
      - agent/v21-v100-static-service704
    paths:
      - native/tests/static_service704_probe.cu
      - .github/workflows/v100-static-service704-probe.yml
  workflow_dispatch:

jobs:
  compile-sm70:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile static service704 probe for Volta
        shell: bash
        run: |
          set -euo pipefail
          /usr/local/cuda/bin/nvcc -std=c++17 -O3 -arch=sm_70 -lineinfo \
            -Xptxas=-v \
            -c native/tests/static_service704_probe.cu \
            -o /tmp/static_service704_probe.o 2>&1 | tee /tmp/ptxas-static-service704.log
          test -s /tmp/static_service704_probe.o
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' /tmp/ptxas-static-service704.log
      - name: Upload resource log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-service704-sm70-${{ github.sha }}
          path: /tmp/ptxas-static-service704.log
          if-no-files-found: warn
          retention-days: 30
