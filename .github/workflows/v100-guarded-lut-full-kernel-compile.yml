name: V100 Guarded LUT Full Share Kernel Compile Gate

on:
  push:
    branches:
      - agent/v21-v100-guarded-duallut-rowcp
    paths:
      - 'native/src/cuda/header80_backend.cu'
      - 'native/src/cuda/guarded_lut_primitives.cuh'
      - 'native/src/cuda/v1/header80_guarded_lut_path.inc'
      - '.github/workflows/v100-guarded-lut-full-kernel-compile.yml'
  workflow_dispatch:

jobs:
  compile-sm70:
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile complete share-producing guarded kernel for sm_70
        shell: bash
        run: |
          set -euo pipefail
          nvcc -std=c++20 -arch=sm_70 --fmad=false -Xptxas=-v \
            -DPEPEPOW_CUDA_THREADS=704 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=0 \
            -DPEPEPOW_CUDA_SCALED_MATRIX=1 \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=1 \
            -DPEPEPOW_CUDA_ASSUME_FINITE=1 \
            -DPEPEPOW_CUDA_SW_STATE_MODE=3 \
            -DPEPEPOW_CUDA_GUARDED_LUT=1 \
            -I native/include -I native/src/cuda \
            -c native/src/cuda/header80_backend.cu \
            -o /tmp/header80_guarded_full.o \
            2>&1 | tee /tmp/ptxas.log
          echo '=== full guarded kernel ptxas summary ==='
          grep -E 'header80_pow_guarded_kernel|Used [0-9]+ registers|spill|stack frame|barrier' /tmp/ptxas.log || true
          if grep -Eq '[1-9][0-9]* bytes spill stores|[1-9][0-9]* bytes spill loads' /tmp/ptxas.log; then
            echo 'ERROR: full guarded share kernel spills on sm_70'
            exit 1
          fi
