name: v1.0.6 Volta async3

on:
  workflow_dispatch:
  push:
    branches: [release/v1.0.6]
    paths:
      - "VERSION"
      - "native/**"
      - "hiveos/**"
      - "tools/prepare-v106-volta-async3.py"
      - "tools/stage-v106-hiveos.py"
      - ".github/workflows/v106-volta-async3.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-v100-v106:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates git ninja-build python3 python3-pip tar gzip binutils
          python3 -m pip install --no-cache-dir 'cmake==3.31.6'
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70

      - name: Prepare source
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '1.0.6'
          python3 tools/prepare-v106-volta-async3.py

      - name: Configure and build
        run: |
          set -Eeuo pipefail
          export CUDACXX=/usr/local/cuda/bin/nvcc
          cmake -S native -B build-v106-v100 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc -DPEPEPOW_ENABLE_CUDA=ON -DPEPEPOW_BUILD_TESTS=ON -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON -DPEPEPOW_CUDA_ARCHITECTURES='70-real' -DPEPEPOW_CUDA_THREADS=768 -DPEPEPOW_CUDA_MIN_BLOCKS=1 -DPEPEPOW_CUDA_SPLIT_PIPELINE=OFF -DPEPEPOW_CUDA_SCALED_MATRIX=ON -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON -DPEPEPOW_CUDA_ASSUME_FINITE=ON -DPEPEPOW_CUDA_SW_STATE_MODE=3
          cmake --build build-v106-v100 --parallel 4 --target pepepowminer pepepow_core_tests pepepow_cuda_tests pepepow_cuda_header80_validation pepepow_header80_benchmark
          ./build-v106-v100/pepepowminer --version | tee binary-version.txt
          grep -F '1.0.6' binary-version.txt
          ctest --test-dir build-v106-v100 --output-on-failure -R '^pepepow_core_tests$'

      - name: Inspect Volta binary
        run: |
          set -Eeuo pipefail
          /usr/local/cuda/bin/cuobjdump --list-elf build-v106-v100/pepepowminer | tee volta-fatbin.txt
          grep -F sm_70 volta-fatbin.txt
          /usr/local/cuda/bin/cuobjdump --dump-resource-usage build-v106-v100/pepepowminer | tee volta-resource-usage.txt

      - name: Package HiveOS candidate
        run: |
          set -Eeuo pipefail
          python3 tools/stage-v106-hiveos.py | tee package-info.txt
          bash -n dist-stage/PepeW-Miner-v1.0.6-HiveOS/h-config.sh
          bash -n dist-stage/PepeW-Miner-v1.0.6-HiveOS/h-run.sh
          (cd dist-stage/PepeW-Miner-v1.0.6-HiveOS && sha256sum -c pepepowminer.sha256)
          mkdir -p dist
          tar --sort=name --owner=0 --group=0 --numeric-owner -C dist-stage -cf - PepeW-Miner-v1.0.6-HiveOS | gzip -n > dist/PepeW-Miner-v1.0.6-HiveOS.tar.gz
          (cd dist && sha256sum PepeW-Miner-v1.0.6-HiveOS.tar.gz > PepeW-Miner-v1.0.6-HiveOS.tar.gz.sha256)
          tar -tzf dist/PepeW-Miner-v1.0.6-HiveOS.tar.gz > dist/archive-list.txt
          grep -Fqx 'PepeW-Miner-v1.0.6-HiveOS/pepepowminer' dist/archive-list.txt

      - name: Upload v1.0.6 candidate
        uses: actions/upload-artifact@v4
        with:
          name: PepeW-Miner-v1.0.6-HiveOS-v100-async3
          path: |
            dist/PepeW-Miner-v1.0.6-HiveOS.tar.gz
            dist/PepeW-Miner-v1.0.6-HiveOS.tar.gz.sha256
            binary-version.txt
            volta-fatbin.txt
            volta-resource-usage.txt
            package-info.txt
          if-no-files-found: error
          retention-days: 14
