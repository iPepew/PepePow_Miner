name: v1.0.8 Volta fast1

on:
  workflow_dispatch:
  push:
    branches: [release/v1.0.8]
    paths:
      - "VERSION"
      - "native/**"
      - "hiveos/**"
      - "tools/prepare-v108-volta-fast1.py"
      - "tools/check-v108-fast1.py"
      - "tools/stage-v108-hiveos.py"
      - ".github/workflows/v108-volta-fast1.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-v100-v108:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates git ninja-build python3 python3-pip tar gzip binutils
          python3 -m pip install --no-cache-dir 'cmake==3.31.6'
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70

      - name: Validate fast1 numerical contract
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '1.0.8'
          python3 tools/check-v108-fast1.py | tee fast1-numerical.txt
          grep -F 'V108_FAST1_NUMERICAL_CONTRACT=PASS' fast1-numerical.txt

      - name: Prepare v1.0.8 source
        run: |
          set -Eeuo pipefail
          python3 tools/prepare-v108-volta-fast1.py

      - name: Configure and build
        run: |
          set -Eeuo pipefail
          export CUDACXX=/usr/local/cuda/bin/nvcc
          cmake -S native -B build-v108-v100 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=ON \
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON \
            -DPEPEPOW_CUDA_ARCHITECTURES='70-real' \
            -DPEPEPOW_CUDA_THREADS=768 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=OFF \
            -DPEPEPOW_CUDA_SCALED_MATRIX=ON \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON \
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON \
            -DPEPEPOW_CUDA_SW_STATE_MODE=3
          cmake --build build-v108-v100 --parallel 4 --target pepepowminer pepepow_core_tests pepepow_cuda_tests pepepow_cuda_header80_validation
          ./build-v108-v100/pepepowminer --version | tee binary-version.txt
          grep -F '1.0.8' binary-version.txt
          ctest --test-dir build-v108-v100 --output-on-failure -R '^pepepow_core_tests$'

      - name: Verify final Volta executable
        run: |
          set -Eeuo pipefail
          FINAL='build-v108-v100/pepepowminer'
          CUDA_OBJ='build-v108-v100/CMakeFiles/pepepow_cuda.dir/src/cuda/header80_backend.cu.o'
          test -s "$FINAL"
          test -s "$CUDA_OBJ"
          /usr/local/cuda/bin/cuobjdump --list-elf "$FINAL" | tee final-fatbin.txt
          grep -F sm_70 final-fatbin.txt
          /usr/local/cuda/bin/cuobjdump --dump-resource-usage "$FINAL" | tee final-resource-usage.txt
          grep -F 'header80_pow_kernel' final-resource-usage.txt
          /usr/local/cuda/bin/cuobjdump --list-elf "$CUDA_OBJ" | tee object-fatbin.txt
          grep -F sm_70 object-fatbin.txt
          readelf -S "$FINAL" | tee binary-sections.txt
          grep -E '\.nv_fatbin|\.nvFatBinSegment' binary-sections.txt

      - name: Package HiveOS candidate
        run: |
          set -Eeuo pipefail
          python3 tools/stage-v108-hiveos.py | tee package-info.txt
          ROOT='dist-stage/PepeW-Miner-v1.0.8'
          test -d "$ROOT"
          bash -n "$ROOT/h-config.sh"
          bash -n "$ROOT/h-run.sh"
          python3 -m py_compile "$ROOT/stratum-replay-proxy.py"
          grep -Fqx 'CUSTOM_NAME=PepeW-Miner-v1.0.8' "$ROOT/h-manifest.conf"
          grep -Fqx 'CUSTOM_VERSION=1.0.8' "$ROOT/h-manifest.conf"
          ! grep -Fq 'PepeW-Miner-v1.0.8-HiveOS' "$ROOT/h-manifest.conf"
          grep -Fqx 'kernel_mode=volta-fast1' "$ROOT/BUILD_PROFILE"
          grep -Fqx 'topology=service24' "$ROOT/BUILD_PROFILE"
          grep -Fqx 'cpu_candidate_validation=consensus-exact' "$ROOT/BUILD_PROFILE"
          (cd "$ROOT" && sha256sum -c pepepowminer.sha256)
          mkdir -p dist
          tar --sort=name --owner=0 --group=0 --numeric-owner -C dist-stage -cf - PepeW-Miner-v1.0.8 | gzip -n > dist/PepeW-Miner-v1.0.8-HiveOS.tar.gz
          (cd dist && sha256sum PepeW-Miner-v1.0.8-HiveOS.tar.gz > PepeW-Miner-v1.0.8-HiveOS.tar.gz.sha256)
          tar -tzf dist/PepeW-Miner-v1.0.8-HiveOS.tar.gz > dist/archive-list.txt
          grep -Fqx 'PepeW-Miner-v1.0.8/pepepowminer' dist/archive-list.txt
          grep -Fqx 'PepeW-Miner-v1.0.8/h-manifest.conf' dist/archive-list.txt
          ! grep -Fq '^PepeW-Miner-v1.0.8-HiveOS/' dist/archive-list.txt

      - name: Upload v1.0.8 candidate
        uses: actions/upload-artifact@v4
        with:
          name: PepeW-Miner-v1.0.8-HiveOS-v100-fast1
          path: |
            dist/PepeW-Miner-v1.0.8-HiveOS.tar.gz
            dist/PepeW-Miner-v1.0.8-HiveOS.tar.gz.sha256
            dist/archive-list.txt
            binary-version.txt
            final-fatbin.txt
            final-resource-usage.txt
            object-fatbin.txt
            binary-sections.txt
            fast1-numerical.txt
            package-info.txt
          if-no-files-found: error
          retention-days: 14
