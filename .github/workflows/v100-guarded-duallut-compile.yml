name: V100 Guarded Dual-LUT Compile Gate

on:
  push:
    branches:
      - agent/v21-v100-guarded-duallut-rowcp
    paths:
      - native/src/cuda/guarded_lut_primitives.cuh
      - native/tests/guarded_lut_compile_probe.cu
      - .github/workflows/v100-guarded-duallut-compile.yml
  workflow_dispatch:

jobs:
  compile-sm70:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile guarded LUT primitives for Volta
        shell: bash
        run: |
          set -euo pipefail
          /usr/local/cuda/bin/nvcc -std=c++17 -O3 -arch=sm_70 -lineinfo \
            -Xptxas=-v \
            -c native/tests/guarded_lut_compile_probe.cu \
            -o /tmp/guarded_lut_compile_probe.o 2>&1 | tee /tmp/ptxas.log
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' /tmp/ptxas.log
          test -s /tmp/guarded_lut_compile_probe.o
      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guarded-duallut-sm70-compile-${{ github.sha }}
          path: /tmp/ptxas.log
          if-no-files-found: warn
          retention-days: 30
