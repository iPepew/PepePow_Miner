name: v1.0.4 CUDA fatbin build

on:
  push:
    branches:
      - release/v1.0.4
    paths:
      - "native/**"
      - "hiveos/**"
      - "tools/build-v104-universal.sh"
      - "VERSION"
      - "README.md"
      - "RELEASE_NOTES_v1.0.4.md"
      - ".github/workflows/v104-cuda-fatbin-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-universal-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates git ninja-build python3 python3-pip \
            tar gzip file binutils
          python3 -m pip install --no-cache-dir "cmake==3.31.6"
          cmake --version
          /usr/local/cuda/bin/nvcc --version
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -E 'sm_(61|75|86|89|120)'

      - name: Configure universal CUDA build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "1.0.4"
          export CUDACXX=/usr/local/cuda/bin/nvcc
          cmake -S native -B build-v104-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=ON \
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON \
            -DPEPEPOW_CUDA_ARCHITECTURES="61-real;75-real;86-real;89-real;120" \
            -DPEPEPOW_CUDA_THREADS=768 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1

      - name: Build universal binary
        shell: bash
        run: |
          set -Eeuo pipefail
          cmake --build build-v104-cuda --parallel 4 --target \
            pepepowminer pepepow_core_tests pepepow_cuda_tests \
            pepepow_cuda_header80_validation pepepow_header80_benchmark
          ./build-v104-cuda/pepepowminer --version | tee binary-version.txt
          grep -F "PepeW Miner v1.0.4" binary-version.txt

      - name: Run hardware-independent tests
        shell: bash
        run: |
          set -Eeuo pipefail
          ctest --test-dir build-v104-cuda --output-on-failure -R '^pepepow_core_tests$'
          for script in hiveos/h-config.sh hiveos/h-run.sh hiveos/h-stats.sh; do
            bash -n "$script"
          done
          python3 -m py_compile hiveos/stratum-replay-proxy.py

      - name: Verify CUDA fat binary
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/local/cuda/bin/cuobjdump --list-elf build-v104-cuda/pepepowminer | tee fatbin-elf.txt
          /usr/local/cuda/bin/cuobjdump --list-ptx build-v104-cuda/pepepowminer | tee fatbin-ptx.txt
          for arch in sm_61 sm_75 sm_86 sm_89 sm_120; do
            grep -F "$arch" fatbin-elf.txt
            echo "FATBIN_CUBIN=${arch}:PASS"
          done
          grep -Eq 'compute_120|sm_120' fatbin-ptx.txt
          echo "FATBIN_PTX=compute_120:PASS"

      - name: Assemble HiveOS package
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION=1.0.4
          ROOT="PepeW-Miner-v${VERSION}-HiveOS"
          ASSET="${ROOT}-${VERSION}.tar.gz"
          STAGE="$PWD/dist-stage"
          PACKAGE="$STAGE/$ROOT"
          OUT="$PWD/dist"

          rm -rf "$STAGE" "$OUT"
          mkdir -p "$PACKAGE" "$OUT"

          install -m 0755 build-v104-cuda/pepepowminer "$PACKAGE/pepepowminer"
          install -m 0755 hiveos/h-config.sh "$PACKAGE/h-config.sh"
          install -m 0755 hiveos/h-run.sh "$PACKAGE/h-run.sh"
          install -m 0755 hiveos/h-stats.sh "$PACKAGE/h-stats.sh"
          install -m 0755 hiveos/stratum-replay-proxy.py "$PACKAGE/stratum-replay-proxy.py"
          install -m 0644 hiveos/h-manifest.conf "$PACKAGE/h-manifest.conf"
          install -m 0644 LICENSE "$PACKAGE/LICENSE"
          install -m 0644 README.md "$PACKAGE/README.md"
          install -m 0644 RELEASE_NOTES_v1.0.4.md "$PACKAGE/RELEASE_NOTES_v1.0.4.md"
          printf '%s\n' "$VERSION" > "$PACKAGE/VERSION"

          BINARY_SHA="$(sha256sum "$PACKAGE/pepepowminer" | awk '{print $1}')"
          printf '%s  pepepowminer\n' "$BINARY_SHA" > "$PACKAGE/pepepowminer.sha256"

          cat > "$PACKAGE/BUILD_PROFILE" <<PROFILE
          release=PepeW Miner v1.0.4
          source_commit=${GITHUB_SHA}
          build_type=Release
          cuda_toolkit=12.8.1
          cuda_architectures=61-real;75-real;86-real;89-real;120
          cuda_native=sm_61,sm_75,sm_86,sm_89,sm_120
          cuda_ptx=compute_120
          cuda_profile=service768
          multi_gpu=process-per-GPU
          binary_sha256=${BINARY_SHA}
          PROFILE

          cat > "$PACKAGE/RELEASE_MANIFEST.txt" <<MANIFEST
          PepeW Miner v1.0.4
          Package: ${ROOT}
          Asset: ${ASSET}
          Archive root: ${ROOT}/
          Install path: /hive/miners/custom/${ROOT}
          Algorithm: PEPEPOW HooHash V110
          CUDA native: sm_61; sm_75; sm_86; sm_89; sm_120
          CUDA PTX: compute_120
          Multi-GPU: one isolated miner and Stratum proxy process per selected NVIDIA GPU
          Binary SHA256: ${BINARY_SHA}
          MANIFEST

          (cd "$PACKAGE" && sha256sum -c pepepowminer.sha256)
          grep -Fqx "CUSTOM_NAME=$ROOT" "$PACKAGE/h-manifest.conf"
          grep -Fqx "CUSTOM_VERSION=$VERSION" "$PACKAGE/h-manifest.conf"

          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C "$STAGE" -cf - "$ROOT" | gzip -n > "$OUT/$ASSET"
          (cd "$OUT" && sha256sum "$ASSET" > "$ASSET.sha256")

          test "$(tar -tzf "$OUT/$ASSET" | sed -n '1p')" = "$ROOT/"
          tar -tzf "$OUT/$ASSET" | grep -Fqx "$ROOT/h-manifest.conf"
          echo "ARCHIVE=$OUT/$ASSET"
          echo "ARCHIVE_SHA256=$(sha256sum "$OUT/$ASSET" | awk '{print $1}')"
          echo "BINARY_SHA256=$BINARY_SHA"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: PepeW-Miner-v1.0.4-HiveOS-universal
          path: |
            dist/PepeW-Miner-v1.0.4-HiveOS-1.0.4.tar.gz
            dist/PepeW-Miner-v1.0.4-HiveOS-1.0.4.tar.gz.sha256
            binary-version.txt
            fatbin-elf.txt
            fatbin-ptx.txt
          if-no-files-found: error
          retention-days: 14
