name: V2.1 HotRun8 Nonlinear Census Package

on:
  push:
    branches:
      - agent/v21-v100-hotrun8-residual-profile
    paths:
      - '.github/workflows/v21-hotrun8-nonlinear-census-package.yml'
      - 'scripts/instrument_hotrun8_nonlinear_census.py'
      - 'scripts/fix_nonlinear_census_host_decode.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install hosted build tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ninja-build g++ git ca-certificates curl python3 xz-utils
          CMAKE_VER=3.31.8
          curl -fL --retry 3 --retry-delay 2 "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz" -o /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          ln -sf /opt/cmake/bin/cmake /usr/local/bin/cmake

      - name: Instrument exact nonlinear census
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/instrument_hotrun8_nonlinear_census.py
          python3 scripts/fix_nonlinear_census_host_decode.py
          grep -n 'g_nlc_calls' native/src/cuda/v1/header80_hotrun8.inc
          grep -n 'g_nlc_samples' native/src/cuda/v1/header80_backend_part07.inc
          grep -n 'nlc_host_signed_from_ordered' native/src/cuda/v1/header80_backend_part07.inc

      - name: Build, consensus and static resource gate
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B /tmp/nlc -G Ninja \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=ON \
            -DPEPEPOW_CUDA_ARCHITECTURES=70-real \
            -DPEPEPOW_CUDA_THREADS=704 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            -DPEPEPOW_CUDA_SCALED_MATRIX=OFF \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON \
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON \
            -DPEPEPOW_CUDA_SW_STATE_MODE=3 \
            -DPEPEPOW_CUDA_BYTE_UNROLL=1 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=ON \
            -DPEPEPOW_CUDA_HOTRUN8=ON \
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            '-DCMAKE_CUDA_FLAGS=-DPEPEPOW_CUDA_HOTRUN8_FUSION_MODE=0 -DPEPEPOW_CUDA_NONLINEAR_CENSUS=1'
          cmake --build /tmp/nlc --target pepepow_header80_benchmark pepepow_core_tests -j2 2>&1 | tee /tmp/nlc-build.log
          /tmp/nlc/pepepow_core_tests | tee /tmp/nlc-core-tests.log
          if grep -Eq '[1-9][0-9]* bytes spill stores|[1-9][0-9]* bytes spill loads' /tmp/nlc-build.log; then
            echo 'ERROR: nonlinear census contains CUDA spills on sm_70'
            exit 1
          fi
          grep -A2 -F 'hoohash_mix_hotrun8_split_kernel' /tmp/nlc-build.log | tail -3 | tee /tmp/nlc-resource.txt
          mkdir -p /tmp/nlcpkg
          cp /tmp/nlc/pepepow_header80_benchmark /tmp/nlcpkg/pepepow_header80_benchmark_hotrun8_nonlinear_census
          cp /tmp/nlc-build.log /tmp/nlcpkg/nonlinear-census-build.log
          cp /tmp/nlc-core-tests.log /tmp/nlcpkg/core-tests.log
          cp /tmp/nlc-resource.txt /tmp/nlcpkg/resource.txt
          cat > /tmp/nlcpkg/build-info.txt <<EOF
          source_branch=agent/v21-v100-hotrun8-residual-profile
          source_commit=${GITHUB_SHA}
          cuda_toolkit=12.8.1
          cuda_arch=sm_70
          architecture=hotrun8-nonlinear-census
          sample_predicate=first_pass0_low12_zero
          sample_rate_nominal=1/4096
          measures=selector-branch-frequency-and-argument-ranges
          exact_path=true
          candidate_spills=0
          pool_submission=false
          EOF
          tar -C /tmp/nlcpkg -czf /tmp/PepeW-v2.1-HotRun8-NonlinearCensus-V100.tar.gz .
          sha256sum /tmp/PepeW-v2.1-HotRun8-NonlinearCensus-V100.tar.gz | tee /tmp/PepeW-v2.1-HotRun8-NonlinearCensus-V100.tar.gz.sha256

      - name: Publish immutable diagnostic prerelease and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: PepeW-v2.1-HotRun8-NonlinearCensus-V100.tar.gz
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          tag="v2.1-hotrun8-nonlinear-census-${short}-v100"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28')
          release_json="$(curl -fsSL "${auth[@]}" "${api}/releases/tags/${tag}" 2>/dev/null || true)"
          if [[ -z "$release_json" ]]; then
            payload="$(python3 - "$tag" "$GITHUB_SHA" <<'PY'
import json,sys
print(json.dumps({
    "tag_name": sys.argv[1],
    "target_commitish": sys.argv[2],
    "name": "PepeW v2.1 HotRun8 Nonlinear Census V100",
    "prerelease": True
}))
PY
)"
            release_json="$(curl -fsSL -X POST "${auth[@]}" -H 'Content-Type: application/json' "${api}/releases" -d "$payload")"
          fi
          rid="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$release_json")"
          assets="$(curl -fsSL "${auth[@]}" "${api}/releases/${rid}/assets")"
          for file in "$ASSET" "$ASSET.sha256"; do
            aid="$(python3 -c 'import json,sys; n=sys.argv[1]; print(next((x["id"] for x in json.load(sys.stdin) if x["name"]==n),""))' "$file" <<<"$assets")"
            [[ -z "$aid" ]] || curl -fsSL -X DELETE "${auth[@]}" "${api}/releases/assets/${aid}" >/dev/null
            mime=application/octet-stream
            [[ "$file" == *.sha256 ]] && mime=text/plain
            curl -fsSL -X POST "${auth[@]}" -H "Content-Type: ${mime}" --data-binary "@/tmp/${file}"               "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${rid}/assets?name=${file}" >/dev/null
          done
          asset_sha="$(sha256sum "/tmp/${ASSET}" | awk '{print $1}')"
          mkdir -p results
          python3 - "$tag" "$asset_sha" "$GITHUB_SHA" "$ASSET" <<'PY'
import json,sys
from pathlib import Path
tag,asset_sha,source_sha,asset=sys.argv[1:5]
data={
    "status":"HOSTED_PACKAGE_PASS",
    "label":"hotrun8-nonlinear-census",
    "tag":tag,
    "asset_name":asset,
    "asset_url":f"https://github.com/iPepew/PepePow_Miner/releases/download/{tag}/{asset}",
    "asset_sha256":asset_sha,
    "source_commit":source_sha,
    "cuda_arch":"sm_70",
    "zero_spills":True,
    "core_correctness":True,
    "pool_submission":False
}
Path("results/nonlinear-census-latest.json").write_text(json.dumps(data,indent=2)+"\n")
PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add results/nonlinear-census-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "results: publish nonlinear census diagnostic manifest"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "asset=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${ASSET}"

      - name: Upload hosted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotrun8-nonlinear-census-build-${{ github.sha }}
          path: |
            /tmp/nlc-build.log
            /tmp/nlc-core-tests.log
            /tmp/nlc-resource.txt
            /tmp/PepeW-v2.1-HotRun8-NonlinearCensus-V100.tar.gz
            /tmp/PepeW-v2.1-HotRun8-NonlinearCensus-V100.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 30
