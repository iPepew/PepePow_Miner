name: v1.0.5 bootstrap

on:
  push:
    branches:
      - release/v1.0.5
    paths:
      - "tools/.v105-bootstrap-payload/**"
      - ".github/workflows/v105-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.5
      - name: Reconstruct and apply v1.0.5 source bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          cat tools/.v105-bootstrap-payload/part* | base64 -d | gzip -d > /tmp/apply-v105-bootstrap.py
          python3 /tmp/apply-v105-bootstrap.py
          rm -rf tools/.v105-bootstrap-payload
          rm -f .github/workflows/v105-bootstrap.yml
      - name: Commit generated source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'iPepew'
          git config user.email 'fima7385@mail.ru'
          git add -A
          git diff --cached --check
          git commit -m 'feat: bootstrap PepeW Miner v1.0.5 development'
          git push origin HEAD:release/v1.0.5
