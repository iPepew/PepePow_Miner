name: Temporary candidate package transport 20261011
on:
  push:
    branches: [agent/demand-sliced-batch-correctness-20260917]
    paths: [.github/workflows/temporary-candidate-transport-20261011.yml]
  workflow_dispatch:
    inputs:
      session_deadline_utc:
        description: Absolute authorized session end YYYY-MM-DDTHH:MM:SSZ
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: pepew-candidate-transport
  cancel-in-progress: false
jobs:
  transport:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ secrets.PEPEW_RELEASE_TRANSPORT_TOKEN || github.token }}
      TRANSPORT_TOKEN_CONFIGURED: ${{ secrets.PEPEW_RELEASE_TRANSPORT_TOKEN != '' }}
      EXPECTED_SOURCE: 3b545269cbdf6a9bbb9de37e43b96cb61077dc44
      GH_REPO: iPepew/PepePow_Miner
      SESSION_DEADLINE_UTC: 2026-10-13T08:57:50Z
      TAG: temporary-warm2-3b54526-20261013
    steps:
      - name: Absolute deadline gate
        shell: bash
        run: |
          set -Eeuo pipefail
          remaining=$(( $(date -u -d "$SESSION_DEADLINE_UTC" +%s) - $(date -u +%s) ))
          test "$remaining" -ge 660
          test "$remaining" -le 3600
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only release permission admission before artifact or release
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout -k 2s 20s python3 -m unittest discover -s tests -p test_release_transport_preflight.py -v
          token_class=github_token
          if [ "$TRANSPORT_TOKEN_CONFIGURED" = true ]; then token_class=configured_transport_token; fi
          timeout -k 2s 90s python3 scripts/ci/release_transport_preflight.py --repository "$GH_REPO" --target "$EXPECTED_SOURCE" --token-class "$token_class"
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with:
          github-token: ${{ github.token }}
          run-id: 38322533285
          artifact-ids: 11779009165
          merge-multiple: true
          path: candidate
      - name: Verify and temporarily expose only exact public-source binary package
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          mapfile -t files < <(find candidate -name PepeW-Miner-current-source-V100.tar.gz -type f)
          test "${#files[@]}" -eq 1
          test "$(sha256sum "${files[0]}" | cut -d' ' -f1)" = 53a8ed3d5093d7579065756faab7f775048b7ad5d523f86cc5c311bd9e8b632d
          cleanup() {
            timeout -k 2s 30s gh release delete "$TAG" --yes --cleanup-tag
          }
          trap cleanup EXIT
          timeout -k 2s 60s gh release create "$TAG" "${files[0]}#candidate.tar.gz" --target "$EXPECTED_SOURCE" --prerelease --latest=false --title "Temporary offline candidate transport - not a release" --notes "Exact CUDA Event diagnostic package for bounded offline V100 timing. No promotion or performance claim. Automatically removed after transport window."
          echo EXACT_PACKAGE_TRANSPORT_READY
          sleep 180
          cleanup
          trap - EXIT
          echo TEMPORARY_TRANSPORT_REMOVED
      - name: Ensure temporary transport cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if timeout -k 2s 15s gh release view "$TAG" >/dev/null 2>&1; then
            timeout -k 2s 30s gh release delete "$TAG" --yes --cleanup-tag
          fi
