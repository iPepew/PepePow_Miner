name: Temporary candidate package transport 20261011
on:
  workflow_dispatch:
  push:
    branches: [agent/demand-sliced-batch-correctness-20260917]
    paths: [.github/workflows/temporary-candidate-transport-20261011.yml]
permissions:
  actions: read
  contents: write
concurrency:
  group: pepew-candidate-transport
  cancel-in-progress: false
jobs:
  transport:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: iPepew/PepePow_Miner
      SESSION_DEADLINE_UTC: '2026-10-12T15:50:24Z'
      TAG: temporary-reconv-6998273-20261012
    steps:
      - name: Absolute deadline gate
        shell: bash
        run: |
          set -Eeuo pipefail
          remaining=$(( $(date -u -d "$SESSION_DEADLINE_UTC" +%s) - $(date -u +%s) ))
          test "$remaining" -ge 660
          test "$remaining" -le 3600
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with:
          github-token: ${{ github.token }}
          run-id: 38271073899
          artifact-ids: 11757241914
          merge-multiple: true
          path: candidate
      - name: Verify and temporarily expose only exact public-source binary package
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          mapfile -t files < <(find candidate -name PepeW-Miner-current-source-V100.tar.gz -type f)
          test "${#files[@]}" -eq 1
          test "$(sha256sum "${files[0]}" | cut -d' ' -f1)" = 98e63d4b75dda951b0591346954cc43eab569e7b02d96b191cac15164fe6a713
          cleanup() {
            timeout -k 2s 30s gh release delete "$TAG" --yes --cleanup-tag
          }
          trap cleanup EXIT
          timeout -k 2s 60s gh release create "$TAG" "${files[0]}#candidate.tar.gz" --target "$GITHUB_SHA" --prerelease --latest=false --title "Temporary offline candidate transport - not a release" --notes "Exact CUDA Event diagnostic package for bounded offline V100 timing. No promotion or performance claim. Automatically removed after transport window."
          echo EXACT_PACKAGE_TRANSPORT_READY
          sleep 180
          cleanup
          trap - EXIT
          echo TEMPORARY_TRANSPORT_REMOVED
      - name: Ensure temporary transport cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if timeout -k 2s 15s gh release view "$TAG" >/dev/null 2>&1; then
            timeout -k 2s 30s gh release delete "$TAG" --yes --cleanup-tag
          fi
