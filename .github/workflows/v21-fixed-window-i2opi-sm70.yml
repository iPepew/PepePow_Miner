name: V2 Exact Shifted53 Comba I2OPI SM70 Codegen

on:
  push:
    branches:
      - agent/fixed-window-codegen-v1
    paths:
      - native/tests/shifted53_comba_i2opi_codegen_probe.cu
      - .github/workflows/v21-fixed-window-i2opi-sm70.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codegen:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Python for deterministic replay
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3

      - name: Prove exact shifted53 Comba product on one million vectors
        shell: bash
        run: |
          python3 - <<'PY'
          import random
          C = (
              0xdb6295993c439041
              | (0xfc2757d1f534ddc0 << 64)
              | (0xa2f9836e4e441529 << 128)
          )
          mask = (1 << 64) - 1
          cs = [(C >> (64*i)) & mask for i in range(3)]
          rng = random.Random(0x53484946543533)
          cases = [1 << 52, (1 << 53) - 1]
          cases.extend(rng.randrange(1 << 52, 1 << 53) for _ in range(999_998))
          for n in cases:
              qs = [n*c for c in cs]
              qlo = [q & mask for q in qs]
              qhi = [q >> 64 for q in qs]
              p0 = qlo[0]
              s1 = qhi[0] + qlo[1]
              p1, carry1 = s1 & mask, s1 >> 64
              s2 = qhi[1] + qlo[2] + carry1
              p2, carry2 = s2 & mask, s2 >> 64
              p3 = qhi[2] + carry2
              words = [
                  (p0 << 11) & mask,
                  ((p1 << 11) | (p0 >> 53)) & mask,
                  ((p2 << 11) | (p1 >> 53)) & mask,
                  ((p3 << 11) | (p2 >> 53)) & mask,
              ]
              got = sum(w << (64*i) for i, w in enumerate(words))
              if got != (n * C) << 11:
                  raise SystemExit("EXACT_MISMATCH")
          print("EXACT_REPLAY cases=1000000 mismatches=0")
          PY

      - name: Compile and measure Volta SASS
        shell: bash
        run: |
          set -euo pipefail
          /usr/local/cuda/bin/nvcc -std=c++17 -O3 -arch=sm_70 -lineinfo \
            -Xptxas=-v -cubin native/tests/shifted53_comba_i2opi_codegen_probe.cu \
            -o /tmp/shifted53.cubin 2>&1 | tee /tmp/ptxas.log
          /usr/local/cuda/bin/cuobjdump --dump-sass /tmp/shifted53.cubin > /tmp/sass.txt 2>&1
          grep -E 'Function|shifted53' /tmp/sass.txt || true
          python3 - <<'PY'
          import json, re
          text = open('/tmp/sass.txt').read().splitlines()
          sections = {}
          current = None
          wanted = {'shifted53_probe', 'shifted53_empty'}
          for line in text:
              if 'Function :' in line:
                  name = line.split('Function :', 1)[1].strip()
                  current = name if name in wanted else None
                  if current:
                      sections[current] = []
                  continue
              if current and '/*' in line and '*/' in line and ';' in line:
                  tail = line.split('*/', 1)[1].strip()
                  if tail:
                      sections[current].append(tail.split()[0])
          def counted(name):
              return [op for op in sections.get(name, []) if op not in {'RET', 'NOP'}]
          candidate_ops = counted('shifted53_probe')
          envelope_ops = counted('shifted53_empty')
          local_ops = sum(op.startswith('LDL') or op.startswith('STL') for op in candidate_ops)
          candidate_total = len(candidate_ops)
          envelope_total = len(envelope_ops)
          arithmetic = candidate_total - envelope_total
          log = open('/tmp/ptxas.log').read()
          regs = [int(x) for x in re.findall(r'Used (\d+) registers', log)]
          spills = sum(int(x) for x in re.findall(r'(\d+) bytes spill (?:stores|loads)', log))
          result = {
              'exact_vectors': 1000000,
              'mismatches': 0,
              'sm': 70,
              'candidate_kernel_instructions_excluding_ret_nop': candidate_total,
              'empty_envelope_instructions_excluding_ret_nop': envelope_total,
              'arithmetic_core_instruction_delta': arithmetic,
              'local_staging_instructions': local_ops,
              'max_reported_registers': max(regs) if regs else None,
              'spill_bytes_total': spills,
          }
          result['admitted'] = (
              arithmetic <= 42 and local_ops == 0 and
              (result['max_reported_registers'] or 999) <= 56 and spills == 0
          )
          print('SHIFTED53_RESULT ' + json.dumps(result, sort_keys=True))
          open('/tmp/result.json','w').write(json.dumps(result, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload codegen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shifted53-comba-i2opi-sm70-${{ github.sha }}
          path: |
            /tmp/ptxas.log
            /tmp/sass.txt
            /tmp/result.json
          if-no-files-found: warn
          retention-days: 30
