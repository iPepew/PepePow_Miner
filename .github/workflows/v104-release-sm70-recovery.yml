name: v1.0.4 V100 sm70 t384 performance candidate

on:
  push:
    branches:
      - perf/v104-sm70-t384
    paths:
      - "native/**"
      - "hiveos/**"
      - "VERSION"
      - ".github/workflows/v104-release-sm70-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-sm70-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    env:
      RELEASE_TAG: hiveos-v100-v104-sm70-t384-test
      ROOT: PepeW-Miner
      ASSET: PepeW-Miner-HiveOS.tar.gz

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates git ninja-build python3 python3-pip \
            tar gzip file binutils gh
          python3 -m pip install --no-cache-dir "cmake==3.31.6"
          rm -rf /var/lib/apt/lists/*
          /usr/local/cuda/bin/nvcc --version
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70

      - name: Configure exact v1.0.4 behavior for sm70 t384
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "1.0.4"
          export CUDACXX=/usr/local/cuda/bin/nvcc
          cmake -S native -B build-v104-sm70 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=ON \
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON \
            -DPEPEPOW_CUDA_ARCHITECTURES="70-real" \
            -DPEPEPOW_CUDA_THREADS=384 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1

      - name: Build
        run: |
          set -Eeuo pipefail
          cmake --build build-v104-sm70 --parallel 4 --target \
            pepepowminer pepepow_core_tests pepepow_cuda_tests \
            pepepow_cuda_header80_validation pepepow_header80_benchmark 2>&1 | tee /tmp/v104-sm70-build.log
          ./build-v104-sm70/pepepowminer --version | tee /tmp/v104-sm70-version.txt
          grep -F "1.0.4" /tmp/v104-sm70-version.txt
          grep -F "build=Release" /tmp/v104-sm70-version.txt

      - name: Verify sm70 CUDA image and release semantics
        run: |
          set -Eeuo pipefail
          /usr/local/cuda/bin/cuobjdump --list-elf build-v104-sm70/pepepowminer | tee /tmp/v104-sm70-elf.txt
          /usr/local/cuda/bin/cuobjdump --list-ptx build-v104-sm70/pepepowminer | tee /tmp/v104-sm70-ptx.txt
          grep -F sm_70 /tmp/v104-sm70-elf.txt
          ! grep -Eq 'sm_(61|75|86|89|120)' /tmp/v104-sm70-elf.txt
          strings -a build-v104-sm70/pepepowminer | grep -F 'POOL_REFERENCE hoohash=V110 matrix_seed=BLAKE3_MASKED_HEADER header_nonce=BE32 mix_nonce=LE32 submit_nonce=LE_HEX share_target=NBITS_DIV_DIFFICULTY' | tee /tmp/v104-sm70-contract.txt
          strings -a build-v104-sm70/pepepowminer | grep -F 'PepePowMiner/0.2.0-dev' | tee -a /tmp/v104-sm70-contract.txt
          strings -a build-v104-sm70/pepepowminer | grep -F 'cuda-header80-monolithic-pipeline' | tee -a /tmp/v104-sm70-contract.txt
          ctest --test-dir build-v104-sm70 --output-on-failure -R '^pepepow_core_tests$'
          for script in hiveos/h-config.sh hiveos/h-run.sh hiveos/h-stats.sh; do bash -n "$script"; done

      - name: Assemble isolated HiveOS package
        run: |
          set -Eeuo pipefail
          rm -rf dist stage
          mkdir -p "stage/${ROOT}" dist
          install -m 0755 build-v104-sm70/pepepowminer "stage/${ROOT}/pepepowminer"
          install -m 0755 hiveos/h-config.sh "stage/${ROOT}/h-config.sh"
          install -m 0755 hiveos/h-run.sh "stage/${ROOT}/h-run.sh"
          install -m 0755 hiveos/h-stats.sh "stage/${ROOT}/h-stats.sh"
          install -m 0755 hiveos/stratum-replay-proxy.py "stage/${ROOT}/stratum-replay-proxy.py"
          install -m 0644 hiveos/h-manifest.conf "stage/${ROOT}/h-manifest.conf"
          sed -i "s/^CUSTOM_NAME=.*/CUSTOM_NAME=PepeW-Miner/" "stage/${ROOT}/h-manifest.conf"
          sed -i "s/^CUSTOM_VERSION=.*/CUSTOM_VERSION=1.0.4-sm70-t384/" "stage/${ROOT}/h-manifest.conf"
          cat > "stage/${ROOT}/BUILD_INFO.txt" <<EOF
          version=1.0.4-sm70-t384
          source_branch=release/v1.0.4 behavioral source
          performance_branch=${GITHUB_REF_NAME}
          source_commit=${GITHUB_SHA}
          cuda_toolkit=12.8.1
          cuda_architectures=70-real
          cuda_native=sm_70
          cuda_profile=service384
          cuda_threads=384
          semantics=exact-release-v1.0.4-source
          pool_reference=NBITS_DIV_DIFFICULTY
          header_nonce=BE32
          mix_nonce=LE32
          submit_nonce=LE_HEX
          matrix_seed=BLAKE3_MASKED_HEADER
          promotion=forbidden-until-real-accepted-shares
          EOF
          sha256sum "stage/${ROOT}/pepepowminer" | tee "stage/${ROOT}/pepepowminer.sha256"
          tar --sort=name --owner=0 --group=0 --numeric-owner -C stage -cf - "${ROOT}" | gzip -n > "dist/${ASSET}"
          sha256sum "dist/${ASSET}" > "dist/${ASSET}.sha256"

      - name: Publish isolated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          notes='Exact working v1.0.4 V100 correctness baseline with CUDA block geometry changed only from service768 to service384. Pool/consensus semantics unchanged. Must produce real accepted shares before any promotion.'
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/${ASSET}" "dist/${ASSET}.sha256" --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" "dist/${ASSET}" "dist/${ASSET}.sha256" --repo "$GH_REPO" --title "PepeW v1.0.4 V100 sm70 service384 candidate" --notes "$notes" --prerelease
          fi
          echo "candidate=https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET}"

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: v104-sm70-t384-${{ github.sha }}
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET }}.sha256
            /tmp/v104-sm70-build.log
            /tmp/v104-sm70-version.txt
            /tmp/v104-sm70-elf.txt
            /tmp/v104-sm70-ptx.txt
            /tmp/v104-sm70-contract.txt
          retention-days: 30
