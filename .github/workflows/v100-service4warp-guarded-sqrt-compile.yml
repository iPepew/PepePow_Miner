# Production guarded-sqrt architecture gate; no V100 hardware is used here.
# Retriggered after an inconsistent queued/failed Actions state on 2026-08-26.
name: V100 Service4Warp Guarded Sqrt Compile Gate

on:
  push:
    branches:
      - agent/v21-v100-service4warp-guarded-sqrt
      - agent/v21-v100-service4warp-guarded-sqrt-row
      - agent/v21-v100-service4warp-guarded-sqrt-production
    paths:
      - analysis/guarded_sqrt_bound.py
      - native/src/cuda/guarded_sqrt_primitives.cuh
      - native/tests/service4warp_guarded_sqrt_compile_probe.cu
      - native/tests/service4warp_guarded_sqrt_row_compile_probe.cu
      - native/tests/service4warp_guarded_sqrt_production_compile.cu
      - .github/workflows/v100-service4warp-guarded-sqrt-compile.yml
  workflow_dispatch:

jobs:
  proof-and-compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install proof runtime
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3
          python3 --version
      - name: Run exponent-bound proof
        shell: bash
        run: python3 analysis/guarded_sqrt_bound.py
      - name: Compile guarded sqrt service-worker probe for Volta
        shell: bash
        run: |
          set -euo pipefail
          /usr/local/cuda/bin/nvcc -std=c++17 -O3 -arch=sm_70 -lineinfo \
            -Xptxas=-v \
            -c native/tests/service4warp_guarded_sqrt_compile_probe.cu \
            -o /tmp/service4warp_guarded_sqrt.o 2>&1 | tee /tmp/ptxas-guarded-sqrt.log
          test -s /tmp/service4warp_guarded_sqrt.o
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' /tmp/ptxas-guarded-sqrt.log
      - name: Compile guarded sqrt row-state probe for Volta
        shell: bash
        run: |
          set -euo pipefail
          /usr/local/cuda/bin/nvcc -std=c++17 -O3 -arch=sm_70 -lineinfo \
            -Xptxas=-v \
            -c native/tests/service4warp_guarded_sqrt_row_compile_probe.cu \
            -o /tmp/service4warp_guarded_sqrt_row.o 2>&1 | tee /tmp/ptxas-guarded-sqrt-row.log
          test -s /tmp/service4warp_guarded_sqrt_row.o
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' /tmp/ptxas-guarded-sqrt-row.log
      - name: Compile production-shaped guarded sqrt Header80 kernel for Volta
        shell: bash
        run: |
          set -euo pipefail
          /usr/local/cuda/bin/nvcc -std=c++20 -O3 -arch=sm_70 -lineinfo \
            -I native/include \
            -DPEPEPOW_CUDA_THREADS=704 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=0 \
            -DPEPEPOW_CUDA_SCALED_MATRIX=0 \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=1 \
            -DPEPEPOW_CUDA_ASSUME_FINITE=1 \
            -DPEPEPOW_CUDA_SW_STATE_MODE=3 \
            -Xptxas=-v \
            -c native/tests/service4warp_guarded_sqrt_production_compile.cu \
            -o /tmp/service4warp_guarded_sqrt_production.o 2>&1 | tee /tmp/ptxas-guarded-sqrt-production.log
          test -s /tmp/service4warp_guarded_sqrt_production.o
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' /tmp/ptxas-guarded-sqrt-production.log
          grep -F 'header80_pow_service4warp_guarded_sqrt_kernel' /tmp/ptxas-guarded-sqrt-production.log || true
      - name: Upload resource logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service4warp-guarded-sqrt-sm70-${{ github.sha }}
          path: |
            /tmp/ptxas-guarded-sqrt.log
            /tmp/ptxas-guarded-sqrt-row.log
            /tmp/ptxas-guarded-sqrt-production.log
          if-no-files-found: warn
          retention-days: 30
