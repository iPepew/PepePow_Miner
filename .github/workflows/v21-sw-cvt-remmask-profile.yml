name: V2.1 SW CVT Remainder Predicate Static Profile

on:
  push:
    branches: [agent/v21-v100-sw-cvt-remmask-profile]
    paths: ['.github/workflows/v21-sw-cvt-remmask-profile.yml']
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl g++ git ninja-build python3 xz-utils
          CMAKE_VER=3.31.8
          curl -fL --retry 3 "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz" -o /tmp/cmake.tgz
          mkdir -p /opt/cmake && tar -xzf /tmp/cmake.tgz -C /opt/cmake --strip-components=1
          ln -sf /opt/cmake/bin/cmake /usr/local/bin/cmake
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70
      - name: Prepare common configuration
        run: |
          cat >/tmp/config.sh <<'EOF'
          configure() {
            cmake -S native -B "$1" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
              -DPEPEPOW_ENABLE_CUDA=ON -DPEPEPOW_BUILD_TESTS=OFF -DPEPEPOW_CUDA_ARCHITECTURES=70-real \
              -DPEPEPOW_CUDA_THREADS=704 -DPEPEPOW_CUDA_MIN_BLOCKS=1 -DPEPEPOW_CUDA_SPLIT_PIPELINE=ON \
              -DPEPEPOW_CUDA_HOTRUN8=ON -DPEPEPOW_CUDA_SCALED_MATRIX=OFF -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON \
              -DPEPEPOW_CUDA_ASSUME_FINITE=ON -DPEPEPOW_CUDA_SW_STATE_MODE=3 -DPEPEPOW_CUDA_BYTE_UNROLL=1 \
              -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON '-DCMAKE_CUDA_FLAGS=-DPEPEPOW_CUDA_HOTRUN8_FUSION_MODE=2'
          }
          EOF
      - name: Build current pool-confirmed SW CVT predicate
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/src/cuda/v1/header80_backend_part02.inc'); s=p.read_text()
          old='''__device__ __forceinline__ void update_sw_state(\n    HooHashSwState& state, double sum) {\n    state = positive_fraction_div1024_le_002_finite(sum);\n}\n#endif'''
          new='''__device__ __forceinline__ void update_sw_state(\n    HooHashSwState& state, double sum) {\n    const double scaled = sum * 0x1.0p-10;\n    const unsigned long long whole = __double2ull_rd(scaled);\n    state = (scaled - static_cast<double>(whole)) <= 0.02;\n}\n#endif'''
          if s.count(old)!=1: raise SystemExit(f'marker count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          source /tmp/config.sh; configure /tmp/cvt
          cmake --build /tmp/cvt --target pepepow_header80_benchmark pepepow_header80_differential -j2 2>&1 | tee /tmp/cvt.log
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' /tmp/cvt.log
          /usr/local/cuda/bin/cuobjdump --dump-sass /tmp/cvt/pepepow_header80_benchmark >/tmp/cvt.sass
          git checkout -- native/src/cuda/v1/header80_backend_part02.inc
      - name: Build exact remainder-mask candidate
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/src/cuda/v1/header80_backend_part02.inc'); s=p.read_text()
          old='''__device__ __forceinline__ void update_sw_state(\n    HooHashSwState& state, double sum) {\n    state = positive_fraction_div1024_le_002_finite(sum);\n}\n#endif'''
          new='''__device__ __forceinline__ void update_sw_state(\n    HooHashSwState& state, double sum) {\n    // Exact for reachable positive finite row sums (<2^53).\n    // frac(sum/1024)<=0.02 iff low10(floor(sum))+frac(sum)<=20.48.\n    const unsigned long long whole = __double2ull_rd(sum);\n    const unsigned int rem = static_cast<unsigned int>(whole) & 1023U;\n    const double frac = sum - static_cast<double>(whole);\n    state = (rem < 20U) || (rem == 20U && frac <= 0.48);\n}\n#endif'''
          if s.count(old)!=1: raise SystemExit(f'marker count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          source /tmp/config.sh; configure /tmp/remmask
          cmake --build /tmp/remmask --target pepepow_header80_benchmark pepepow_header80_differential -j2 2>&1 | tee /tmp/remmask.log
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' /tmp/remmask.log
          /usr/local/cuda/bin/cuobjdump --dump-sass /tmp/remmask/pepepow_header80_benchmark >/tmp/remmask.sass
      - name: Static census and package
        run: |
          set -Eeuo pipefail
          cvt_inst=$(grep -Ec '^\s*/\*[0-9a-f]+\*/' /tmp/cvt.sass || true)
          rem_inst=$(grep -Ec '^\s*/\*[0-9a-f]+\*/' /tmp/remmask.sass || true)
          echo "cvt_total_sass_instructions=$cvt_inst" | tee /tmp/profile.txt
          echo "remmask_total_sass_instructions=$rem_inst" | tee -a /tmp/profile.txt
          echo "instruction_delta=$((rem_inst-cvt_inst))" | tee -a /tmp/profile.txt
          echo '--- CVT resources ---' >>/tmp/profile.txt; grep -E 'Function properties|bytes stack frame|bytes spill|registers|barrier' /tmp/cvt.log >>/tmp/profile.txt || true
          echo '--- REMMASK resources ---' >>/tmp/profile.txt; grep -E 'Function properties|bytes stack frame|bytes spill|registers|barrier' /tmp/remmask.log >>/tmp/profile.txt || true
          mkdir -p /tmp/pkg
          cp /tmp/cvt/pepepow_header80_benchmark /tmp/pkg/pepepow_header80_benchmark_cvt
          cp /tmp/remmask/pepepow_header80_benchmark /tmp/pkg/pepepow_header80_benchmark_remmask
          cp /tmp/remmask/pepepow_header80_differential /tmp/pkg/pepepow_header80_differential_remmask
          cp /tmp/profile.txt /tmp/pkg/profile.txt
          cp /tmp/cvt.log /tmp/remmask.log /tmp/pkg/
          tar -C /tmp/pkg -czf /tmp/PepeW-v2.1-SW-CVT-RemMask-Profile.tar.gz .
          sha256sum /tmp/PepeW-v2.1-SW-CVT-RemMask-Profile.tar.gz >/tmp/profile.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sw-cvt-remmask-profile-${{ github.sha }}
          path: |
            /tmp/profile.txt
            /tmp/profile.sha256
            /tmp/PepeW-v2.1-SW-CVT-RemMask-Profile.tar.gz
            /tmp/cvt.log
            /tmp/remmask.log
          retention-days: 30
