name: Warm4 compile-only SASS audit 20261013
on:
  workflow_dispatch:
  push:
    branches: [agent/demand-sliced-batch-correctness-20260917]
    paths: [.github/workflows/cold-reconvergence-package-20261012.yml]
permissions:
  contents: read
concurrency:
  group: pepew-cold-call-reconvergence-package
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    env:
      EXPECTED_SOURCE: 2cdc7804dad1254ffc33764bb279ea1e015904c9
      SESSION_DEADLINE_UTC: 2026-10-13T08:57:50Z
      COMPILE_AUDIT_ONLY: 'true'
      PEPEPOW_TCP_NODELAY: '1'
      ROOT: PepeW-Miner
      ASSET: PepeW-Miner-current-source-V100.tar.gz
    steps:
      - name: Reject late start
        run: |
          set -Eeuo pipefail
          [[ "$SESSION_DEADLINE_UTC" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          deadline_epoch="$(date -u -d "$SESSION_DEADLINE_UTC" +%s)"
          now_epoch="$(date -u +%s)"
          remaining="$((deadline_epoch - now_epoch))"
          # 8-minute job timeout plus 5-minute cleanup margin; no queue-relative extension.
          test "$remaining" -ge 780
          test "$remaining" -le 3600
          printf 'session_deadline_utc=%s\n' "$SESSION_DEADLINE_UTC"
      - name: Install bounded build tools
        run: |
          set -Eeuo pipefail
          timeout -k 15s 300s bash -c 'rm -f /etc/apt/sources.list.d/cuda*.list /etc/apt/sources.list.d/nvidia*.list && apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates git ninja-build python3 python3-pip tar gzip file binutils'
          timeout -k 10s 180s python3 -m pip install --no-cache-dir "cmake==3.31.10"
          rm -rf /var/lib/apt/lists/*
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70
      - name: Checkout immutable production source
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ env.EXPECTED_SOURCE }}
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: true
      - name: Verify immutable source
        run: |
          set -Eeuo pipefail
          # Trust only this ephemeral checkout, never a wildcard.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          test "$source_date_epoch" -gt 0
          git ls-files -z | xargs -0r touch --date="@$source_date_epoch"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain)"
          printf 'workflow_commit=%s\nsource_commit=%s\n' "$GITHUB_SHA" "$EXPECTED_SOURCE" | tee /tmp/source.env
      - name: Validate wrapper and configure current source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(tr -d '\r\n' < VERSION)" = "2.1-beta.1"
          grep -F 'CUSTOM_VERSION="v2.1 BETA"' hiveos/h-manifest.conf
          bash -n hiveos/h-config.sh
          bash -n hiveos/h-run.sh
          bash -n hiveos/h-stats.sh
          timeout -k 5s 60s python3 -m unittest discover -s tests -p 'test_hiveos_evidence_config.py' -v
          export CUDACXX=/usr/local/cuda/bin/nvcc
          timeout -k 15s 300s cmake -S native -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=ON \
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON \
            -DPEPEPOW_CUDA_STAGE_TIMING=OFF \
            -DPEPEPOW_CUDA_SUBSTAGE_TIMING=OFF \
            -DPEPEPOW_CUDA_FIRST_PASS_LOCAL_CACHE=OFF \
            -DPEPEPOW_CUDA_NONLINEAR_CENSUS=OFF \
            -DPEPEPOW_CUDA_COLD_RECONVERGENCE=ON \
            -DPEPEPOW_CUDA_ARCHITECTURES=70-real \
            -DPEPEPOW_CUDA_THREADS=128 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=ON \
            -DPEPEPOW_CUDA_HOTRUN8=ON \
            -DPEPEPOW_CUDA_SCALED_MATRIX=OFF \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON \
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON \
            -DPEPEPOW_CUDA_SW_STATE_MODE=3 \
            -DPEPEPOW_CUDA_BYTE_UNROLL=1 \
            -DPEPEPOW_CUDA_DEMAND_SLICED_REDUCER=ON \
            '-DCMAKE_CUDA_FLAGS=-DPEPEPOW_CUDA_HOTRUN8_FUSION_MODE=2 -DPEPEPOW_CUDA_COLD_OUTLINE=1 -DPEPEPOW_CUDA_HOTRUN8_WORD_STREAM=1 -DPEPEPOW_CUDA_LOCAL_RESIDENCY=1 -DPEPEPOW_CUDA_RUNTIME_LOCAL_PHASE_CACHE=1 -DPEPEPOW_CUDA_STATIC_BLAKE32_SCHEDULE=1'
      - name: Build production and verification targets
        run: |
          set -Eeuo pipefail
          timeout -k 15s 480s cmake --build build --parallel 4 --target \
            pepepowminer pepepow_core_tests pepepow_stratum_clean_job_replay \
            pepepow_stratum_reconnect_replay pepepow_stratum_evidence_file \
            pepepow_cuda_tests pepepow_cuda_header80_validation \
            pepepow_header80_benchmark pepepow_header80_differential \
            2>&1 | tee /tmp/build.log
      - name: Verify CPU tests and CUDA package identity
        run: |
          set -Eeuo pipefail
          timeout -k 5s 180s ctest --test-dir build -C Release --output-on-failure \
            -R '^(pepepow_core_tests|pepepow_stratum_.*)$' 2>&1 | tee /tmp/ctest.log
          grep -F '100% tests passed, 0 tests failed out of 7' /tmp/ctest.log
          timeout -k 2s 10s ./build/pepepowminer --version | tee /tmp/version.log
          timeout -k 2s 10s ./build/pepepowminer --help | grep -F -- '--stratum-evidence P'
          /usr/local/cuda/bin/cuobjdump --list-elf build/pepepowminer | tee /tmp/elf.log
          grep -F sm_70 /tmp/elf.log
          ! grep -Eq 'sm_(61|75|86|89|120)' /tmp/elf.log
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' /tmp/build.log
          timeout -k 5s 120s /usr/local/cuda/bin/cuobjdump --dump-sass build/pepepowminer > /tmp/sass.txt
          python3 - <<'PY'
          import json, os, re
          log = open('/tmp/build.log', errors='replace').read().splitlines()
          resource = None
          for i, line in enumerate(log):
              if 'Function properties for' in line and 'hoohash_final_hotrun8_local_phase_kernel' in line:
                  block = '\n'.join(log[i:i+8])
                  resource = {
                      'registers': int(re.search(r'Used (\d+) registers', block).group(1)),
                      'stack_bytes': int(re.search(r'(\d+) bytes stack frame', block).group(1)),
                  }
                  break
          if resource is None:
              raise SystemExit('missing production kernel resources')
          ops = []
          active = False
          for line in open('/tmp/sass.txt', errors='replace'):
              if 'Function :' in line:
                  active = 'hoohash_final_hotrun8_local_phase_kernel' in line
                  continue
              if active and '/*' in line and '*/' in line and ';' in line:
                  op = line.split('*/', 1)[1].strip().split()[0]
                  if op != 'NOP':
                      ops.append(op)
          result = {
              'sm': 70,
              'kernel_sass': len(ops),
              'registers': resource['registers'],
              'stack_bytes': resource['stack_bytes'],
              'spill_bytes': 0,
          }
          result['experimental_cold_reconvergence'] = True
          sections = {}
          name = ''
          for line in open('/tmp/sass.txt', errors='replace'):
              if 'Function :' in line:
                  name = line.split('Function :',1)[1].strip()
                  sections.setdefault(name, [])
              elif name and '/*' in line and '*/' in line and ';' in line:
                  sections[name].append(line.strip())
          selected = {name:lines for name,lines in sections.items() if 'hoohash_mix_words_hotrun8_reconverged' in name or 'hoohash_final_hotrun8_local_phase_kernel' in name}
          collective_lines = [line for lines in selected.values() for line in lines if 'WARPSYNC' in line or 'BAR.WARP.SYNC' in line or 'VOTE' in line]
          print('RECONVERGENCE_CONTROL_FLOW ' + json.dumps({name:[line for line in lines if any(op in line for op in ('SYNC','BSSY','BRA','VOTE','CALL','RET'))] for name,lines in selected.items()},sort_keys=True))
          print('RECONVERGENCE_SASS_INSPECTION ' + json.dumps({'functions':list(selected),'collective_lines':collective_lines},sort_keys=True))
          result['warp_sync_instructions'] = sum('WARPSYNC' in line or 'BAR.WARP.SYNC' in line for line in collective_lines)
          result['vote_instructions'] = sum('VOTE' in line for line in collective_lines)
          # Pinned nvcc 12.8 sm70 lowering: reconverged noinline code is embedded
          # in the kernel SASS section. Verify exact before-call and after-call
          # structured joins and the completion vote/backedge; do not accept
          # arbitrary BSYNC instructions elsewhere in final BLAKE/math code.
          pinned_fragments = [
              '/*3300*/                   BSSY B0, 0x3ea0 ;',
              '/*3e90*/                   BSYNC B0 ;',
              '/*3ec0*/                   BSSY B0, 0x3fb0 ;',
              '/*3ef0*/                   CALL.REL.NOINC 0x4020 ;',
              '/*3fa0*/                   BSYNC B0 ;',
              '/*3fe0*/                   VOTE.ANY R2, PT, !P0 ;',
              '/*4000*/              @!P0 RET.REL.NODEC R34 0x0 ;',
              '/*4010*/                   BRA 0x32d0 ;',
          ]
          body = '\n'.join(line for lines in selected.values() for line in lines)
          positions = [body.find(fragment) for fragment in pinned_fragments]
          structured_pass = all(p >= 0 for p in positions) and positions == sorted(positions)
          result['structured_reconvergence_pass'] = structured_pass
          result['rendezvous_lowering'] = 'pinned_BSSY_BSYNC' if structured_pass else 'explicit_warp_barrier'
          if (not result['vote_instructions'] or not (result['warp_sync_instructions'] or structured_pass)) and os.environ.get('COMPILE_AUDIT_ONLY') != 'true':
              raise SystemExit('missing verified rendezvous/completion sequence')
          expected = {'sm': 70, 'spill_bytes': 0}
          result['identity_pass'] = all(result[k] == v for k, v in expected.items())
          result.update(source_commit=os.environ['EXPECTED_SOURCE'],cuda_compiled=True,cuda_executed=False,package_assembled=False,gpu_admission=False,status='COMPILE_ONLY_SASS_REVIEW_PENDING')
          print('WARM4_COMPILE_AUDIT_RESULT ' + json.dumps(result, sort_keys=True))
          open('/tmp/resources.json', 'w').write(json.dumps(result, indent=2, sort_keys=True) + '\n')
          if not result['identity_pass']:
              raise SystemExit('rendezvous package fails architecture/spill gate')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        timeout-minutes: 2
        with:
          name: warm4-compile-audit-${{ env.EXPECTED_SOURCE }}
          path: |
            dist/
            /tmp/build.log
            /tmp/ctest.log
            /tmp/version.log
            /tmp/elf.log
            /tmp/sass.txt
            /tmp/resources.json
          retention-days: 30

