name: V2 Speculative HooHash Correlation

on:
  push:
    branches:
      - agent/v21-v100-speculative-correlation
  workflow_dispatch:

jobs:
  correlation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CPU reference build
        working-directory: native
        run: cmake -S . -B build -DPEPEPOW_ENABLE_CUDA=OFF -DPEPEPOW_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build correlation probe and core tests
        working-directory: native
        run: cmake --build build --target pepepow_hoohash_speculative_correlation pepepow_core_tests -j2
      - name: Run core tests
        working-directory: native
        run: ./build/pepepow_core_tests
      - name: Run fixed-job speculative correlation probe
        working-directory: native
        run: ./build/pepepow_hoohash_speculative_correlation 16384 6 | tee speculative-correlation.txt
      - name: Upload correlation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-hoohash-speculative-correlation-${{ github.run_id }}
          path: native/speculative-correlation.txt
          if-no-files-found: warn
