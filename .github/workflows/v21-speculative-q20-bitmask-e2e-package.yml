name: PepeW-Miner-v2.1 BETA Q20 Bitmask E2E Offline Package

on:
  push:
    branches:
      - agent/v21-v100-speculative-q20-bitmask
    paths:
      - '.github/workflows/v21-speculative-q20-bitmask-e2e-package.yml'
      - 'native/src/benchmark/hoohash_speculative_q20_cuda.cu'
      - 'native/src/cuda/v1/speculative_q20_probe.cu'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates git ninja-build python3 python3-pip binutils
          python3 -m pip install --no-cache-dir 'cmake==3.31.6'
          rm -rf /var/lib/apt/lists/*
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70

      - name: Apply profiling-driven Q20 bitmask shift to E2E harness
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/src/benchmark/hoohash_speculative_q20_cuda.cu')
          s=p.read_text(encoding='utf-8')
          s=s.replace('constexpr std::int64_t kQScale = std::int64_t{1} << kQBits;\nconstexpr std::int64_t kQPeriod = kQScale * 1024;\nconstexpr std::int64_t kQColdThreshold = (kQPeriod * 2) / 100;',
                      'constexpr std::uint64_t kQScale = std::uint64_t{1} << kQBits;\nconstexpr std::uint64_t kQPeriod = kQScale * 1024ULL;\nconstexpr std::uint64_t kQPeriodMask = kQPeriod - 1ULL;\nconstexpr std::uint64_t kQColdThreshold = (kQPeriod * 2ULL) / 100ULL;\nstatic_assert((kQPeriod & (kQPeriod - 1ULL)) == 0ULL);')
          old='''            const int row=pair*2+rr; std::int64_t qsum=0;
            #pragma unroll 1
            for (int col=0;col<64;++col) {
                const std::uint8_t b=byte_at(first,col>>1);
                const std::uint32_t nib=(col&1)?(b&0x0fU):(b>>4U);
                if (cold) {
                    if (nib!=0U) {
                        const double val=static_cast<double>(nib);
                        const double x=matrix[row*64+col]*static_cast<double>(hash_mod)*val+nonce_mod;
                        const double c=safe_nonlinear(x)*val*1234.0;
                        qsum+=static_cast<std::int64_t>(floor(c*static_cast<double>(kQScale)+0.5));
                    }
                } else {
                    qsum+=static_cast<std::int64_t>(table[(row*64+col)*16+static_cast<int>(nib)]);
                }
                const std::int64_t rem=qsum%kQPeriod;
                cold=rem<=kQColdThreshold;
            }
            floors[rr]=static_cast<std::uint64_t>(qsum/kQScale);'''
          new='''            const int row=pair*2+rr; std::uint64_t qsum=0;
            #pragma unroll 1
            for (int col=0;col<64;++col) {
                const std::uint8_t b=byte_at(first,col>>1);
                const std::uint32_t nib=(col&1)?(b&0x0fU):(b>>4U);
                if (cold) {
                    if (nib!=0U) {
                        const double val=static_cast<double>(nib);
                        const double x=matrix[row*64+col]*static_cast<double>(hash_mod)*val+nonce_mod;
                        const double c=safe_nonlinear(x)*val*1234.0;
                        qsum+=static_cast<std::uint64_t>(floor(c*static_cast<double>(kQScale)+0.5));
                    }
                } else {
                    qsum+=static_cast<std::uint64_t>(table[(row*64+col)*16+static_cast<int>(nib)]);
                }
                const std::uint64_t rem=qsum & kQPeriodMask;
                cold=rem<=kQColdThreshold;
            }
            floors[rr]=qsum >> kQBits;'''
          if old not in s:
              raise SystemExit('Q20 E2E replacement marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          grep -F 'qsum & kQPeriodMask' native/src/benchmark/hoohash_speculative_q20_cuda.cu
          grep -F 'qsum >> kQBits' native/src/benchmark/hoohash_speculative_q20_cuda.cu
          ! grep -F 'qsum%kQPeriod' native/src/benchmark/hoohash_speculative_q20_cuda.cu

      - name: Add isolated Q20 E2E benchmark target
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/CMakeLists.txt')
          s=p.read_text(encoding='utf-8')
          marker='    add_executable(pepepow_cuda_benchmark src/benchmark/cuda_benchmark.cpp)\n'
          insert='''    add_executable(pepepow_hoohash_speculative_q20_cuda src/benchmark/hoohash_speculative_q20_cuda.cu)\n    target_link_libraries(pepepow_hoohash_speculative_q20_cuda PRIVATE pepepow_core)\n    set_target_properties(pepepow_hoohash_speculative_q20_cuda PROPERTIES\n        CUDA_STANDARD 20\n        CUDA_STANDARD_REQUIRED ON\n        CUDA_ARCHITECTURES "${PEPEPOW_CUDA_ARCHITECTURES}"\n        CUDA_SEPARABLE_COMPILATION OFF)\n    target_compile_options(pepepow_hoohash_speculative_q20_cuda PRIVATE\n        $<$<COMPILE_LANGUAGE:CUDA>:--fmad=false>\n        $<$<COMPILE_LANGUAGE:CUDA>:-Xptxas=-v>\n        $<$<COMPILE_LANGUAGE:CUDA>:-lineinfo>)\n'''
          if s.count(marker)!=1:
              raise SystemExit('benchmark insertion marker not unique')
          p.write_text(s.replace(marker,insert+marker,1),encoding='utf-8')
          PY

      - name: Configure sm70 production-shaped build
        run: |
          set -Eeuo pipefail
          export CUDACXX=/usr/local/cuda/bin/nvcc
          cmake -S native -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=OFF \
            -DPEPEPOW_CUDA_ARCHITECTURES='70-real' \
            -DPEPEPOW_CUDA_THREADS=704 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=ON \
            -DPEPEPOW_CUDA_HOTRUN8=ON \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON \
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON \
            -DPEPEPOW_CUDA_SW_STATE_MODE=3 \
            '-DCMAKE_CUDA_FLAGS=-DPEPEPOW_CUDA_HOTRUN8_FUSION_MODE=2'

      - name: Build and enforce static gate
        run: |
          set -Eeuo pipefail
          cmake --build build --parallel 4 --target pepepow_hoohash_speculative_q20_cuda 2>&1 | tee /tmp/q20-bitmask-build.log
          test -x build/pepepow_hoohash_speculative_q20_cuda
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' /tmp/q20-bitmask-build.log
          /usr/local/cuda/bin/cuobjdump --list-elf build/pepepow_hoohash_speculative_q20_cuda | tee /tmp/q20-bitmask-elf.txt
          grep -F sm_70 /tmp/q20-bitmask-elf.txt
          /usr/local/cuda/bin/cuobjdump --dump-resource-usage build/pepepow_hoohash_speculative_q20_cuda | tee /tmp/q20-bitmask-resources.txt
          /usr/local/cuda/bin/cuobjdump --dump-sass build/pepepow_hoohash_speculative_q20_cuda > /tmp/q20-bitmask.sass
          if grep -Eqi '(div\.u64|rem\.u64|__udiv|__umod|__div|__mod)' /tmp/q20-bitmask.sass; then
            echo 'Q20_BITMASK_E2E_STATIC_REJECT=integer_divrem_present'
            exit 1
          fi
          echo 'Q20_BITMASK_E2E_STATIC_PASS=sm70_no_spills_no_int_divrem'
          echo 'PROMOTION_ALLOWED=false'

      - name: Assemble immutable offline package
        run: |
          set -Eeuo pipefail
          mkdir -p package
          install -m 0755 build/pepepow_hoohash_speculative_q20_cuda package/
          cp /tmp/q20-bitmask-build.log /tmp/q20-bitmask-resources.txt package/
          cat > package/BUILD_INFO.txt <<EOF
          product=PepeW-Miner-v2.1 BETA
          candidate_class=speculative_filtered_hoohash
          architecture=fixed_point_linear_state_q20_bitmask_cuda_e2e
          source_branch=${GITHUB_REF_NAME}
          source_commit=${GITHUB_SHA}
          cuda_arch=sm_70
          relaxed_target_default_bits=8
          recall_gate=0.995
          throughput_gate_pct=25
          strict_validation_required=true
          real_pool_allowed=false
          EOF
          tar -C package -czf q20-bitmask-e2e-sm70.tar.gz .
          sha256sum q20-bitmask-e2e-sm70.tar.gz | tee q20-bitmask-e2e-sm70.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: q20-bitmask-e2e-sm70-${{ github.sha }}
          path: |
            q20-bitmask-e2e-sm70.tar.gz
            q20-bitmask-e2e-sm70.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable technical release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1-q20-bitmask-e2e-sm70-offline-${{ github.sha }}
          name: PepeW-Miner-v2.1 BETA Q20 Bitmask E2E Offline ${{ github.sha }}
          prerelease: true
          files: |
            q20-bitmask-e2e-sm70.tar.gz
            q20-bitmask-e2e-sm70.tar.gz.sha256
          fail_on_unmatched_files: true
