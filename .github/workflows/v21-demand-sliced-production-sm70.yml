name: V2 Pre-Notify Stratum Replay Gate

on:
  push:
    branches:
      - agent/demand-sliced-batch-correctness-20260917
    paths:
      - .github/workflows/v21-demand-sliced-production-sm70.yml
      - native/src/network/stratum_client.cpp
      - native/tests/stratum_clean_job_replay.cpp
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Reject late hosted start
        run: |
          test "$(date -u +%s)" -lt "$(date -u -d '2026-09-28 20:05:00 UTC' +%s)" || {
            echo ABSOLUTE_DEADLINE_NO_BUILD
            exit 1
          }

      - uses: actions/checkout@v4

      - name: Configure CPU-only Release tests
        run: |
          set -Eeuo pipefail
          cmake -S native -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPEPEPOW_ENABLE_CUDA=OFF \
            -DPEPEPOW_BUILD_TESTS=ON

      - name: Build bounded protocol tests
        run: |
          set -Eeuo pipefail
          cmake --build build --parallel 4 --target \
            pepepow_core_tests pepepow_stratum_clean_job_replay

      - name: Run complete CPU core and extended socket replay
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=5 120 ./build/pepepow_core_tests | tee /tmp/core.log
          timeout --signal=TERM --kill-after=5 30 ./build/pepepow_stratum_clean_job_replay | tee /tmp/replay.log
          grep -F 'PASS: socket clean-job replay accepted=2 rejected=3 clean_job_stale=2' /tmp/replay.log
          echo PRE_NOTIFY_REPLAY_PASS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-notify-stratum-replay-${{ github.run_id }}
          path: |
            /tmp/core.log
            /tmp/replay.log
          if-no-files-found: warn
          retention-days: 30
