name: V2.1 SW FirstWarm Width2 Offline Benchmark Package

on:
  push:
    branches:
      - agent/v21-v100-sw-firstwarm2-prod
    paths:
      - '.github/workflows/v21-sw-firstwarm2-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install hosted build tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ninja-build g++ git ca-certificates curl python3 xz-utils
          CMAKE_VER=3.31.8
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz" \
            -o /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          ln -sf /opt/cmake/bin/cmake /usr/local/bin/cmake

      - name: Apply conservative first-state warm certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/src/cuda/v1/header80_hotrun8.inc')
          s=p.read_text()
          old='''__device__ __forceinline__ bool hotrun2_same_1024_bin(double a, double b) {
    // For non-negative finite consensus sums, floor(sum) >> 10 is exactly the
    // 1024-wide bin used by frac(sum / 1024). Equality proves that a monotonic
    // pair cannot wrap the fractional state between its entry and final sum.
    return (positive_double_to_u64_rz(a) >> 10U) ==
           (positive_double_to_u64_rz(b) >> 10U);
}'''
          new='''__device__ __forceinline__ bool hotrun2_first_state_proven_warm(double sum1) {
    // sum is row-local even though SW state carries across rows. Therefore the
    // first skipped transition must be proven from sum1 itself. For finite,
    // non-negative consensus sums, integer remainder >= 21 implies
    // frac(sum1 / 1024) >= 21/1024 > 0.02, so update_sw_state(sum1) is warm.
    // Values below 21 conservatively fall back to the exact per-cell path.
    return (positive_double_to_u64_rz(sum1) & 1023ULL) >= 21ULL;
}'''
          if old not in s:
              raise SystemExit('expected monotonic helper not found')
          s=s.replace(old,new,1)
          s=s.replace('if (hotrun2_same_1024_bin(sum, sum2)) {','if (hotrun2_first_state_proven_warm(sum1)) {',1)
          s=s.replace('// Entry state is already known warm. Since c0/c1 are\n                // non-negative and there is no bin wrap, the intermediate\n                // state is also warm. Preserve FP64 addition order and update\n                // only the final state of the pair.','// The first row-local state is proven warm directly from sum1.\n                // Preserve FP64 addition order, skip only that proven-redundant\n                // state write, then evaluate the exact final state of the pair.',1)
          p.write_text(s)
          PY
          grep -q 'hotrun2_first_state_proven_warm' native/src/cuda/v1/header80_hotrun8.inc
          ! grep -q 'hotrun2_same_1024_bin' native/src/cuda/v1/header80_hotrun8.inc

      - name: Build exact baseline and first-warm width2 candidate
        shell: bash
        run: |
          set -euo pipefail
          common=(
            -G Ninja
            -DPEPEPOW_ENABLE_CUDA=ON
            -DPEPEPOW_BUILD_TESTS=OFF
            -DPEPEPOW_CUDA_ARCHITECTURES=70-real
            -DPEPEPOW_CUDA_THREADS=704
            -DPEPEPOW_CUDA_MIN_BLOCKS=1
            -DPEPEPOW_CUDA_SCALED_MATRIX=OFF
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON
            -DPEPEPOW_CUDA_SW_STATE_MODE=3
            -DPEPEPOW_CUDA_BYTE_UNROLL=1
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc
          )

          cmake -S native -B /tmp/exact "${common[@]}" \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=OFF \
            -DPEPEPOW_CUDA_HOTRUN8=OFF
          cmake --build /tmp/exact --target pepepow_header80_benchmark pepepow_header80_differential -j2 2>&1 | tee /tmp/exact-build.log

          cmake -S native -B /tmp/candidate "${common[@]}" \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=ON \
            -DPEPEPOW_CUDA_HOTRUN8=ON \
            '-DCMAKE_CUDA_FLAGS=-DPEPEPOW_CUDA_HOTRUN8_FUSION_MODE=2'
          cmake --build /tmp/candidate --target pepepow_header80_benchmark pepepow_header80_differential -j2 2>&1 | tee /tmp/candidate-build.log

          if grep -Eq '[1-9][0-9]* bytes spill stores|[1-9][0-9]* bytes spill loads' /tmp/candidate-build.log; then
            echo 'ERROR: first-warm width2 production build contains CUDA spills on sm_70'
            exit 1
          fi
          grep -q 'hoohash_final_hotrun8_fused_kernel' /tmp/candidate-build.log

          mkdir -p /tmp/pkg
          cp /tmp/exact/pepepow_header80_benchmark /tmp/pkg/pepepow_header80_benchmark_exact
          cp /tmp/candidate/pepepow_header80_benchmark /tmp/pkg/pepepow_header80_benchmark_firstwarm2
          cp /tmp/candidate/pepepow_header80_differential /tmp/pkg/pepepow_header80_differential_firstwarm2
          cp /tmp/exact-build.log /tmp/pkg/exact-build.log
          cp /tmp/candidate-build.log /tmp/pkg/firstwarm2-build.log
          cat > /tmp/pkg/build-info.txt <<EOF
          source_branch=agent/v21-v100-sw-firstwarm2-prod
          source_commit=${GITHUB_SHA}
          cuda_toolkit=12.8.1
          cuda_arch=sm_70
          benchmark_path=production-header80-backend
          exact_candidate_pair=true
          differential_path=production-header80-search-max-target
          architecture=hotrun8-fusion2-sw-firstwarm-width2
          candidate_split_pipeline=true
          candidate_hotrun8=true
          candidate_fusion_mode=2
          candidate_certificate=first_sum_integer_remainder_ge_21
          candidate_spills=0
          EOF
          tar -C /tmp/pkg -czf /tmp/PepeW-v2.1-SW-FirstWarm2-V100-Offline-Bench.tar.gz .
          sha256sum /tmp/PepeW-v2.1-SW-FirstWarm2-V100-Offline-Bench.tar.gz | tee /tmp/PepeW-v2.1-SW-FirstWarm2-V100-Offline-Bench.tar.gz.sha256

      - name: Hosted quick differential
        shell: bash
        run: |
          set -euo pipefail
          echo 'Hosted builders have no V100; CUDA runtime differential is deferred to exclusive hardware gate.'

      - name: Upload hosted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-firstwarm2-package-${{ github.sha }}
          path: |
            /tmp/exact-build.log
            /tmp/candidate-build.log
            /tmp/PepeW-v2.1-SW-FirstWarm2-V100-Offline-Bench.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Publish replaceable prerelease asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.1-sw-firstwarm2-v100-offline-bench
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28')
          release_json="$(curl -fsSL "${auth[@]}" "${api}/releases/tags/${TAG}" 2>/dev/null || true)"
          if [[ -z "$release_json" ]]; then
            release_json="$(curl -fsSL -X POST "${auth[@]}" -H 'Content-Type: application/json' "${api}/releases" -d "{\"tag_name\":\"${TAG}\",\"target_commitish\":\"${GITHUB_SHA}\",\"name\":\"PepeW-Miner-v2.1 BETA SW FirstWarm Width2 Offline Bench\",\"prerelease\":true}")"
          fi
          rid="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$release_json")"
          assets="$(curl -fsSL "${auth[@]}" "${api}/releases/${rid}/assets")"
          name='PepeW-v2.1-SW-FirstWarm2-V100-Offline-Bench.tar.gz'
          aid="$(python3 -c 'import json,sys; n=sys.argv[1]; print(next((x["id"] for x in json.load(sys.stdin) if x["name"]==n),""))' "$name" <<<"$assets")"
          [[ -z "$aid" ]] || curl -fsSL -X DELETE "${auth[@]}" "${api}/releases/assets/${aid}" >/dev/null
          curl -fsSL -X POST "${auth[@]}" -H 'Content-Type: application/gzip' --data-binary @/tmp/PepeW-v2.1-SW-FirstWarm2-V100-Offline-Bench.tar.gz "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${rid}/assets?name=${name}" >/dev/null
          echo "asset=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}"
