name: v1.1.0 V100 persistent warp cohort

on:
  workflow_dispatch:
  push:
    branches: [release/v1.1.0]
    paths:
      - "VERSION"
      - "native/**"
      - "hiveos/**"
      - "tools/prepare-v109-volta-geometry.py"
      - "tools/prepare-v110-warp-cohort.py"
      - "tools/sanitize-v110-generated-source.py"
      - "tools/stage-v110-hiveos.py"
      - ".github/workflows/v110-v100-cohort.yml"
      - "README.md"
      - "RELEASE_NOTES_v1.1.0.md"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-v100-v110:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates git ninja-build python3 python3-pip tar gzip binutils
          python3 -m pip install --no-cache-dir 'cmake==3.31.6'
          /usr/local/cuda/bin/nvcc --version
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70

      - name: Prepare v1.1.0 source
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '1.1.0'
          python3 tools/prepare-v110-warp-cohort.py | tee prepare-v110.txt
          grep -F 'V109_VOLTA_GEOMETRY_PREPARE=PASS' prepare-v110.txt
          grep -F 'V110_WARP_COHORT_PREPARE=PASS' prepare-v110.txt
          python3 tools/sanitize-v110-generated-source.py | tee sanitize-v110.txt
          grep -F 'V110_GENERATED_SOURCE_SANITIZE=PASS' sanitize-v110.txt
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('native/src/cuda/v1').glob('header80_backend_part*.inc'):
              if b'\x00' in path.read_bytes():
                  raise SystemExit(f'NUL byte remains in {path}')
          print('V110_CUDA_SOURCE_NUL_GATE=PASS')
          PY
          python3 -m py_compile \
            tools/prepare-v110-warp-cohort.py \
            tools/sanitize-v110-generated-source.py \
            tools/stage-v110-hiveos.py \
            hiveos/stratum-replay-proxy.py
          bash -n hiveos/v110-autotune.sh

      - name: Configure and build
        run: |
          set -Eeuo pipefail
          export CUDACXX=/usr/local/cuda/bin/nvcc
          cmake -S native -B build-v110-v100 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=ON \
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON \
            -DPEPEPOW_CUDA_ARCHITECTURES='70-real' \
            -DPEPEPOW_CUDA_THREADS=768 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=OFF \
            -DPEPEPOW_CUDA_SCALED_MATRIX=ON \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON \
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON \
            -DPEPEPOW_CUDA_SW_STATE_MODE=3
          cmake --build build-v110-v100 --parallel 4 --target \
            pepepowminer pepepow_core_tests pepepow_cuda_tests \
            pepepow_cuda_header80_validation pepepow_v110_autotune 2>&1 | tee build-v110.txt
          ! grep -F 'null character(s) preserved in literal' build-v110.txt
          ./build-v110-v100/pepepowminer --version | tee binary-version.txt
          grep -F '1.1.0' binary-version.txt
          ./build-v110-v100/pepepow_v110_autotune --help | tee autotune-help.txt
          grep -F -- '--engine exact|cohort' autotune-help.txt
          grep -F -- '--threshold' autotune-help.txt
          ctest --test-dir build-v110-v100 --output-on-failure -R '^pepepow_core_tests$'

      - name: Verify final Volta ELF and cohort kernel
        run: |
          set -Eeuo pipefail
          FINAL='build-v110-v100/pepepowminer'
          TUNER='build-v110-v100/pepepow_v110_autotune'
          CUDA_OBJ='build-v110-v100/CMakeFiles/pepepow_cuda.dir/src/cuda/header80_backend.cu.o'
          test -s "$FINAL"
          test -s "$TUNER"
          test -s "$CUDA_OBJ"

          /usr/local/cuda/bin/cuobjdump --list-elf "$FINAL" | tee final-fatbin.txt
          grep -F sm_70 final-fatbin.txt
          /usr/local/cuda/bin/cuobjdump --list-elf "$TUNER" | tee autotune-fatbin.txt
          grep -F sm_70 autotune-fatbin.txt

          /usr/local/cuda/bin/cuobjdump --dump-resource-usage "$FINAL" | tee final-resource-usage.txt
          grep -F 'header80_pow_kernel' final-resource-usage.txt
          grep -F 'header80_pow_warp_cohort_kernel' final-resource-usage.txt
          grep -A1 -F 'header80_pow_warp_cohort_kernel' final-resource-usage.txt | grep -F 'SHARED:0'
          grep -A1 -F 'header80_pow_warp_cohort_kernel' final-resource-usage.txt | grep -F 'LOCAL:0'

          /usr/local/cuda/bin/cuobjdump --list-elf "$CUDA_OBJ" | tee object-fatbin.txt
          grep -F sm_70 object-fatbin.txt
          readelf -S "$FINAL" | tee binary-sections.txt
          grep -E '\.nv_fatbin|\.nvFatBinSegment' binary-sections.txt

      - name: Package HiveOS candidate
        run: |
          set -Eeuo pipefail
          PEPEW_BUILD_DIR=build-v110-v100 python3 tools/stage-v110-hiveos.py | tee package-info.txt
          ROOT='dist-stage/PepeW-Miner-v1.1.0'
          test -d "$ROOT"
          for script in h-config.sh h-run.sh h-stats.sh console-monitor.sh v110-autotune.sh; do
            bash -n "$ROOT/$script"
          done
          grep -Fqx 'CUSTOM_NAME=PepeW-Miner-v1.1.0' "$ROOT/h-manifest.conf"
          grep -Fqx 'CUSTOM_VERSION=1.1.0' "$ROOT/h-manifest.conf"
          grep -Fqx 'new_engine=warp-cohort-persistent' "$ROOT/BUILD_PROFILE"
          grep -Fqx 'cohort_threads=256' "$ROOT/BUILD_PROFILE"
          grep -Fqx 'hot_loop_block_barriers_cohort=0' "$ROOT/BUILD_PROFILE"
          grep -Fqx 'cpu_candidate_validation=consensus-exact' "$ROOT/BUILD_PROFILE"
          grep -F 'PepeW Miner v1.1.0 - Performance & Stability Edition' "$ROOT/h-run.sh"
          grep -F 'PepeW - твоя монета. Твои правила.' "$ROOT/h-run.sh"
          grep -F 'PEPEPOW_V110_ENGINE' "$ROOT/h-run.sh"
          grep -F '1 2 4 8 10 12' "$ROOT/v110-autotune.sh"
          test -x "$ROOT/pepepow-v110-autotune"
          (cd "$ROOT" && sha256sum -c pepepowminer.sha256)
          ! find "$ROOT" -type d -name '__pycache__' | grep -q .

          mkdir -p dist
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C dist-stage -cf - PepeW-Miner-v1.1.0 | gzip -n > dist/PepeW-Miner-v1.1.0-HiveOS.tar.gz
          (cd dist && sha256sum PepeW-Miner-v1.1.0-HiveOS.tar.gz > PepeW-Miner-v1.1.0-HiveOS.tar.gz.sha256)
          tar -tzf dist/PepeW-Miner-v1.1.0-HiveOS.tar.gz > dist/archive-list.txt
          for item in pepepowminer pepepow-v110-autotune v110-autotune.sh h-manifest.conf BUILD_PROFILE; do
            grep -Fqx "PepeW-Miner-v1.1.0/${item}" dist/archive-list.txt
          done
          ! grep -Fq '__pycache__' dist/archive-list.txt
          ! grep -Fq '^PepeW-Miner-v1.1.0-HiveOS/' dist/archive-list.txt
          echo "ARCHIVE_SHA256=$(sha256sum dist/PepeW-Miner-v1.1.0-HiveOS.tar.gz | awk '{print $1}')"

      - name: Upload v1.1.0 candidate
        uses: actions/upload-artifact@v4
        with:
          name: PepeW-Miner-v1.1.0-HiveOS-v100-cohort
          path: |
            dist/PepeW-Miner-v1.1.0-HiveOS.tar.gz
            dist/PepeW-Miner-v1.1.0-HiveOS.tar.gz.sha256
            dist/archive-list.txt
            binary-version.txt
            autotune-help.txt
            final-fatbin.txt
            autotune-fatbin.txt
            final-resource-usage.txt
            object-fatbin.txt
            binary-sections.txt
            prepare-v110.txt
            sanitize-v110.txt
            build-v110.txt
            package-info.txt
          if-no-files-found: error
          retention-days: 14
