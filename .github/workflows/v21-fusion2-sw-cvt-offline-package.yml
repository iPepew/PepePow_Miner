name: V2.1 Fusion2 SW CVT Predicate Offline Benchmark Package

on:
  push:
    branches:
      - agent/v21-v100-fusion2-sw-cvt
    paths:
      - '.github/workflows/v21-fusion2-sw-cvt-offline-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install hosted build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl g++ git ninja-build python3 xz-utils
          CMAKE_VER=3.31.8
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz" \
            -o /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          ln -sf /opt/cmake/bin/cmake /usr/local/bin/cmake
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70

      - name: Build pool-confirmed fusion2 baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          common=(
            -G Ninja
            -DPEPEPOW_ENABLE_CUDA=ON
            -DPEPEPOW_BUILD_TESTS=OFF
            -DPEPEPOW_CUDA_ARCHITECTURES=70-real
            -DPEPEPOW_CUDA_THREADS=704
            -DPEPEPOW_CUDA_MIN_BLOCKS=1
            -DPEPEPOW_CUDA_SCALED_MATRIX=OFF
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON
            -DPEPEPOW_CUDA_SW_STATE_MODE=3
            -DPEPEPOW_CUDA_BYTE_UNROLL=1
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=ON
            -DPEPEPOW_CUDA_HOTRUN8=ON
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc
            '-DCMAKE_CUDA_FLAGS=-DPEPEPOW_CUDA_HOTRUN8_FUSION_MODE=2'
          )
          printf '%s\n' "${common[@]}" > /tmp/common-cmake-flags.txt
          cmake -S native -B /tmp/exact "${common[@]}"
          cmake --build /tmp/exact \
            --target pepepow_header80_benchmark pepepow_header80_differential -j2 \
            2>&1 | tee /tmp/exact-build.log
          grep -q 'hoohash_final_hotrun8_fused_kernel' /tmp/exact-build.log
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' /tmp/exact-build.log

      - name: Apply exact finite-range SW CVT predicate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('native/src/cuda/v1/header80_backend_part02.inc')
          s = p.read_text(encoding='utf-8')
          old = '''__device__ __forceinline__ void update_sw_state(
              HooHashSwState& state, double sum) {
              state = positive_fraction_div1024_le_002_finite(sum);
          }
          #endif'''
          new = '''__device__ __forceinline__ void update_sw_state(
              HooHashSwState& state, double sum) {
              // HooHash row sums are positive, finite, and far below 2^53.
              // Multiplication by 2^-10 is exact; both conversions are exact in
              // the reachable range, so this is the reference frac(sum/1024)
              // predicate with a shorter dependency chain on sm_70.
              const double scaled = sum * 0x1.0p-10;
              const unsigned long long whole = __double2ull_rd(scaled);
              state = (scaled - static_cast<double>(whole)) <= 0.02;
          }
          #endif'''
          if s.count(old) != 1:
              raise SystemExit(f'expected mode3 update marker count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q '__double2ull_rd(scaled)' native/src/cuda/v1/header80_backend_part02.inc

      - name: Build and statically gate candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t common < /tmp/common-cmake-flags.txt
          cmake -S native -B /tmp/candidate "${common[@]}"
          cmake --build /tmp/candidate \
            --target pepepow_header80_benchmark pepepow_header80_differential -j2 \
            2>&1 | tee /tmp/sw-cvt-build.log
          grep -q 'hoohash_final_hotrun8_fused_kernel' /tmp/sw-cvt-build.log
          if grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' /tmp/sw-cvt-build.log; then
            echo 'ERROR: SW CVT candidate contains CUDA spills on sm_70' >&2
            exit 1
          fi
          /usr/local/cuda/bin/cuobjdump --dump-sass /tmp/exact/pepepow_header80_benchmark \
            > /tmp/exact.sass
          /usr/local/cuda/bin/cuobjdump --dump-sass /tmp/candidate/pepepow_header80_benchmark \
            > /tmp/sw-cvt.sass

      - name: Assemble immutable A/B package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/pkg
          mkdir -p /tmp/pkg
          cp /tmp/exact/pepepow_header80_benchmark \
            /tmp/pkg/pepepow_header80_benchmark_exact
          cp /tmp/candidate/pepepow_header80_benchmark \
            /tmp/pkg/pepepow_header80_benchmark_sw_cvt
          cp /tmp/candidate/pepepow_header80_differential \
            /tmp/pkg/pepepow_header80_differential_sw_cvt
          cp /tmp/exact-build.log /tmp/pkg/exact-build.log
          cp /tmp/sw-cvt-build.log /tmp/pkg/sw-cvt-build.log
          cp /tmp/exact.sass /tmp/pkg/exact.sass
          cp /tmp/sw-cvt.sass /tmp/pkg/sw-cvt.sass
          cat > /tmp/pkg/build-info.txt <<EOF
          source_branch=${GITHUB_REF_NAME}
          source_commit=${GITHUB_SHA}
          baseline_source_commit=35b13ed65fdc30b55c89150fc1069c72a7d06cc6
          cuda_toolkit=12.8.1
          cuda_arch=sm_70
          benchmark_path=production-header80-backend
          exact_candidate_pair=true
          comparison_baseline=pool-confirmed-hotrun8-fusion2
          differential_path=production-header80-search-max-target
          architecture=hotrun8-fusion2-sw-cvt-predicate
          candidate_split_pipeline=true
          candidate_hotrun8=true
          candidate_fusion_mode=2
          candidate_sw_predicate=exact-finite-cvt
          candidate_spills=0
          EOF
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C /tmp/pkg -cf - . | gzip -n \
            > /tmp/PepeW-v2.1-Fusion2-SW-CVT-V100-Offline-Bench.tar.gz
          sha256sum /tmp/PepeW-v2.1-Fusion2-SW-CVT-V100-Offline-Bench.tar.gz \
            | tee /tmp/PepeW-v2.1-Fusion2-SW-CVT-V100-Offline-Bench.tar.gz.sha256

      - name: Publish replaceable prerelease asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.1-fusion2-sw-cvt-v100-offline-bench
          ASSET: PepeW-v2.1-Fusion2-SW-CVT-V100-Offline-Bench.tar.gz
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28')
          release_json="$(curl -fsSL "${auth[@]}" "${api}/releases/tags/${TAG}" 2>/dev/null || true)"
          if [[ -z "$release_json" ]]; then
            release_json="$(curl -fsSL -X POST "${auth[@]}" -H 'Content-Type: application/json' \
              "${api}/releases" -d "{\"tag_name\":\"${TAG}\",\"target_commitish\":\"${GITHUB_SHA}\",\"name\":\"PepeW v2.1 Fusion2 SW CVT Offline Bench\",\"prerelease\":true}")"
          fi
          rid="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$release_json")"
          assets="$(curl -fsSL "${auth[@]}" "${api}/releases/${rid}/assets")"
          aid="$(python3 -c 'import json,sys; n=sys.argv[1]; print(next((x["id"] for x in json.load(sys.stdin) if x["name"]==n),""))' "$ASSET" <<<"$assets")"
          [[ -z "$aid" ]] || curl -fsSL -X DELETE "${auth[@]}" "${api}/releases/assets/${aid}" >/dev/null
          curl -fsSL -X POST "${auth[@]}" -H 'Content-Type: application/gzip' \
            --data-binary @"/tmp/${ASSET}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${rid}/assets?name=${ASSET}" >/dev/null
          echo "asset=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"

      - name: Upload hosted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion2-sw-cvt-package-${{ github.sha }}
          path: |
            /tmp/exact-build.log
            /tmp/sw-cvt-build.log
            /tmp/PepeW-v2.1-Fusion2-SW-CVT-V100-Offline-Bench.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 30
