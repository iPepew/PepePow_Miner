name: PepeW-Miner-v2.1 BETA Q20 Guarded Pair Static

on:
  push:
    branches:
      - agent/v21-v100-speculative-q20-guarded-pair
    paths:
      - 'scripts/apply_q20_guarded_pair.py'
      - '.github/workflows/v21-speculative-q20-guarded-pair-static.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  static-profile:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates git ninja-build python3 python3-pip binutils
          python3 -m pip install --no-cache-dir 'cmake==3.31.6'
          rm -rf /var/lib/apt/lists/*
          /usr/local/cuda/bin/nvcc --list-gpu-code | grep -F sm_70
      - name: Apply guarded-pair transform
        run: |
          set -Eeuo pipefail
          python3 scripts/apply_q20_guarded_pair.py
          grep -F 'const std::uint64_t room=kQPeriodMask-rem0;' native/src/benchmark/hoohash_speculative_q20_cuda.cu
          grep -F 'if (dsum<=room)' native/src/benchmark/hoohash_speculative_q20_cuda.cu
          ! grep -F 'qsum%kQPeriod' native/src/benchmark/hoohash_speculative_q20_cuda.cu
      - name: Configure and build sm70
        run: |
          set -Eeuo pipefail
          export CUDACXX=/usr/local/cuda/bin/nvcc
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc -DPEPEPOW_ENABLE_CUDA=ON -DPEPEPOW_BUILD_TESTS=OFF -DPEPEPOW_CUDA_ARCHITECTURES='70-real' -DPEPEPOW_CUDA_THREADS=704 -DPEPEPOW_CUDA_MIN_BLOCKS=1 -DPEPEPOW_CUDA_SPLIT_PIPELINE=ON -DPEPEPOW_CUDA_HOTRUN8=ON -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON -DPEPEPOW_CUDA_ASSUME_FINITE=ON -DPEPEPOW_CUDA_SW_STATE_MODE=3 '-DCMAKE_CUDA_FLAGS=-DPEPEPOW_CUDA_HOTRUN8_FUSION_MODE=2'
          cmake --build build --parallel 4 --target pepepow_hoohash_speculative_q20_cuda 2>&1 | tee guarded-pair-build.log
      - name: Enforce static gate
        run: |
          set -Eeuo pipefail
          test -x build/pepepow_hoohash_speculative_q20_cuda
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' guarded-pair-build.log
          /usr/local/cuda/bin/cuobjdump --dump-resource-usage build/pepepow_hoohash_speculative_q20_cuda | tee guarded-pair-resources.txt
          /usr/local/cuda/bin/cuobjdump --dump-sass build/pepepow_hoohash_speculative_q20_cuda > guarded-pair.sass
          if grep -Eqi '(div\.u64|rem\.u64|__udiv|__umod|__div|__mod)' guarded-pair.sass; then
            echo 'STATIC_REJECT=integer_divrem_present'
            exit 1
          fi
          inst=$(grep -Ec '^\s*/\*[0-9a-fA-F]+\*/' guarded-pair.sass || true)
          echo "sass_instruction_lines=$inst"
          test "$inst" -le 8008
          echo 'STATIC_PASS=q20_guarded_pair'
          echo 'V100_ALLOWED=false'
      - uses: actions/upload-artifact@v4
        with:
          name: q20-guarded-pair-static-${{ github.sha }}
          path: |
            guarded-pair-build.log
            guarded-pair-resources.txt
            guarded-pair.sass
          if-no-files-found: error
          retention-days: 14
