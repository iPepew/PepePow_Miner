name: V2 Speculative Linear Precompute

on:
  push:
    branches:
      - agent/v21-v100-speculative-linear-precompute
  workflow_dispatch:

jobs:
  correlation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CPU reference build
        working-directory: native
        run: cmake -S . -B build -DPEPEPOW_ENABLE_CUDA=OFF -DPEPEPOW_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build profiled precompute probe and core tests
        working-directory: native
        run: cmake --build build --target pepepow_hoohash_linear_precompute_correlation pepepow_core_tests -j2
      - name: Run core tests
        working-directory: native
        run: ./build/pepepow_core_tests
      - name: Run fixed-job linear precompute correlation gate
        working-directory: native
        run: ./build/pepepow_hoohash_linear_precompute_correlation 131072 8 | tee linear-precompute-correlation.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-linear-precompute-${{ github.run_id }}
          path: native/linear-precompute-correlation.txt
          if-no-files-found: warn
