name: Native CI

on:
  push:
    branches:
      - main
    paths:
      - "native/**"
      - "lab/pepew-hardware-test.sh"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "native/**"
      - "lab/pepew-hardware-test.sh"
      - ".github/workflows/native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate hardware test harness
        if: runner.os == 'Linux'
        run: bash -n lab/pepew-hardware-test.sh

      - name: Configure
        run: cmake -S native -B native/build -DPEPEPOW_BUILD_TESTS=ON -DPEPEPOW_ENABLE_CUDA=OFF -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build native/build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir native/build -C ${{ matrix.build_type }} --output-on-failure

      - name: Nonlinear census 256 nonces
        if: runner.os == 'Linux'
        run: native/build/pepepow_nonlinear_census 256 | tee native/build/nonlinear-census.json

      - name: Speculative exp phase LUT recall/throughput sweep
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for bins in 1024 4096 16384; do
            native/build/pepepow_speculative_exp_phase 8192 "$bins" 15 | tee "native/build/spec-exp-phase-${bins}.json"
          done
