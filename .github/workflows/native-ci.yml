name: Native CI

on:
  push:
    branches:
      - main
    paths:
      - "native/**"
      - "hiveos/prepare-v040-source.py"
      - "hiveos/prepare-v050-source.py"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "native/**"
      - "hiveos/prepare-v040-source.py"
      - "hiveos/prepare-v050-source.py"
      - ".github/workflows/native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare legacy v0.5.0 release source
        run: |
          set -euo pipefail
          case "$(tr -d '\r\n' < VERSION)" in
            0.5.0|0.5.0-PR) python3 hiveos/prepare-v050-source.py ;;
            *) echo "Legacy v0.5.0 source transformation is not applicable to $(cat VERSION)" ;;
          esac

      - name: Configure
        run: cmake -S native -B native/build -DPEPEPOW_BUILD_TESTS=ON -DPEPEPOW_ENABLE_CUDA=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build native/build --config Release --parallel

      - name: Test
        run: ctest --test-dir native/build -C Release --output-on-failure
