name: Release source lint

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            hiveos/prepare-v040-source.py \
            hiveos/prepare-v050-source.py \
            hiveos/prepare-v051-source.py \
            hiveos/prepare-v052-source.py \
            hiveos/stratum-replay-proxy.py
          for script in hiveos/*.sh; do bash -n "$script"; done
      - name: Apply legacy v0.5.2 exact conversion profile
        run: |
          set -euo pipefail
          if [[ "$(tr -d '\r\n' < VERSION)" != "0.5.2" ]]; then
            echo "Legacy v0.5.2 source transformation is not applicable to $(cat VERSION)"
            exit 0
          fi
          python3 hiveos/prepare-v052-source.py
          ! grep -P '[\x{1F300}-\x{1FAFF}]|•' native/src/app/main.cpp
          grep -F 'https://t.me/pepepow_ru' native/src/app/main.cpp
          grep -F 'GPU_COUNT=1' native/src/app/main.cpp
          grep -F 'GPU0_HPS=' native/src/app/main.cpp
          grep -F 'chunk_size = 524288' native/src/app/main.cpp
          grep -F 'header80_backend_v052.cu' native/CMakeLists.txt
          grep -F 'PEPEPOW_CUDA_EXACT_BIT_CONVERSIONS' native/CMakeLists.txt
          grep -F 'u32_to_double_exact' native/src/cuda/header80_backend_v052.cu
          grep -F 'positive_fraction_bits' native/src/cuda/header80_backend_v052.cu
          grep -F 'positive_double_to_u64_rz' native/src/cuda/header80_backend_v052.cu
          grep -F 'if (value == 0.0) return;' native/src/cuda/header80_backend_v052.cu
          grep -F 'PASS: 4096 exact-conversion CPU/CUDA samples match' native/tests/cuda_header80_validation.cpp
      - name: Configure CPU reference build
        run: |
          set -euo pipefail
          cmake -S native -B build-lint -DCMAKE_BUILD_TYPE=Release -DPEPEPOW_ENABLE_CUDA=OFF -DPEPEPOW_BUILD_TESTS=ON
          cmake --build build-lint --parallel 2
          ctest --test-dir build-lint --output-on-failure
