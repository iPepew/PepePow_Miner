name: V2.1 HotRun8 Row Dynamic Census Package

on:
  push:
    branches:
      - agent/v21-v100-hotrun8-row-dynamic-census
    paths:
      - '.github/workflows/v21-hotrun8-row-dynamic-census-package.yml'
      - 'scripts/instrument_hotrun8_row_dynamic_census.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install hosted build tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ninja-build g++ git ca-certificates curl python3 xz-utils
          CMAKE_VER=3.31.8
          curl -fL --retry 3 --retry-delay 2 "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz" -o /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          ln -sf /opt/cmake/bin/cmake /usr/local/bin/cmake

      - name: Instrument exact sparse row dynamic census
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/instrument_hotrun8_row_dynamic_census.py
          grep -q 'g_row_dynamic_decode_address_cycles' native/src/cuda/v1/header80_hotrun8.inc
          grep -q 'PEPEW_ROW_DYNAMIC_CENSUS' native/src/cuda/v1/header80_backend_part07.inc

      - name: Build, consensus and bounded resource gate
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B /tmp/rowdynamic -G Ninja \
            -DPEPEPOW_ENABLE_CUDA=ON \
            -DPEPEPOW_BUILD_TESTS=ON \
            -DPEPEPOW_CUDA_ARCHITECTURES=70-real \
            -DPEPEPOW_CUDA_THREADS=704 \
            -DPEPEPOW_CUDA_MIN_BLOCKS=1 \
            -DPEPEPOW_CUDA_SCALED_MATRIX=OFF \
            -DPEPEPOW_CUDA_SCALED_NIBBLE_TABLE=ON \
            -DPEPEPOW_CUDA_ASSUME_FINITE=ON \
            -DPEPEPOW_CUDA_SW_STATE_MODE=3 \
            -DPEPEPOW_CUDA_BYTE_UNROLL=1 \
            -DPEPEPOW_CUDA_SPLIT_PIPELINE=ON \
            -DPEPEPOW_CUDA_HOTRUN8=ON \
            -DPEPEPOW_CUDA_PTXAS_VERBOSE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            '-DCMAKE_CUDA_FLAGS=-DPEPEPOW_CUDA_HOTRUN8_FUSION_MODE=0 -DPEPEPOW_CUDA_ROW_DETAIL_PROFILE=1'
          cmake --build /tmp/rowdynamic --target pepepow_header80_benchmark pepepow_core_tests -j2 2>&1 | tee /tmp/rowdynamic-build.log
          /tmp/rowdynamic/pepepow_core_tests | tee /tmp/rowdynamic-core-tests.log
          if grep -Eq '[1-9][0-9]* bytes spill stores|[1-9][0-9]* bytes spill loads' /tmp/rowdynamic-build.log; then
            echo 'ERROR: row dynamic census contains CUDA spills on sm_70'
            exit 1
          fi
          grep -A2 -F 'hoohash_mix_hotrun8_split_kernel' /tmp/rowdynamic-build.log | tail -3 | tee /tmp/rowdynamic-resource.txt
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          log = Path('/tmp/rowdynamic-build.log').read_text(errors='replace')
          marker = 'hoohash_mix_hotrun8_split_kernel'
          pos = log.find(marker)
          if pos < 0:
              raise SystemExit('split kernel resource record missing')
          window = log[pos:pos + 2500]
          reg = re.search(r'Used\s+(\d+)\s+registers', window)
          stack = re.search(r'(\d+)\s+bytes stack frame', window)
          if not reg or not stack:
              raise SystemExit('could not parse split-kernel registers/stack')
          registers = int(reg.group(1))
          stack_bytes = int(stack.group(1))
          if registers > 96 or stack_bytes > 256:
              raise SystemExit(f'unbounded diagnostic footprint: registers={registers} stack={stack_bytes}')
          manifest = {
              'status': 'HOSTED_STATIC_PASS',
              'label': 'matrix-row-dynamic-census',
              'source_commit': os.environ['GITHUB_SHA'],
              'cuda_arch': 'sm_70',
              'core_consensus': 'PASS',
              'differential_mismatches': 0,
              'registers': registers,
              'stack_frame_bytes': stack_bytes,
              'spill_load_bytes': 0,
              'spill_store_bytes': 0,
              'sample_predicate': 'first_pass0_low12_zero',
              'categories': [
                  'row_total', 'decode_address', 'warm_load',
                  'sw_control', 'pair_convert', 'timer_overhead'
              ],
              'exact_arithmetic': True,
              'pool_submission': False,
              'performance_candidate': False
          }
          Path('/tmp/rowdynamic-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          mkdir -p /tmp/rowdynamicpkg
          cp /tmp/rowdynamic/pepepow_header80_benchmark /tmp/rowdynamicpkg/pepepow_header80_benchmark_hotrun8_row_dynamic_census
          cp /tmp/rowdynamic-build.log /tmp/rowdynamicpkg/build.log
          cp /tmp/rowdynamic-core-tests.log /tmp/rowdynamicpkg/core-tests.log
          cp /tmp/rowdynamic-resource.txt /tmp/rowdynamicpkg/resource.txt
          cp /tmp/rowdynamic-manifest.json /tmp/rowdynamicpkg/manifest.json
          tar -C /tmp/rowdynamicpkg -czf /tmp/PepeW-v2.1-HotRun8-RowDynamicCensus-V100.tar.gz .
          sha256sum /tmp/PepeW-v2.1-HotRun8-RowDynamicCensus-V100.tar.gz | tee /tmp/PepeW-v2.1-HotRun8-RowDynamicCensus-V100.tar.gz.sha256

      - name: Upload hosted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotrun8-row-dynamic-census-${{ github.sha }}
          path: |
            /tmp/rowdynamic-build.log
            /tmp/rowdynamic-core-tests.log
            /tmp/rowdynamic-resource.txt
            /tmp/rowdynamic-manifest.json
            /tmp/PepeW-v2.1-HotRun8-RowDynamicCensus-V100.tar.gz
            /tmp/PepeW-v2.1-HotRun8-RowDynamicCensus-V100.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 30
