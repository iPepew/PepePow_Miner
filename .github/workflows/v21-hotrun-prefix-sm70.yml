name: V2 Hot-Run Prefix SM70 Resource Gate

on:
  push:
    branches:
      - agent/v21-v100-hotrun-prefix
    paths:
      - native/tests/hotrun_prefix_compile_probe.cu
      - .github/workflows/v21-hotrun-prefix-sm70.yml
  workflow_dispatch:

jobs:
  resource:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile width 4/8/16 prefix probe for Volta
        shell: bash
        run: |
          set -euo pipefail
          /usr/local/cuda/bin/nvcc -std=c++17 -O3 -arch=sm_70 -lineinfo \
            -Xptxas=-v \
            -c native/tests/hotrun_prefix_compile_probe.cu \
            -o /tmp/hotrun_prefix_probe.o 2>&1 | tee /tmp/ptxas-hotrun.log
          test -s /tmp/hotrun_prefix_probe.o
          ! grep -Eq '[1-9][0-9]* bytes spill (stores|loads)' /tmp/ptxas-hotrun.log
      - name: Upload resource log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotrun-prefix-sm70-${{ github.sha }}
          path: /tmp/ptxas-hotrun.log
          if-no-files-found: warn
          retention-days: 30
